<svg aria-label="参数从1增加到1.8，损失从2减到0.08" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 830 192"><title>梯度下降数值对照</title><rect fill="#e8f1f5" height="124" rx="3" width="365" x="30" y="35"></rect><rect fill="#e2f0ea" height="124" rx="3" width="365" x="430" y="35"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="19" x="50" y="65">更新前 w=1</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="50" y="96">x=2 → 预测2，目标4</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="20" x="50" y="126">L=0.5×(2−4)²=2</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="19" x="450" y="65">梯度−4，学习率0.2</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="450" y="96">w新=1−0.2×(−4)=1.8</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="20" x="450" y="126">新损失=0.08</text></svg>