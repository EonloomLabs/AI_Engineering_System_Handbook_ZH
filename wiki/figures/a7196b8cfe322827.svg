<svg aria-label="MCP连起接口，不自动交出权限" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg"><title>MCP连起接口，不自动交出权限</title><rect fill="white" height="780" width="960"></rect><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="26" y="31.0">消息沿参与方流转；每条箭头标注同一轮的具体对象</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="60.0" y="90.0">Host</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="480.0" y="90.0">Client</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="900.0" y="90.0">Server</text><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="60.0" x2="60.0" y1="109" y2="706"></line><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="480.0" x2="480.0" y1="109" y2="706"></line><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="900.0" x2="900.0" y1="109" y2="706"></line><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="125"></rect><rect fill="#EFF4F8" height="29" stroke="none" width="725" x="117" y="126.0"></rect><text fill="#285D96" font-size="16" font-weight="650" text-anchor="start" x="132" y="146.0">01  建立连接并与Server协商能力</text><line stroke="#285D96" stroke-width="1.6" x1="60.0" x2="480.0" y1="165" y2="165"></line><polygon fill="#285D96" points="480.00,165.00 472.00,161.50 472.00,168.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="192.0">只得到连接/能力，不等于授权</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="208"></rect><text fill="#536473" font-size="16" font-weight="400" text-anchor="start" x="132" y="229.0">02  请求工具列表</text><line stroke="#285D96" stroke-width="1.6" x1="480.0" x2="900.0" y1="248" y2="248"></line><polygon fill="#285D96" points="900.00,248.00 892.00,244.50 892.00,251.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="275.0">发起发现</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="291"></rect><text fill="#536473" font-size="16" font-weight="400" text-anchor="start" x="132" y="312.0">03  返回工具描述与输入结构</text><line stroke="#285D96" stroke-width="1.6" x1="900.0" x2="480.0" y1="331" y2="331"></line><polygon fill="#285D96" points="480.00,331.00 488.00,334.50 488.00,327.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="358.0">描述被获知，尚未执行</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="374"></rect><text fill="#536473" font-size="16" font-weight="400" text-anchor="start" x="132" y="395.0">04  交付工具描述供Host选择</text><line stroke="#285D96" stroke-width="1.6" x1="480.0" x2="60.0" y1="414" y2="414"></line><polygon fill="#285D96" points="60.00,414.00 68.00,417.50 68.00,410.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="441.0">Host决定向模型暴露的集合</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="457"></rect><text fill="#536473" font-size="16" font-weight="400" text-anchor="start" x="132" y="478.0">05  Host批准后发送调用</text><line stroke="#285D96" stroke-width="1.6" x1="480.0" x2="900.0" y1="497" y2="497"></line><polygon fill="#285D96" points="900.00,497.00 892.00,493.50 892.00,500.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="524.0">独立核对参数和权限</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="540"></rect><text fill="#536473" font-size="16" font-weight="400" text-anchor="start" x="132" y="561.0">06  返回结果或错误</text><line stroke="#285D96" stroke-width="1.6" x1="900.0" x2="480.0" y1="580" y2="580"></line><polygon fill="#285D96" points="480.00,580.00 488.00,583.50 488.00,576.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="607.0">执行结果可被回填</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="623"></rect><text fill="#536473" font-size="16" font-weight="400" text-anchor="start" x="132" y="644.0">07  把结果加入下一轮输入</text><line stroke="#285D96" stroke-width="1.6" x1="480.0" x2="60.0" y1="663" y2="663"></line><polygon fill="#285D96" points="60.00,663.00 68.00,666.50 68.00,659.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="690.0">LLM才得到新观察</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="723" y2="723"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="746.0">时间自上而下；行距不代表耗时。实线是请求/动作，虚线表示图中明确的返回。来源为本节固定教学消息，不推测闭源内部。</text></svg>