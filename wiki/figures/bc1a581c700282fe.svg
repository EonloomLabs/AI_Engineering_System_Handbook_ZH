<svg aria-label="超时告诉你没收到，不告诉你没发生：请求 op-1" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 494" xmlns="http://www.w3.org/2000/svg"><title>超时告诉你没收到，不告诉你没发生：请求 op-1</title><rect fill="#ffffff" height="494" rx="3" width="820"></rect><line stroke="#d6dfe6" stroke-width="3" x1="56" x2="56" y1="46" y2="459"></line><circle cx="56" cy="47" fill="#285d96" r="10"></circle><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="53">请求 op-1</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="52">创建一条记录；客户端等待回执</text><circle cx="56" cy="116" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="122">服务端提交</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="121">记录已真实创建，副作用已发生</text><circle cx="56" cy="185" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="191">回执丢失</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="190">客户端超时，无法由此推断失败</text><circle cx="56" cy="254" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="260">错误做法</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="259">换新操作ID重试，可能创建第二条</text><circle cx="56" cy="323" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="329">安全恢复</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="328">使用稳定操作ID核对或幂等重试</text><circle cx="56" cy="392" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="398">明确结果</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="397">返回原结果，或确认未执行后再重试</text></svg>