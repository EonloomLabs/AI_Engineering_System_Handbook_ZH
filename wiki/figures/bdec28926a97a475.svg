<svg aria-label="50秒的轨迹中，第一处状态失真在哪里" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 587" xmlns="http://www.w3.org/2000/svg"><title>50秒的轨迹中，第一处状态失真在哪里</title><rect fill="#fff" height="587" width="390" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">横轴：从任务开始后的秒数</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="93.0">检索</text><rect fill="#eff4f8" height="32" rx="4" stroke="#285d96" width="10.8" x="90.0" y="70"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="90" y="125.0">0—2秒</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="168.0">M1</text><rect fill="#eff4f8" height="32" rx="4" stroke="#285d96" width="54.0" x="100.8" y="145"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="90" y="200.0">2—12秒</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="243.0">c19</text><rect fill="#eff4f8" height="32" rx="4" stroke="#285d96" width="5.4" x="154.8" y="220"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="90" y="275.0">12—13秒</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="318.0">压缩</text><rect fill="#eff4f8" height="32" rx="4" stroke="#285d96" width="37.8" x="160.2" y="295"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="90" y="350.0">13—20秒</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="393.0">M2/c22</text><rect fill="#eff4f8" height="32" rx="4" stroke="#285d96" width="64.8" x="198.0" y="370"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="90" y="425.0">20—32秒</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="468.0">返工</text><rect fill="#eff4f8" height="32" rx="4" stroke="#285d96" width="97.2" x="262.8" y="445"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="90" y="500.0">32—50秒</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="538.0">c19之后的压缩把未知写成失败，后续链条才进入重复修</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="559.0">改。矩形长度按同一时标绘制。</text></svg>