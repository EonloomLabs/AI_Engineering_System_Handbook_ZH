<svg aria-label="压缩必须保留否定与未完成状态，而不只是主题词" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 535" xmlns="http://www.w3.org/2000/svg"><title>压缩必须保留否定与未完成状态，而不只是主题词</title><rect fill="white" height="535" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">同一exclude任务：比较可恢复摘要与错误摘要</text><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="28" y="86.0">原始约束 / 事实</text><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="340" y="86.0">可恢复摘要</text><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="650" y="86.0">错误摘要（反例）</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="24" y="115"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="37" y="145.0">修复 exclude 行为</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="336" y="115"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="349" y="145.0">继续修复 exclude</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="646" y="115"></rect><text fill="#A13A37" font-size="16" font-weight="400" text-anchor="start" x="659" y="145.0">重设计整个接口</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="24" y="207"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="37" y="237.0">不得改公开 API</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="336" y="207"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="349" y="237.0">不改公开 API</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="646" y="207"></rect><text fill="#A13A37" font-size="16" font-weight="400" text-anchor="start" x="659" y="237.0">可以重构 API</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="24" y="299"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="37" y="329.0">单元已过；集成未运行</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="336" y="299"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="349" y="329.0">单元已过；集成未跑</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="646" y="299"></rect><text fill="#A13A37" font-size="16" font-weight="400" text-anchor="start" x="659" y="329.0">已测试通过</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="24" y="391"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="37" y="421.0">保留文件与测试证据</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="336" y="391"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="349" y="421.0">回查原文件与当前版本</text><rect fill="white" height="70" rx="0" stroke="#D6DFE6" stroke-width="1" width="290" x="646" y="391"></rect><text fill="#A13A37" font-size="16" font-weight="400" text-anchor="start" x="659" y="421.0">只留一句“进展顺利”</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="478" y2="478"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="501.0">错误列是明确构造的反例，不是下一步执行建议。摘要是恢复入口；环境改变后仍须重新核验证据。</text></svg>