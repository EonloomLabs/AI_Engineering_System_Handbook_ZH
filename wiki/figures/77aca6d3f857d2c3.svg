<svg aria-label="残差前向相加，反向在分叉处相加" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 565" xmlns="http://www.w3.org/2000/svg"><title>残差前向相加，反向在分叉处相加</title><rect fill="white" height="565" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">同一条旁路，在前向与反向中承担不同作用</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="28" y="93.0">前向：y = x + f(x)</text><rect fill="white" height="58" rx="3" stroke="#D6DFE6" stroke-width="1" width="120" x="45" y="143"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="59" y="169.0">x</text><rect fill="white" height="58" rx="3" stroke="#D6DFE6" stroke-width="1" width="180" x="340" y="143"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="354" y="169.0">f(x)</text><rect fill="white" height="58" rx="3" stroke="#D6DFE6" stroke-width="1" width="120" x="785" y="143"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="799" y="169.0">y</text><line stroke="#285D96" stroke-width="1.6" x1="165" x2="332" y1="172" y2="172"></line><polygon fill="#285D96" points="332.00,172.00 324.00,168.50 324.00,175.50"></polygon><line stroke="#285D96" stroke-width="1.6" x1="520" x2="777" y1="172" y2="172"></line><polygon fill="#285D96" points="777.00,172.00 769.00,168.50 769.00,175.50"></polygon><path d="M195 172 V255 H720 V172" fill="none" stroke="#16766B" stroke-width="1.6"></path><line stroke="#16766B" stroke-width="1.6" x1="720" x2="720" y1="203" y2="172"></line><polygon fill="#16766B" points="720.00,172.00 716.50,180.00 723.50,180.00"></polygon><text fill="#16766B" font-size="15" font-weight="400" text-anchor="middle" x="425" y="246.0">不经过 f 的原值旁路</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="28" y="330.0">反向：dx = dy + df_path</text><rect fill="white" height="58" rx="3" stroke="#D6DFE6" stroke-width="1" width="120" x="45" y="380"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="59" y="406.0">dx</text><rect fill="white" height="58" rx="3" stroke="#D6DFE6" stroke-width="1" width="180" x="340" y="380"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="354" y="406.0">f的反向</text><rect fill="white" height="58" rx="3" stroke="#D6DFE6" stroke-width="1" width="120" x="785" y="380"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="799" y="406.0">dy</text><line stroke="#285D96" stroke-width="1.6" x1="785" x2="528" y1="409" y2="409"></line><polygon fill="#285D96" points="528.00,409.00 536.00,412.50 536.00,405.50"></polygon><line stroke="#285D96" stroke-width="1.6" x1="340" x2="173" y1="409" y2="409"></line><polygon fill="#285D96" points="173.00,409.00 181.00,412.50 181.00,405.50"></polygon><path d="M720 409 V492 H205 V409" fill="none" stroke="#16766B" stroke-width="1.6"></path><line stroke="#16766B" stroke-width="1.6" x1="205" x2="205" y1="440" y2="409"></line><polygon fill="#16766B" points="205.00,409.00 201.50,417.00 208.50,417.00"></polygon><text fill="#16766B" font-size="15" font-weight="400" text-anchor="middle" x="425" y="483.0">旁路直接贡献 dy，不能漏加</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="508.0" y2="508.0"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="531.0">共享输入x有多条到损失的路径，必须把各路径的梯度加起来；不能只沿f这一条支路回传。</text></svg>