<svg aria-label="省参数、省位数、少激活不是同一种优化：原有大权重" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 396" xmlns="http://www.w3.org/2000/svg"><title>省参数、省位数、少激活不是同一种优化：原有大权重</title><rect fill="#ffffff" height="396" rx="3" width="820"></rect><rect fill="#eff4f8" height="118" rx="3" stroke="#285d96" stroke-width="2.5" width="238" x="26" y="38"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="65">原有大权重</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="87">要存储，也可能要训练</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="286.00,97.00 276.00,93.00 276.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="65">LoRA</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="87">冻结原权重，训练小的增量</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="550.00,97.00 540.00,93.00 540.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="568" y="65">量化</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="87">把同一对象存到较粗的数值刻</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="109">度</text><line stroke="#d6dfe6" stroke-width="2" x1="673.0" x2="673.0" y1="159" y2="177"></line><line stroke="#d6dfe6" stroke-width="2" x1="145.0" x2="673.0" y1="177" y2="177"></line><line stroke="#d6dfe6" stroke-width="2" x1="145.0" x2="145.0" y1="177" y2="195"></line><polygon fill="#d6dfe6" points="145.00,195.00 149.00,185.00 141.00,185.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="26" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="225">MoE</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="247">多组专家，只激活部分计算</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="257.0" y2="257.0"></line><polygon fill="#d6dfe6" points="286.00,257.00 276.00,253.00 276.00,261.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="225">不同的账</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="247">总参数/训练参数/激活计算/</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="269">位数</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="257.0" y2="257.0"></line><polygon fill="#d6dfe6" points="550.00,257.00 540.00,253.00 540.00,261.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="568" y="225">实际验收</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="247">质量、显存、吞吐分开测量</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="30" y="356">教学流程；高亮表示当前步骤，不表示真实耗时比例。</text></svg>