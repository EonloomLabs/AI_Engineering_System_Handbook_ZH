<svg aria-label="同一份已训练权重：逐轮预测、追加、停止" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 513" xmlns="http://www.w3.org/2000/svg"><title>同一份已训练权重：逐轮预测、追加、停止</title><rect fill="white" height="513" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">每一轮都用 θ*；参数在推理中不改变</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="28" y="82.0">轮次</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="170" y="82.0">本轮实际输入</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="485" y="82.0">缓存覆盖</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="730" y="82.0">新选中的Token</text><rect fill="white" height="92" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="906" x="24" y="115"></rect><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="33" y="148.0">Prefill</text><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="175" y="148.0">BOS / 我 / 爱</text><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="490" y="148.0">0 → 3</text><text fill="#285D96" font-size="17" font-weight="600" text-anchor="start" x="735" y="148.0">学习</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="180" y="183.0">新选出的项尚未做自己的前向</text><rect fill="white" height="92" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="906" x="24" y="231"></rect><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="33" y="264.0">Decode 1</text><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="175" y="264.0">学习</text><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="490" y="264.0">3 → 4</text><text fill="#285D96" font-size="17" font-weight="600" text-anchor="start" x="735" y="264.0">！</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="180" y="299.0">新选出的项尚未做自己的前向</text><rect fill="white" height="92" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="906" x="24" y="347"></rect><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="33" y="380.0">Decode 2</text><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="175" y="380.0">！</text><text fill="#182632" font-size="17" font-weight="400" text-anchor="start" x="490" y="380.0">4 → 5</text><text fill="#285D96" font-size="17" font-weight="600" text-anchor="start" x="735" y="380.0">EOS</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="180" y="415.0">选到EOS，宿主结束，不再为EOS追加缓存</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="456" y2="456"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="479.0">数值与选取来自本包 run.json 的真实CPU教学实验；默认argmax。三次前向的logits与完整重算一致。</text></svg>