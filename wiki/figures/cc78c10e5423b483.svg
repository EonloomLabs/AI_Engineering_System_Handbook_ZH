<svg aria-label="RoPE保留的是相对角度，不是每轮重新开始的位置" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 899" xmlns="http://www.w3.org/2000/svg"><title>RoPE保留的是相对角度，不是每轮重新开始的位置</title><rect fill="#fff" height="899" width="390" x="0" y="0"></rect><line stroke="#d6dfe6" stroke-width="1" x1="105.0" x2="295.0" y1="170" y2="170"></line><line stroke="#d6dfe6" stroke-width="1" x1="195.0" x2="195.0" y1="80" y2="260"></line><line stroke="#285d96" stroke-width="2" x1="195.0" x2="267.0" y1="170" y2="170"></line><polygon fill="#285d96" points="267.00,170.00 258.00,174.00 258.00,166.00"></polygon><line stroke="#8c4a26" stroke-width="2" x1="199.0" x2="199.0" y1="174" y2="114"></line><polygon fill="#8c4a26" points="199.00,114.00 203.00,123.00 195.00,123.00"></polygon><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="195.0" y="292.0">位置差1：点积0</text><line stroke="#d6dfe6" stroke-width="1" x1="105.0" x2="295.0" y1="430" y2="430"></line><line stroke="#d6dfe6" stroke-width="1" x1="195.0" x2="195.0" y1="340" y2="520"></line><line stroke="#285d96" stroke-width="2" x1="195.0" x2="195.0" y1="430" y2="358"></line><polygon fill="#285d96" points="195.00,358.00 199.00,367.00 191.00,367.00"></polygon><line stroke="#8c4a26" stroke-width="2" x1="199.0" x2="139.0" y1="434" y2="434"></line><polygon fill="#8c4a26" points="139.00,434.00 148.00,430.00 148.00,438.00"></polygon><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="195.0" y="552.0">双方加1：仍点积0</text><line stroke="#d6dfe6" stroke-width="1" x1="105.0" x2="295.0" y1="690" y2="690"></line><line stroke="#d6dfe6" stroke-width="1" x1="195.0" x2="195.0" y1="600" y2="780"></line><line stroke="#285d96" stroke-width="2" x1="195.0" x2="267.0" y1="690" y2="690"></line><polygon fill="#285d96