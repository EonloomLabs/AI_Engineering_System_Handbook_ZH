<svg aria-label="向量同维度，不代表能放在同一个相似度空间" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 351" xmlns="http://www.w3.org/2000/svg"><title>向量同维度，不代表能放在同一个相似度空间</title><rect fill="#fff" height="351" width="390" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">同样二维，坐标意义可以不同</text><line stroke="#d6dfe6" stroke-width="1" x1="50.0" x2="340.0" y1="190" y2="190"></line><line stroke="#d6dfe6" stroke-width="1" x1="195.0" x2="195.0" y1="45" y2="270"></line><line stroke="#182632" stroke-width="2" x1="195.0" x2="310.0" y1="190" y2="190"></line><polygon fill="#182632" points="310.00,190.00 301.00,194.00 301.00,186.00"></polygon><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="310.0" y="215.0">q</text><line stroke="#285d96" stroke-width="2" x1="195.0" x2="298.5" y1="190" y2="178.5"></line><polygon fill="#285d96" points="298.50,178.50 290.00,183.47 289.11,175.52"></polygon><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="298.5" y="160.5">配套d</text><line stroke="#8c4a26" stroke-width="2" x1="195.0" x2="183.5" y1="190" y2="86.5"></line><polygon fill="#8c4a26" points="183.50,86.50 188.47,95.00 180.52,95.89"></polygon><text fill="#8c4a26" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="183.5" y="68.5">换模型d</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="302.0">仅文档向量旋转后，查询没有同步改变。距离公式仍能</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="323.0">运行，但原先的相关性不再由该配对保证。</text></svg>