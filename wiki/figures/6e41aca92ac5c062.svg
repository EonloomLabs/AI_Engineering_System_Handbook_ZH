<svg aria-label="参数和梯度是两份状态：只有step才改参数" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 525" xmlns="http://www.w3.org/2000/svg"><title>参数和梯度是两份状态：只有step才改参数</title><rect fill="white" height="525" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">一次更新中，θ何时真正改变？</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="28" y="83.0">动作</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="265" y="83.0">参数 θ</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="488" y="83.0">梯度 .grad</text><text fill="#536473" font-size="15" font-weight="600" text-anchor="start" x="720" y="83.0">本步产生或使用</text><rect fill="white" height="59" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="902" x="24" y="112"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="35" y="146.0">zero_grad</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="272" y="146.0">θ₀</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="495" y="146.0">清空/置零</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="727" y="146.0">清除旧梯度</text><rect fill="white" height="59" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="902" x="24" y="182"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="35" y="216.0">forward + loss</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="272" y="216.0">θ₀</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="495" y="216.0">尚未求出</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="727" y="216.0">logits、loss、激活</text><rect fill="white" height="59" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="902" x="24" y="252"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="35" y="286.0">backward</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="272" y="286.0">θ₀</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="495" y="286.0">∂L / ∂θ₀</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="727" y="286.0">沿图汇合每条梯度</text><rect fill="#EFF4F8" height="59" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="902" x="24" y="322"></rect><text fill="#285D96" font-size="16" font-weight="600" text-anchor="start" x="35" y="356.0">optimizer.step</text><text fill="#285D96" font-size="16" font-weight="600" text-anchor="start" x="272" y="356.0">θ₁</text><text fill="#285D96" font-size="16" font-weight="600" text-anchor="start" x="495" y="356.0">仍是旧前向的梯度</text><text fill="#285D96" font-size="16" font-weight="600" text-anchor="start" x="727" y="356.0">更新θ与Adam状态</text><rect fill="white" height="59" rx="0" stroke="#D6DFE6" stroke-width="0.6" width="902" x="24" y="392"></rect><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="35" y="426.0">下一次 forward</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="272" y="426.0">使用θ₁</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="495" y="426.0">另行清理/累计</text><text fill="#182632" font-size="16" font-weight="400" text-anchor="start" x="727" y="426.0">新激活、新损失</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="468" y2="468"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="491.0">有意累积微批梯度与忘记清理旧梯度不同。backward之后还没step，不能声称权重已更新。</text></svg>