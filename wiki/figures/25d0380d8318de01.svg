<svg aria-label="测试是找反例，不是给代码盖绿章：明确需求" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 396" xmlns="http://www.w3.org/2000/svg"><title>测试是找反例，不是给代码盖绿章：明确需求</title><rect fill="#ffffff" height="396" rx="3" width="820"></rect><rect fill="#eff4f8" height="118" rx="3" stroke="#285d96" stroke-width="2.5" width="238" x="26" y="38"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="65">明确需求</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="87">排除*.tmp，但保留其余文件</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="286.00,97.00 276.00,93.00 276.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="65">构造小反例</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="87">a.py、b.tmp、nested/c.tmp</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="550.00,97.00 540.00,93.00 540.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="568" y="65">先看原始失败</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="87">确认旧代码确实没有正确排除</text><line stroke="#d6dfe6" stroke-width="2" x1="673.0" x2="673.0" y1="159" y2="177"></line><line stroke="#d6dfe6" stroke-width="2" x1="145.0" x2="673.0" y1="177" y2="177"></line><line stroke="#d6dfe6" stroke-width="2" x1="145.0" x2="145.0" y1="177" y2="195"></line><polygon fill="#d6dfe6" points="145.00,195.00 149.00,185.00 141.00,185.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="26" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="225">实施最小修改</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="247">修复匹配语义，不改无关API</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="257.0" y2="257.0"></line><polygon fill="#d6dfe6" points="286.00,257.00 276.00,253.00 276.00,261.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="225">测试针对行为</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="247">检查保留、排除、嵌套和空规</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="269">则</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="257.0" y2="257.0"></line><polygon fill="#d6dfe6" points="550.00,257.00 540.00,253.00 540.00,261.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="568" y="225">绑定版本交付</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="247">绿色结果属于当前代码，而非</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="269">旧文件</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="30" y="356">教学流程；高亮表示当前步骤，不表示真实耗时比例。</text></svg>