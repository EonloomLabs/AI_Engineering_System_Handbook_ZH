<svg aria-label="目录指向D1和D3，排除指向D1，规则指向D1和D2" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 840 220"><title>倒排索引示例</title><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" x="26" y="28">原文档</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" x="465" y="28">倒排表（检索时直接查）</text><rect fill="#eaf2f5" height="43" rx="4" width="347" x="23" y="44"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="37" y="72">D1：目录 排除 规则</text><rect fill="#eaf2f5" height="43" rx="4" width="347" x="23" y="96"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="37" y="124">D2：文件 路径 规则</text><rect fill="#eaf2f5" height="43" rx="4" width="347" x="23" y="148"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="37" y="176">D3：目录 权限 检查</text><rect fill="#e0eef0" height="43" rx="4" width="340" x="465" y="44"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="480" y="72">目录 → D1,D3</text><rect fill="#e0eef0" height="43" rx="4" width="340" x="465" y="96"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="480" y="124">排除 → D1</text><rect fill="#e0eef0" height="43" rx="4" width="340" x="465" y="148"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="480" y="176">规则 → D1,D2</text></svg>