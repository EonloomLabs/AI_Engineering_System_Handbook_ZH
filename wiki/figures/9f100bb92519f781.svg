<svg aria-label="拒绝草稿时的补偿，才保证目标分布不被带偏" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 522" xmlns="http://www.w3.org/2000/svg"><title>拒绝草稿时的补偿，才保证目标分布不被带偏</title><rect fill="#fff" height="522" width="390" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">从草稿分布到目标分布的概率质量</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="24" y="80.0">草稿 q</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="273.6" x="24" y="96"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="160.8" y="123.0">A:0.8</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="68.4" x="297.6" y="96"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="331.8" y="123.0">B:0.2</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="24" y="181.0">直接接受质量</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="171.0" x="24" y="197"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="109.5" y="224.0">A:0.5</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="68.4" x="195.0" y="197"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="229.2" y="224.0">B:0.2</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="24" y="282.0">拒绝补偿</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="102.6" x="24" y="298"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="75.3" y="325.0">B:0.3</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="24" y="383.0">最终目标 p</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="171.0" x="24" y="399"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="109.5" y="426.0">A:0.5</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="171.0" x="195.0" y="399"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="280.5" y="426.0">B:0.5</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="473.0">所有条使用同一个概率刻度0—1；中间接受总质量0.7，</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="494.0">剩余0.3由拒绝补偿填回B。</text></svg>