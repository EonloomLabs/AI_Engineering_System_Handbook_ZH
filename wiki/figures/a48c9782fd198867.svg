<svg aria-label="数据搬到GPU，改变的是位置而不是含义：先数对象" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 216" xmlns="http://www.w3.org/2000/svg"><title>数据搬到GPU，改变的是位置而不是含义：先数对象</title><rect fill="#fff" height="216" width="940" x="0" y="0"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="650" text-anchor="start" x="22" y="30.0">对象或位置</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="650" text-anchor="start" x="206" y="30.0">本步动作 / 条件</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="650" text-anchor="start" x="568" y="30.0">具体结果与边界</text><rect fill="#f7f9fb" height="51.5" rx="0" stroke="#fff" width="900" x="20" y="53"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="30" y="81.0">编号表 [2,3]</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="214" y="81.0">2×3</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="576" y="81.0">6个整数</text><line stroke="#d6dfe6" stroke-width="1" x1="20" x2="920" y1="104.5" y2="104.5"></line><rect fill="#fff" height="51.5" rx="0" stroke="#fff" width="900" x="20" y="104.5"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="30" y="132.5">特征表 [2,3,4]</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="214" y="13