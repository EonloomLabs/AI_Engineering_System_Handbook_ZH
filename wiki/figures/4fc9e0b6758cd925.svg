<svg aria-label="新增一个轴，究竟多了什么：先数一排编号" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 410" xmlns="http://www.w3.org/2000/svg"><title>新增一个轴，究竟多了什么：先数一排编号</title><rect fill="#ffffff" height="410" rx="3" width="820"></rect><rect fill="#fff" height="49" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="155" x="65" y="75"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="middle" x="142.5" y="105">我</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="middle" x="142.5" y="146">编号 1</text><rect fill="#fff" height="49" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="155" x="229" y="75"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="middle" x="306.5" y="105">爱</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="middle" x="306.5" y="146">编号 2</text><rect fill="#fff" height="49" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="155" x="393" y="75"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="middle" x="470.5" y="105">学习</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="middle" x="470.5" y="146">编号 3</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="20" font-weight="400" text-anchor="start" x="65" y="215">一条输入 × 三个位置；每个格子还是一个整数。</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="65" y="258">“形状[3]”描述格子怎样摆，不是里面三个数的值。</text></svg>