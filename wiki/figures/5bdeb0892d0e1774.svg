<svg aria-label="共通前向：参数从侧面进入；残差保留并汇合原表示" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 966" xmlns="http://www.w3.org/2000/svg"><title>共通前向：参数从侧面进入；残差保留并汇合原表示</title><rect fill="white" height="966" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">单层教学模型 · 两个残差汇合点必须保留</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="94"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="120.0">E[ids] + P[pos]</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="145.0">X  [B,T,4]</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="214"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="240.0">RMSNorm → Q/K/V</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="265.0">每行乘 Wq / Wk / Wv</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="334"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="360.0">掩码 + softmax → A @ V</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="385.0">沿来源位置混合</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="454"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="480.0">乘 Wo，再加回 X</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="505.0">R = X + Δattention</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="574"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="600.0">RMSNorm → W1 → ReLU → W2</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="625.0">4维 → 8维 → 4维</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="694"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="720.0">加回 R，再做 RMSNorm</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="745.0">H = R + ΔFFN</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="490" x="90" y="814"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="104" y="840.0">乘 U</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="104" y="865.0">logits [B,T,8]</text><line stroke="#285D96" stroke-width="1.6" x1="335" x2="335" y1="172" y2="207"></line><polygon fill="#285D96" points="335.00,207.00 338.50,199.00 331.50,199.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="335" x2="335" y1="292" y2="327"></line><polygon fill="#285D96" points="335.00,327.00 338.50,319.00 331.50,319.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="335" x2="335" y1="412" y2="447"></line><polygon fill="#285D96" points="335.00,447.00 338.50,439.00 331.50,439.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="335" x2="335" y1="532" y2="567"></line><polygon fill="#285D96" points="335.00,567.00 338.50,559.00 331.50,559.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="335" x2="335" y1="652" y2="687"></line><polygon fill="#285D96" points="335.00,687.00 338.50,679.00 331.50,679.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="335" x2="335" y1="772" y2="807"></line><polygon fill="#285D96" points="335.00,807.00 338.50,799.00 331.50,799.00"></polygon><path d="M90 133 H43 V493 H82" fill="none" stroke="#16766B" stroke-width="2"></path><line stroke="#16766B" stroke-width="1.6" x1="60" x2="82" y1="493" y2="493"></line><polygon fill="#16766B" points="82.00,493.00 74.00,489.50 74.00,496.50"><