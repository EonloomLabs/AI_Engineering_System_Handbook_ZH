676" x2="590" y1="861" y2="861"></line><polygon fill="#D6DFE6" points="590.00,861.00 598.00,864.50 598.00,857.50"></polygon><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="909" y2="909"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="932.0">箭头是数据依赖，不是耗时。训练与推理都调用 forward；损失、反向和更新不属于这个共通前向。</text></svg>