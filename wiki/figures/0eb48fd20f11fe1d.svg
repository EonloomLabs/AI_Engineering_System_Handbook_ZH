<svg aria-label="返回4篇中3篇相关所以精确率75%，真实相关5篇找到3篇所以召回率60%" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 805 175"><title>精确率与召回率的两个分母</title><text fill="#234254" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="24" y="28">实际相关共5篇，系统返回4篇，其中3篇相关、1篇不相关。</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="28" y="63">返回集合（4篇）</text><rect fill="#c4e3d6" height="53" width="165" x="26" y="77"></rect><rect fill="#c4e3d6" height="53" width="165" x="194" y="77"></rect><rect fill="#c4e3d6" height="53" width="165" x="362" y="77"></rect><rect fill="#ebdcd8" height="53" width="165" x="530" y="77"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" text-anchor="middle" x="108" y="110">相关1</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" text-anchor="middle" x="277" y="110">相关2</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" text-anchor="middle" x="444" y="110">相关3</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" text-anchor="middle" x="612" y="110">不相关</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="26" y="168">Precision = 3 / 4 = 75%</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" x="410" y="168">Recall = 3 / 5 = 60%</text></svg>