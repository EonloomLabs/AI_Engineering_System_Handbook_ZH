<svg aria-label="数据搬到GPU，改变的是位置而不是含义：先数对象" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 410" xmlns="http://www.w3.org/2000/svg"><title>数据搬到GPU，改变的是位置而不是含义：先数对象</title><rect fill="#ffffff" height="410" rx="3" width="820"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="35" y="111.6">整数编号</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="35" y="130.6">数</text><rect fill="#edf1ef" height="36" rx="3" stroke="#edf1ef" stroke-width="1.2" width="460" x="125" y="90"></rect><rect fill="#78afa0" height="36" rx="3" stroke="none" stroke-width="1.2" width="27.6" x="125" y="90"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="597" y="113.4">6</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="35" y="168.6">浮点特征</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="35" y="187.6">数</text><rect fill="#edf1ef" height="36" rx="3" stroke="#edf1ef" stroke-width="1.2" width="460" x="125" y="147"></rect><rect fill="#78afa0" height="36" rx="3" stroke="none" stroke-width="1.2" width="110.4" x="125" y="147"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="597" y="170.4">24</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="start" x="50" y="287">编号表与特征表不是同一种数据：这里6个整数编号、24个浮点特征。</text></svg>