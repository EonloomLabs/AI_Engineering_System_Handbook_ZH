<svg aria-label="有效时间与记录时间：系统何时知道，不等于事实何时生效" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 556" xmlns="http://www.w3.org/2000/svg"><title>有效时间与记录时间：系统何时知道，不等于事实何时生效</title><rect fill="white" height="556" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">同一事实有两条时间轴</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="26" y="157.0">有效时间</text><line stroke="#D6DFE6" stroke-width="1.6" x1="165" x2="915" y1="150" y2="150"></line><polygon fill="#D6DFE6" points="915.00,150.00 907.00,146.50 907.00,153.50"></polygon><line stroke="#182632" stroke-width="1" x1="165.0" x2="165.0" y1="144" y2="156"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="165.0" y="180.0">10/1</text><line stroke="#182632" stroke-width="1" x1="365.0" x2="365.0" y1="144" y2="156"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="365.0" y="180.0">10/3</text><line stroke="#182632" stroke-width="1" x1="565.0" x2="565.0" y1="144" y2="156"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="565.0" y="180.0">10/5</text><line stroke="#182632" stroke-width="1" x1="665.0" x2="665.0" y1="144" y2="156"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="665.0" y="180.0">10/6</text><line stroke="#182632" stroke-width="1" x1="865.0" x2="865.0" y1="144" y2="156"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="865.0" y="180.0">10/8</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="26" y="337.0">记录时间</text><line stroke="#D6DFE6" stroke-width="1.6" x1="165" x2="915" y1="330" y2="330"></line><polygon fill="#D6DFE6" points="915.00,330.00 907.00,326.50 907.00,333.50"></polygon><line stroke="#182632" stroke-width="1" x1="165.0" x2="165.0" y1="324" y2="336"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="165.0" y="360.0">10/1</text><line stroke="#182632" stroke-width="1" x1="365.0" x2="365.0" y1="324" y2="336"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="365.0" y="360.0">10/3</text><line stroke="#182632" stroke-width="1" x1="565.0" x2="565.0" y1="324" y2="336"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="565.0" y="360.0">10/5</text><line stroke="#182632" stroke-width="1" x1="665.0" x2="665.0" y1="324" y2="336"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="665.0" y="360.0">10/6</text><line stroke="#182632" stroke-width="1" x1="865.0" x2="865.0" y1="324" y2="336"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="middle" x="865.0" y="360.0">10/8</text><rect fill="#EFF4F8" height="32" rx="0" stroke="#285D96" stroke-width="1" width="400.0" x="165.0" y="106"></rect><text fill="#285D96" font-size="17" font-weight="600" text-anchor="middle" x="365.0" y="96.0">规则在1日至5日有效</text><line stroke="#16766B" stroke-width="2" x1="365.0" x2="365.0" y1="260" y2="328"></line><text fill="#16766B" font-size="16" font-weight="400" text-anchor="middle" x="365.0" y="246.0">系统录入生效</text><line stroke="#16766B" stroke-width="2" x1="865.0" x2="865.0" y1="260" y2="328"></line><text fill="#16766B" font-size="16" font-weight="400" text-anchor="middle" x="865.0" y="246.0">系统录入撤销</text><path d="M665.0 192 V390" fill="none" stroke="#A05720" stroke-dasharray="4 4" stroke-width="1.4"></path><text fill="#A05720" font-size="17" font-weight="600" text-anchor="middle" x="665.0" y="430.0">回放10/6的决策</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="80" y="474.0">真实有效期已经结束，但系统要到10/8才知道撤销。</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="499.0" y2="499.0"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="522.0">回放历史判断时同时固定“被问的时刻”和“当时已获知的资料”。不能把后来得知的信息偷放进过去的输入。</text></svg>