<svg aria-label="配对评测：20个任务中，改对与改错必须同时计入" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 557" xmlns="http://www.w3.org/2000/svg"><title>配对评测：20个任务中，改对与改错必须同时计入</title><rect fill="white" height="557" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">同一批任务逐题对齐，不比较两个无关样本</text><text fill="#536473" font-size="13" font-weight="400" text-anchor="middle" x="317.5" y="121.0">新成功</text><text fill="#536473" font-size="13" font-weight="400" text-anchor="middle" x="542.5" y="121.0">新失败</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="end" x="191" y="196.0">旧成功</text><rect fill="white" height="100" rx="0" stroke="#D6DFE6" stroke-width="0.65" width="225" x="205" y="133"></rect><text fill="#182632" font-size="15" font-weight="400" text-anchor="middle" x="317.5" y="196.0">12</text><rect fill="#EFF4F8" height="100" rx="0" stroke="#D6DFE6" stroke-width="0.65" width="225" x="430" y="133"></rect><text fill="#285D96" font-size="15" font-weight="600" text-anchor="middle" x="542.5" y="196.0">1</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="end" x="191" y="296.0">旧失败</text><rect fill="#EFF4F8" height="100" rx="0" stroke="#D6DFE6" stroke-width="0.65" width="225" x="205" y="233"></rect><text fill="#285D96" font-size="15" font-weight="600" text-anchor="middle" x="317.5" y="296.0">3</text><rect fill="white" height="100" rx="0" stroke="#D6DFE6" stroke-width="0.65" width="225" x="430" y="233"></rect><text fill="#182632" font-size="15" font-weight="400" text-anchor="middle" x="542.5" y="296.0">4</text><text fill="#16766B" font-size="22" font-weight="600" text-anchor="start" x="238" y="424.0">3 个新修复</text><text fill="#A13A37" font-size="22" font-weight="600" text-anchor="start" x="548" y="424.0">1 个回归</text><text fill="#285D96" font-size="21" font-weight="600" text-anchor="start" x="238" y="475.0">净改善 = (3−1) / 20 = 10 个百分点</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="500.0" y2="500.0"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="523.0">旧成功13/20，新成功15/20。对角线不改变净差；这20题的结果不能单凭百分比证明总体稳定收益。</text></svg>