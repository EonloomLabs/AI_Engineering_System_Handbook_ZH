<svg aria-label="删除源文档后，派生摘要与向量块还可能继续传播旧结论" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 819" xmlns="http://www.w3.org/2000/svg"><title>删除源文档后，派生摘要与向量块还可能继续传播旧结论</title><rect fill="#fff" height="819" width="390" x="0" y="0"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="18" y="38.0">1. C1向量块</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="73.0">来源</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="101.0">D1第3段</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="137.0">撤回D1后应做什么</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="165.0">从检索中删除或标失效</text><line stroke="#d6dfe6" stroke-width="1" x1="18" x2="372" y1="186.0" y2="186.0"></line><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="18" y="222.0">2. S1摘要</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="257.0">来源</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="285.0">D1+C2</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="321.0">撤回D1后应做什么</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="349.0">重新生成或标明部分依据撤回</text><line stroke="#d6dfe6" stroke-width="1" x1="18" x2="372" y1="370.0" y2="370.0"></line><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="18" y="406.0">3. M1记忆</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="441.0">来源</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="469.0">由S1提取</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="505.0">撤回D1后应做什么</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="533.0">复核来源，不能当独立确认</text><line stroke="#d6dfe6" stroke-width="1" x1="18" x2="372" y1="554.0" y2="554.0"></line><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="18" y="590.0">4. 响应缓存</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="625.0">来源</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="653.0">引用M1的旧答案</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="13" font-weight="400" text-anchor="start" x="22" y="689.0">撤回D1后应做什么</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="717.0">按相关键失效化</text><line stroke="#d6dfe6" stroke-width="1" x1="18" x2="372" y1="738.0" y2="738.0"></line><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="770.0">每行是一组对应关系；独立对照不视为前一行的继续运</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="791.0">算。</text></svg>