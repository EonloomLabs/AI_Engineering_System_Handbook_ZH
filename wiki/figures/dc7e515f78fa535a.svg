<svg aria-label="文字、字节、Token、编号是四件事：原文字" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 396" xmlns="http://www.w3.org/2000/svg"><title>文字、字节、Token、编号是四件事：原文字</title><rect fill="#ffffff" height="396" rx="3" width="820"></rect><rect fill="#eff4f8" height="118" rx="3" stroke="#285d96" stroke-width="2.5" width="238" x="26" y="38"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="65">原文字</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="87">我爱学习 / 你爱</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="286.00,97.00 276.00,93.00 276.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="65">文本片段</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="87">我／爱／学习；你／爱</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="550.00,97.00 540.00,93.00 540.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="568" y="65">词表对应</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="87">我1、爱2、学习3、你4</text><line stroke="#d6dfe6" stroke-width="2" x1="673.0" x2="673.0" y1="159" y2="177"></line><line stroke="#d6dfe6" stroke-width="2" x1="145.0" x2="673.0" y1="177" y2="177"></line><line stroke="#d6dfe6" stroke-width="2" x1="145.0" x2="145.0" y1="177" y2="195"></line><polygon fill="#d6dfe6" points="145.00,195.00 149.00,185.00 141.00,185.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="26" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="225">整数序列</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="247">[1,2,3] 与 [4,2]</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="257.0" y2="257.0"></line><polygon fill="#d6dfe6" points="286.00,257.00 276.00,253.00 276.00,261.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="225">解码校验</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="247">按同一规则还原片段</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="257.0" y2="257.0"></line><polygon fill="#d6dfe6" points="550.00,257.00 540.00,253.00 540.00,261.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="198"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="568" y="225">明确边界</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="247">不等于按字分词，也不是语义</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="568" y="269">打分</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="30" y="356">教学流程；高亮表示当前步骤，不表示真实耗时比例。</text></svg>