<svg aria-label="反向按真实依赖传递：两个残差点都要合并梯度" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 1030" xmlns="http://www.w3.org/2000/svg"><title>反向按真实依赖传递：两个残差点都要合并梯度</title><rect fill="white" height="1030" width="960"></rect><text fill="#182632" font-size="19" font-weight="600" text-anchor="start" x="26" y="32.0">与教学模型 manual_backward 的计算对象逐项对应</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="94"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="120.0">dz = (p − onehot) / N</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="145.0">输出概率与真实标签产生梯度</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="206"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="232.0">dU、dfinal → 最后RMSNorm反向</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="257.0">得到 dhidden 与 dgf</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="318"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="344.0">FFN反向：W2 → ReLU → W1</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="369.0">得到 dW2、dW1 与 dn2</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="430"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="456.0">第二RMSNorm反向并相加</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="481.0">dresidual = dhidden + drnorm</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="542"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="568.0">Wo反向 → A @ V 反向</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="593.0">得到 dWo、dA、dV</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="654"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="680.0">softmax反向 → Q/K/V投影反向</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="705.0">得到 dWq、dWk、dWv 与 dn1</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="766"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="792.0">第一RMSNorm反向并相加</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="817.0">dx = dresidual + dxnorm</text><rect fill="white" height="78" rx="3" stroke="#D6DFE6" stroke-width="1" width="570" x="110" y="878"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="124" y="904.0">按Token与位置ID累计</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="124" y="929.0">同一个Embedding行的贡献相加</text><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="172" y2="199"></line><polygon fill="#285D96" points="395.00,199.00 398.50,191.00 391.50,191.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="284" y2="311"></line><polygon fill="#285D96" points="395.00,311.00 398.50,303.00 391.50,303.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="396" y2="423"></line><polygon fill="#285D96" points="395.00,423.00 398.50,415.00 391.50,415.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="508" y2="535"></line><polygon fill="#285D96" points="395.00,535.00 398.50,527.00 391.50,527.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="620" y2="647"></line><polygon fill="#285D96" points="395.00,647.00 398.50,639.00 391.50,639.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="732" y2="759"></line><polygon fill="#285D96" points="395.00,759.00 398.50,751.00 391.50,751.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="395" x2="395" y1="844" y2="871"></line><polygon fill="#285D96" points="395.00,871.00 398.50,863.00 391.50,863.00"></polygon><path d="M680 245 H724 V469 H688" fill="none" stroke="#16766B" stroke-width="2"></path><line stroke="#16766B" stroke-width="1.6" x1="710" x2="688" y1="469" y2="469"></line><polygon fill="#16766B" points="688.00,469.00 696.00,472.50 696.00,465.50"></polygon><text fill="#16766B" font-size="15" font-weight="600" text-anchor="start" x="740" y="355.0">dhidden</text><path d="M110 469 H52 V805 H102" fill="none" stroke="#16766B" stroke-width="2"></path><line stroke="#16766B" stroke-width="1.6" x1="73" x2="102" y1="805" y2="805"></line><polygon fill="#16766B" points="102.00,805.00 94.00,801.50 94.00,808.50"></polygon><text fill="#16766B" font-size="15" font-weight="600" text-anchor="start" x="15" y="640.0">dR</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="973" y2="973"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="996.0">图的旁路是必须相加的梯度贡献，不是多余装饰。反向算出梯度后，参数仍须由优化器step更新。</text></svg>