<svg aria-label="外部资料可以提供证据，但不能签发工具权限" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 619" xmlns="http://www.w3.org/2000/svg"><title>外部资料可以提供证据，但不能签发工具权限</title><rect fill="white" height="619" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">授权边界与模型阅读路径分开画</text><rect fill="#F7F9FB" height="180" rx="0" stroke="#D6DFE6" stroke-width="1" width="900" x="26" y="86"></rect><text fill="#536473" font-size="16" font-weight="600" text-anchor="start" x="44" y="114.0">信息路径：外部内容进入模型</text><rect fill="#EFF4F8" height="83" rx="3" stroke="#285D96" stroke-width="1" width="250" x="46" y="145"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="60" y="171.0">网页 / 源码 / 工具输出</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="60" y="196.0">含“忽略原任务”等引用文字</text><rect fill="white" height="83" rx="3" stroke="#D6DFE6" stroke-width="1" width="220" x="373" y="145"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="387" y="171.0">模型生成提议</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="387" y="196.0">可能受到内容影响</text><line stroke="#285D96" stroke-width="1.6" x1="296" x2="365" y1="186" y2="186"></line><polygon fill="#285D96" points="365.00,186.00 357.00,182.50 357.00,189.50"></polygon><rect fill="white" height="83" rx="3" stroke="#D6DFE6" stroke-width="1" width="230" x="676" y="145"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="690" y="171.0">待执行动作</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="690" y="196.0">仍不是执行授权</text><line stroke="#285D96" stroke-width="1.6" x1="593" x2="668" y1="186" y2="186"></line><polygon fill="#285D96" points="668.00,186.00 660.00,182.50 660.00,189.50"></polygon><rect fill="white" height="217" rx="0" stroke="#285D96" stroke-width="1" width="900" x="26" y="328"></rect><text fill="#285D96" font-size="16" font-weight="600" text-anchor="start" x="44" y="359.0">执行边界：由宿主与工具端强制检查</text><rect fill="white" height="82" rx="3" stroke="#D6DFE6" stroke-width="1" width="230" x="50" y="390"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="64" y="416.0">真实身份与授权</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="64" y="441.0">来自可信会话/配置</text><rect fill="white" height="82" rx="3" stroke="#D6DFE6" stroke-width="1" width="240" x="350" y="390"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="364" y="416.0">检查目标、范围与批准</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="364" y="441.0">不接受外部文字自授权限</text><rect fill="white" height="82" rx="3" stroke="#D6DFE6" stroke-width="1" width="212" x="690" y="390"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="704" y="416.0">允许才执行</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="704" y="441.0">越界则拒绝</text><line stroke="#285D96" stroke-width="1.6" x1="280" x2="342" y1="430" y2="430"></line><polygon fill="#285D96" points="342.00,430.00 334.00,426.50 334.00,433.50"></polygon><line stroke="#285D96" stroke-width="1.6" x1="590" x2="682" y1="430" y2="430"></line><polygon fill="#285D96" points="682.00,430.00 674.00,426.50 674.00,433.50"></polygon><line stroke="#A05720" stroke-width="1.6" x1="790" x2="790" y1="228" y2="381"></line><polygon fill="#A05720" points="790.00,381.00 793.50,373.00 786.50,373.00"></polygon><text fill="#A05720" font-size="14" font-weight="400" text-anchor="start" x="808" y="306.0">校验</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="562" y2="562"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="585.0">提示词可降低风险，却不能替代路径、网络、身份与副作用控制。拒绝越界动作后仍可在原授权内继续任务。</text></svg>