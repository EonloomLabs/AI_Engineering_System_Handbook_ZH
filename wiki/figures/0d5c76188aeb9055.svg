<svg aria-label="BM25把词频与长度放在同一个分母里比较" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 330" xmlns="http://www.w3.org/2000/svg"><title>BM25把词频与长度放在同一个分母里比较</title><rect fill="#fff" height="330" width="390" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">相同IDF下的词频—长度因子</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="22" y="70.0">A：长度100 / 词频2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="313.5" x="24" y="91.0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="34" y="119.0">1.375000</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="22" y="186.0">B：长度1000 / 词频4</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="150.85714285714286" x="24" y="207.0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="34" y="235.0">0.661654</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="281.0">两条共用0—1.5刻度。图中B词频更高却因文档很长得分</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="302.0">更低；不是BM25的全量实测。</text></svg>