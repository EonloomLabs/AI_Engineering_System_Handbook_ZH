<svg aria-label="位置怎样进入数值计算：位置0旋转到0度" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 410" xmlns="http://www.w3.org/2000/svg"><title>位置怎样进入数值计算：位置0旋转到0度</title><rect fill="#ffffff" height="410" rx="3" width="820"></rect><line stroke="#d6dfe6" stroke-width="2" x1="75" x2="440" y1="205" y2="205"></line><line stroke="#d6dfe6" stroke-width="2" x1="255" x2="255" y1="355" y2="47"></line><circle cx="255" cy="205" fill="none" r="117" stroke="#d6dfe6"></circle><line stroke="#536473" stroke-width="2" x1="255" x2="372" y1="205" y2="205"></line><polygon fill="#536473" points="372.00,205.00 362.00,201.00 362.00,209.00"></polygon><line stroke="#285d96" stroke-width="2" x1="255" x2="372.0" y1="205" y2="205.0"></line><polygon fill="#285d96" points="372.00,205.00 362.00,201.00 362.00,209.00"></polygon><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="19" font-weight="400" text-anchor="start" x="105" y="38">位置0：角度0×30°</text><rect fill="#eff4f8" height="173" rx="3" stroke="#285d96" stroke-width="2.5" width="274" x="495" y="87"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="509" y="114">同一条向量，转动方向</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="509" y="136">原向量 [1,0]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="509" y="158">转后 [1.0000,0.0000]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="509" y="180">长度仍为1</text></svg>