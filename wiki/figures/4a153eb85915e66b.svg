<svg aria-label="连续组批把空出来的槽给新请求，但调度步不等于等长时间" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 334" xmlns="http://www.w3.org/2000/svg"><title>连续组批把空出来的槽给新请求，但调度步不等于等长时间</title><rect fill="#fff" height="334" width="390" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="19" font-weight="650" text-anchor="start" x="20" y="30.0">两个解码槽的每步分配</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="115.0" y="113.0">步1</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="215.0" y="113.0">步2</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="315.0" y="113.0">步3</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="55" y="165.25">槽0</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="100.0" x="65.0" y="123"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="115.0" y="165.25">A结束</text><rect fill="#eff4f8" height="65" rx="0" stroke="#d6dfe6" width="100.0" x="165.0" y="123"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="215.0" y="165.25">C 1/2</text><rect fill="#eff4f8" height="65" rx="0" stroke="#d6dfe6" width="100.0" x="265.0" y="123"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="315.0" y="165.25">C结束</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="55" y="230.25">槽1</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="100.0" x="65.0" y="188"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="115.0" y="230.25">B 1/3</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="100.0" x="165.0" y="188"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="215.0" y="230.25">B 2/3</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="100.0" x="265.0" y="188"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="315.0" y="230.25">B结束</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="285.0">C已就绪，未计prefill。等宽列仅表示调度步，不表示</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="306.0">每步实际耗时相同。</text></svg>