<svg aria-label="BPE的合并次序，决定后面还能合并什么" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 568" xmlns="http://www.w3.org/2000/svg"><title>BPE的合并次序，决定后面还能合并什么</title><rect fill="#fff" height="568" width="390" x="0" y="0"></rect><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="32.0">时刻 0</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="48"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="34" y="74.0">a</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="114" y="48"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="124" y="74.0">b</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="204" y="48"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="214" y="74.0">c</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="118.0">规则①：合并相邻 a、b</text><line stroke="#285d96" stroke-width="2" x1="52" x2="52" y1="138.0" y2="155.0"></line><polygon fill="#285d96" points="52.00,155.00 48.00,146.00 56.00,146.00"></polygon><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="160.0">时刻 1</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="176.0"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="34" y="202.0">ab</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="114" y="176.0"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="124" y="202.0">c</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="246.0">规则②：合并新形成的 ab、c</text><line stroke="#285d96" stroke-width="2" x1="52" x2="52" y1="266.0" y2="283.0"></line><polygon fill="#285d96" points="52.00,283.00 48.00,274.00 56.00,274.00"></polygon><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="288.0">时刻 2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="304.0"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="34" y="330.0">abc</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="374.0">查固定词表</text><line stroke="#285d96" stroke-width="2" x1="52" x2="52" y1="394.0" y2="411.0"></line><polygon fill="#285d96" points="52.00,411.00 48.00,402.00 56.00,402.00"></polygon><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="416.0">时刻 3</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="432.0"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="34" y="458.0">ID 7</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="502.0">只剩一项；原文仍是 abc</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="540.0">方格代表当前符号项；一个格子不一定等于一个字符。</text></svg>