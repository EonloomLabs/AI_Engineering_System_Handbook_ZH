<svg aria-label="SSE在多个read数据块中累积，直到空行才得到完整事件" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 850 200"><title>流式协议缓冲</title><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="20" y="26">同一个SSE事件可能被网络拆成任意边界的片段</text><rect fill="#e7f0f4" height="88" rx="3" stroke="#a5beca" width="244" x="25" y="48"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="41" y="76">read①</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="41" y="111">data: {"call</text><rect fill="#e7f0f4" height="88" rx="3" stroke="#a5beca" width="244" x="295" y="48"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="311" y="76">read②</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="311" y="111">_id":"a"}\n</text><rect fill="#e7f0f4" height="88" rx="3" stroke="#a5beca" width="244" x="565" y="48"></rect><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="581" y="76">read③</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="581" y="111">\n（空行）</text><text font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" x="22" y="169">直到协议事件帧完整后才交给解析器，不在read①执行半截JSON。</text></svg>