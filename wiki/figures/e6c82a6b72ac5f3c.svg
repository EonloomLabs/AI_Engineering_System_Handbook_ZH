<svg aria-label="网络层是在重组数值，不是在生成隐藏句子：固定输入与参数" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 208" xmlns="http://www.w3.org/2000/svg"><title>网络层是在重组数值，不是在生成隐藏句子：固定输入与参数</title><rect fill="#fff" height="208" width="820" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="22" y="32.0">固定参数：W1=[[1,-1],[1,1]]，b1=[0,-2]</text><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="30" y="70.0">输入</text><rect fill="#fff" height="52" rx="0" stroke="#d6dfe6" width="380.0" x="30.0" y="96.0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="220.0" y="129.8">1</text><rect fill="#fff" height="52" rx="0" stroke="#d6dfe6" width="380.0" x="410.0" y="96.0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="600.0" y="129.8">2</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="180.0">同一组输入与参数；只有最后的独立对照取消ReLU。数字是特征或输出值，不是句子。</text></svg>