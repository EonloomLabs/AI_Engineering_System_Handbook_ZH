<svg aria-label="DAG上的最长依赖路径，决定并行任务最早何时结束" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 402" xmlns="http://www.w3.org/2000/svg"><title>DAG上的最长依赖路径，决定并行任务最早何时结束</title><rect fill="#fff" height="402" width="940" x="0" y="0"></rect><line stroke="#285d96" stroke-width="2" x1="240" x2="340" y1="174" y2="69"></line><polygon fill="#285d96" points="340.00,69.00 336.69,78.28 330.90,72.76"></polygon><line stroke="#d6dfe6" stroke-width="2" x1="240" x2="340" y1="174" y2="274"></line><polygon fill="#d6dfe6" points="340.00,274.00 330.81,270.46 336.46,264.81"></polygon><line stroke="#285d96" stroke-width="2" x1="530" x2="680" y1="69" y2="174"></line><polygon fill="#285d96" points="680.00,174.00 670.33,172.12 674.92,165.56"></polygon><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="680" y1="274" y2="174"></line><polygon fill="#d6dfe6" points="680.00,174.00 674.73,182.32 670.29,175.66"></polygon><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="60" y="150"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="70" y="176.0">A 定位 · 2分钟</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="45"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="360" y="71.0">B 实现 · 4分钟</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="250"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="360" y="276.0">C 测试 · 3分钟</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="690" y="150"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="700" y="176.0">D 集成 · 1分钟</text><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="24" y="336.0">关键路径：A → B → D = 2+4+1 = 7分钟</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="374.0">总工作量10分钟。把非关键分支C缩短，不一定改变交付完成时间；通信和集成开销尚未计入。</text></svg>