<svg aria-label="读指标，先问它的分母是谁：四种结果先分开" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 413" xmlns="http://www.w3.org/2000/svg"><title>读指标，先问它的分母是谁：四种结果先分开</title><rect fill="#ffffff" height="413" rx="3" width="820"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="200" y="66">教学计数表</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="12" font-weight="400" text-anchor="middle" x="292.5" y="92">被选中</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="12" font-weight="400" text-anchor="middle" x="477.5" y="92">未选中</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="192" y="145.05">真实需要</text><rect fill="#fff" height="74" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="182" x="200" y="95"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="291.0" y="138.5">6</text><rect fill="#fff" height="74" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="182" x="385" y="95"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="476.0" y="138.5">4</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="192" y="222.05">真实不需</text><rect fill="#fff" height="74" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="182" x="200" y="172"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="291.0" y="215.5">2</text><rect fill="#fff" height="74" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="182" x="385" y="172"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="476.0" y="215.5">未计数</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="start" x="55" y="320">实际应该命中的10项里找到6项，漏4项；另有2项不应命中却被选中。</text></svg>