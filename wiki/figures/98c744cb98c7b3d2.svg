<svg aria-label="推测解码：草稿可以快，但必须正确校验：草稿分布与目标分布不同" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 415" xmlns="http://www.w3.org/2000/svg"><title>推测解码：草稿可以快，但必须正确校验：草稿分布与目标分布不同</title><rect fill="#ffffff" height="415" rx="3" width="820"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="125" y="85">目标 p / 草稿 q</text><rect fill="#fff" height="75" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="177" x="125" y="100"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="213.5" y="144.0">0.6</text><rect fill="#fff" height="75" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="177" x="305" y="100"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="393.5" y="144.0">0.3</text><rect fill="#fff" height="75" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="177" x="485" y="100"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="573.5" y="144.0">0.1</text><rect fill="#fff" height="75" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="177" x="125" y="178"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="213.5" y="222.0">0.4</text><rect fill="#fff" height="75" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="177" x="305" y="178"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="393.5" y="222.0">0.4</text><rect fill="#fff" height="75" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="177" x="485" y="178"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="573.5" y="222.0">0.2</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="55" y="323">草稿模型便宜，但会把概率分错。本例目标p=[0.6,0.3,0.1]，草稿q=[0.4,0.4,0.2]。不能直接</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="55" y="348">把所有草稿输出当目标输出。</text></svg>