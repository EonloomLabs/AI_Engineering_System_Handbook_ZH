<svg aria-label="压缩要保留行动所依赖的事实：原历史有很多噪声" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 425" xmlns="http://www.w3.org/2000/svg"><title>压缩要保留行动所依赖的事实：原历史有很多噪声</title><rect fill="#ffffff" height="425" rx="3" width="820"></rect><line stroke="#d6dfe6" stroke-width="3" x1="56" x2="56" y1="46" y2="390"></line><circle cx="56" cy="47" fill="#285d96" r="10"></circle><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="53">目标</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="52">修复exclude，不改公开API</text><circle cx="56" cy="116" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="122">已完成</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="121">补丁已写入；文件版本v8</text><circle cx="56" cy="185" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="191">验证状态</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="280" y="190">单元测试通过；集成测试尚未运行</text><circle cx="56" cy="254" fill="#536473" r="6"></circle><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="78" y="260">证据</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-an