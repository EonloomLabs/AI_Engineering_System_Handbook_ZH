<svg aria-label="训练与推理共用前向，但只有训练更新参数" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 688" xmlns="http://www.w3.org/2000/svg"><title>训练与推理共用前向，但只有训练更新参数</title><rect fill="white" height="688" width="960"></rect><text fill="#182632" font-size="20" font-weight="600" text-anchor="start" x="26" y="32.0">同一个计算核心，两条不同的运行路径</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="38" y="83.0">训练：目标已知</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="535" y="83.0">推理：下一项未知</text><rect fill="white" height="68" rx="3" stroke="#D6DFE6" stroke-width="1" width="365" x="38" y="107"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="52" y="133.0">训练批次 + 标签</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="52" y="158.0">input=前5项；targets=后5项</text><rect fill="white" height="68" rx="3" stroke="#D6DFE6" stroke-width="1" width="365" x="535" y="107"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="549" y="133.0">已有前缀</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="549" y="158.0">BOS + 我 + 爱</text><rect fill="#EFF4F8" height="76" rx="3" stroke="#285D96" stroke-width="1" width="460" x="250" y="227"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="264" y="253.0">同一个 forward(ids, cache, …)</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="264" y="278.0">Embedding → Attention → FFN → logits</text><line stroke="#285D96" stroke-width="1.6" x1="220" x2="345" y1="175" y2="220"></line><polygon fill="#285D96" points="345.00,220.00 338.66,214.00 336.29,220.58"></polygon><line stroke="#285D96" stroke-width="1.6" x1="716" x2="614" y1="175" y2="220"></line><polygon fill="#285D96" points="614.00,220.00 622.73,219.97 619.91,213.57"></polygon><rect fill="white" height="68" rx="3" stroke="#D6DFE6" stroke-width="1" width="365" x="38" y="358"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="52" y="384.0">loss → backward</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="52" y="409.0">产生梯度；参数仍未改变</text><rect fill="white" height="68" rx="3" stroke="#D6DFE6" stroke-width="1" width="365" x="535" y="358"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="549" y="384.0">选择下一个Token</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="549" y="409.0">固定参数；不调用backward或step</text><line stroke="#285D96" stroke-width="1.6" x1="350" x2="220" y1="303" y2="350"></line><polygon fill="#285D96" points="220.00,350.00 228.71,350.57 226.33,343.99"></polygon><line stroke="#285D96" stroke-width="1.6" x1="610" x2="717" y1="303" y2="350"></line><polygon fill="#285D96" points="717.00,350.00 711.08,343.58 708.27,349.99"></polygon><rect fill="white" height="68" rx="3" stroke="#D6DFE6" stroke-width="1" width="365" x="38" y="493"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="52" y="519.0">AdamW.step</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="52" y="544.0">θ₀ → θ₁；下一次重新前向</text><rect fill="white" height="68" rx="3" stroke="#D6DFE6" stroke-width="1" width="365" x="535" y="493"></rect><text fill="#182632" font-size="17" font-weight="600" text-anchor="start" x="549" y="519.0">追加Token或结束</text><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="549" y="544.0">只有未结束时才进入下一轮</text><line stroke="#285D96" stroke-width="1.6" x1="220" x2="220" y1="426" y2="485"></line><polygon fill="#285D96" points="220.00,485.00 223.50,477.00 216.50,477.00"></polygon><line stroke="#285D96" stroke-width="1.6" x1="717" x2="717" y1="426" y2="485"></line><polygon fill="#285D96" points="717.00,485.00 720.50,477.00 713.50,477.00"></polygon><path d="M38 526 H18 V140 H30" fill="none" stroke="#285D96" stroke-width="1.7"></path><path d="M900 526 H928 V140 H908" fill="none" stroke="#285D96" stroke-width="1.7"></path><line stroke="#285D96" stroke-width="1.6" x1="18" x2="30" y1="140" y2="140"></line><polygon fill="#285D96" points="30.00,140.00 22.00,136.50 22.00,143.50"></polygon><line stroke="#285D96" stroke-width="1.6" x1="928" x2="908" y1="140" y2="140"></line><polygon fill="#285D96" points="908.00,140.00 916.00,143.50 916.00,136.50"></polygon><text fill="#16766B" font-size="17" font-weight="600" text-anchor="start" x="260" y="606.0">保存训练权重 → 重新加载 → 冻结使用</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="631.0" y2="631.0"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="654.0">图中两条回路分别是参数学习与逐Token生成；没有把一次训练更新画成一次推理输出。</text></svg>