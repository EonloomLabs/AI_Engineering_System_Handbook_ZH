<svg aria-label="“我有80%把握”是否可靠，要用一组实际结果校准" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 334" xmlns="http://www.w3.org/2000/svg"><title>“我有80%把握”是否可靠，要用一组实际结果校准</title><rect fill="#fff" height="334" width="390" x="0" y="0"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="24" y="70.0">自评正确率</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="342" x="24" y="90"></rect><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="273.6" x="24" y="90"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="35" y="119.0">80%</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="24" y="190.0">实际核验正确率</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="342" x="24" y="210"></rect><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="205.2" x="24" y="210"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="35" y="239.0">60%</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="285.0">同一组100条答案：声称约80%把握，实际60条正确。仅</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="306.0">为教学样本，不是商业模型实测。</text></svg>