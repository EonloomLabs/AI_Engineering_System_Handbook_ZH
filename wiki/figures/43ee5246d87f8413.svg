<svg aria-label="DAG上的最长依赖路径，决定并行任务最早何时结束" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 390 498" xmlns="http://www.w3.org/2000/svg"><title>DAG上的最长依赖路径，决定并行任务最早何时结束</title><rect fill="#fff" height="498" width="390" x="0" y="0"></rect><line stroke="#285d96" stroke-width="2" x1="170.0" x2="105.0" y1="103" y2="185"></line><polygon fill="#285d96" points="105.00,185.00 107.46,175.46 113.73,180.43"></polygon><line stroke="#d6dfe6" stroke-width="2" x1="170.0" x2="290.0" y1="103" y2="185"></line><polygon fill="#d6dfe6" points="290.00,185.00 280.31,183.22 284.83,176.62"></polygon><line stroke="#285d96" stroke-width="2" x1="105.0" x2="170.0" y1="243" y2="325"></line><polygon fill="#285d96" points="170.00,325.00 161.27,320.43 167.54,315.46"></polygon><line stroke="#d6dfe6" stroke-width="2" x1="290.0" x2="170.0" y1="243" y2="325"></line><polygon fill="#d6dfe6" points="170.00,325.00 175.17,316.62 179.69,323.22"></polygon><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="140" x="100" y="45"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="110" y="71.0">A 定位 · 2分钟</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="140" x="35" y="185"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="45" y="211.0">B 实现 · 4分钟</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="140" x="220" y="185"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="230" y="211.0">C 测试 · 3分钟</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="140" x="100" y="325"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="110" y="351.0">D 集成 · 1分钟</text><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="24" y="411.0">关键路径：A → B → D = 2+4+1 = 7分钟</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="449.0">总工作量10分钟。把非关键分支C缩短，不一定改变交付</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="470.0">完成时间；通信和集成开销尚未计入。</text></svg>