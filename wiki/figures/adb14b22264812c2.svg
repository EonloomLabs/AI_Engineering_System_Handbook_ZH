<svg aria-label="一次任务里的两轮模型调用，各自多知道了什么" class="d-svg" role="img" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 863" xmlns="http://www.w3.org/2000/svg"><title>一次任务里的两轮模型调用，各自多知道了什么</title><rect fill="white" height="863" width="960"></rect><text fill="#182632" font-size="18" font-weight="600" text-anchor="start" x="26" y="31.0">消息沿参与方流转；每条箭头标注同一轮的具体对象</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="60.0" y="90.0">用户</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="340.0" y="90.0">宿主</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="620.0" y="90.0">模型</text><text fill="#182632" font-size="18" font-weight="600" text-anchor="middle" x="900.0" y="90.0">工具</text><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="60.0" x2="60.0" y1="109" y2="789"></line><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="340.0" x2="340.0" y1="109" y2="789"></line><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="620.0" x2="620.0" y1="109" y2="789"></line><line stroke="#D6DFE6" stroke-dasharray="3 5" stroke-width="1" x1="900.0" x2="900.0" y1="109" y2="789"></line><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="125"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="146.0">01  读取config.txt中的timeout</text><line stroke="#285D96" stroke-width="1.6" x1="60.0" x2="340.0" y1="165" y2="165"></line><polygon fill="#285D96" points="340.00,165.00 332.00,161.50 332.00,168.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="192.0">任务已知，内容未知</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="208"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="229.0">02  问题 + read_file工具说明</text><line stroke="#285D96" stroke-width="1.6" x1="340.0" x2="620.0" y1="248" y2="248"></line><polygon fill="#285D96" points="620.00,248.00 612.00,244.50 612.00,251.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="275.0">模型有可用能力描述</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="291"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="312.0">03  call c1: read_file(config.txt)</text><line stroke="#285D96" stroke-dasharray="5 3" stroke-width="1.6" x1="620.0" x2="340.0" y1="331" y2="331"></line><polygon fill="#285D96" points="340.00,331.00 348.00,334.50 348.00,327.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="358.0">只有提议，尚未取证</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="374"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="395.0">04  执行c1</text><line stroke="#285D96" stroke-width="1.6" x1="340.0" x2="900.0" y1="414" y2="414"></line><polygon fill="#285D96" points="900.00,414.00 892.00,410.50 892.00,417.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="441.0">读取磁盘r7</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="457"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="478.0">05  c1: timeout=30 @r7</text><line stroke="#285D96" stroke-dasharray="5 3" stroke-width="1.6" x1="900.0" x2="340.0" y1="497" y2="497"></line><polygon fill="#285D96" points="340.00,497.00 348.00,500.50 348.00,493.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="524.0">证据已取得</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="540"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="561.0">06  原任务 + c1 + c1结果</text><line stroke="#285D96" stroke-width="1.6" x1="340.0" x2="620.0" y1="580" y2="580"></line><polygon fill="#285D96" points="620.00,580.00 612.00,576.50 612.00,583.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="607.0">下一轮新增了文件事实</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="623"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="644.0">07  回答草稿：timeout为30，依据r7</text><line stroke="#285D96" stroke-dasharray="5 3" stroke-width="1.6" x1="620.0" x2="340.0" y1="663" y2="663"></line><polygon fill="#285D96" points="340.00,663.00 348.00,666.50 348.00,659.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="690.0">第二轮模型输出已结束</text><rect fill="white" height="28" rx="0" stroke="none" stroke-width="1" width="730" x="115" y="706"></rect><text fill="#285D96" font-size="16" font-weight="400" text-anchor="start" x="132" y="727.0">08  显示已核对的只读结果</text><line stroke="#285D96" stroke-dasharray="5 3" stroke-width="1.6" x1="340.0" x2="60.0" y1="746" y2="746"></line><polygon fill="#285D96" points="60.00,746.00 68.00,749.50 68.00,742.50"></polygon><text fill="#536473" font-size="13" font-weight="400" text-anchor="start" x="132" y="773.0">任务完成；没有发生文件修改</text><line stroke="#D6DFE6" stroke-width="1" x1="26" x2="934" y1="806" y2="806"></line><text fill="#536473" font-size="14" font-weight="400" text-anchor="start" x="26" y="829.0">时间自上而下；行距不代表耗时。实线是请求/动作，虚线表示图中明确的返回。来源为本节固定教学消息，不推测闭源内部。</text></svg>