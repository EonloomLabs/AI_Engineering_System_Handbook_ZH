<svg aria-label="Activation Checkpointing：少存一点，反向时重算：普通保存" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 401" xmlns="http://www.w3.org/2000/svg"><title>Activation Checkpointing：少存一点，反向时重算：普通保存</title><rect fill="#ffffff" height="401" rx="3" width="820"></rect><rect fill="#e3edf7" height="49" rx="3" stroke="#285d96" stroke-width="1.2" width="195" x="86" y="100"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="middle" x="183.5" y="130">a1</text><rect fill="#fff" height="49" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="195" x="290" y="100"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="middle" x="387.5" y="130">a2</text><rect fill="#fff" height="49" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="195" x="494" y="100"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="400" text-anchor="middle" x="591.5" y="130">a3</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="19" font-weight="400" text-anchor="start" x="75" y="256">在此简化链中，反向额外保留中间激活a1、a2、a3，各100单位，驻留合计300。</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="19" font-weight="400" text-anchor="start" x="75" y="281">输入和最终输出不计入这本账。</text></svg>