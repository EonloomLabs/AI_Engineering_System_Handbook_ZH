<svg aria-label="后训练改变行为，奖励不是事实裁判：同一问题，两份回答" class="vb-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 820 396" xmlns="http://www.w3.org/2000/svg"><title>后训练改变行为，奖励不是事实裁判：同一问题，两份回答</title><rect fill="#ffffff" height="396" rx="3" width="820"></rect><rect fill="#eff4f8" height="118" rx="3" stroke="#285d96" stroke-width="2.5" width="238" x="26" y="38"></rect><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="40" y="65">同一问题，两份回答</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="40" y="87">A与B是本例偏好候选</text><line stroke="#d6dfe6" stroke-width="2" x1="266" x2="286" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="286.00,97.00 276.00,93.00 276.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="290" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="650" text-anchor="start" x="304" y="65">人或规则给偏好</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="87">这里偏好A；不是宣告A绝对真</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="304" y="109">实</text><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="550" y1="97.0" y2="97.0"></line><polygon fill="#d6dfe6" points="550.00,97.00 540.00,93.00 540.00,101.00"></polygon><rect fill="#eff4f8" height="118" rx="3" stroke="#d6dfe6" stroke-width="1.2" width="238" x="554" y="38"></rect><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weig