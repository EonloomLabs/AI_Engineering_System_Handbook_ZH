<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 799" role="img" aria-label="El entrenamiento y la inferencia comparten la propagación hacia delante, pero solo el entrenamiento actualiza los parámetros"><title>El entrenamiento y la inferencia comparten la propagación hacia delante, pero solo el entrenamiento actualiza los parámetros</title><rect width="960" height="799" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Un mismo núcleo de cálculo, dos rutas de ejecución distintas</text><text x="38" y="83" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Entrenamiento: objetivo conocido</text><text x="535" y="83" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="535" y="83" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Inferencia: se desconoce el siguiente</tspan><tspan x="535" y="110" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">elemento</tspan></text><rect x="38" y="134" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="160" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Lote de entrenamiento + etiquetas</text><text x="52" y="185" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="52" y="185" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">input=primeros 5 elementos; targets=últimos 5</tspan><tspan x="52" y="206" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">elementos</tspan></text><rect x="535" y="134" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="160" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Prefijo existente</text><text x="549" y="185" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">BOS + 我 + 爱</text><rect x="250" y="275" width="460" height="76" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="264" y="301" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El mismo forward(ids, cache, …)</text><text x="264" y="326" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Embedding → Attention → FFN → logits</text><line x1="220" y1="223" x2="345" y2="268" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="345,268 338.66,262 336.29,268.58" /><line x1="716" y1="223" x2="614" y2="268" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="614,268 622.73,267.97 619.91,261.57" /><rect x="38" y="406" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="432" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">loss → backward</text><text x="52" y="457" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="52" y="457" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Se generan gradientes; los parámetros aún no</tspan><tspan x="52" y="478" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">cambian</tspan></text><rect x="535" y="406" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="432" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Elegir el siguiente token</text><text x="549" y="457" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros fijos; sin llamar a backward ni step</text><line x1="350" y1="351" x2="220" y2="398" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="220,398 228.71,398.57 226.33,391.99" /><line x1="610" y1="351" x2="717" y2="398" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="717,398 711.08,391.58 708.27,397.99" /><rect x="38" y="562" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="588" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">AdamW.step</text><text x="52" y="613" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="52" y="613" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀ → θ₁; volver a calcular hacia delante en la</tspan><tspan x="52" y="634" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">siguiente ejecución</tspan></text><rect x="535" y="562" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="588" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Añadir un token o terminar</text><text x="549" y="613" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Entrar en el siguiente turno solo si no ha terminado</text><line x1="220" y1="495" x2="220" y2="554" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="220,554 223.5,546 216.5,546" /><line x1="717" y1="495" x2="717" y2="554" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="717,554 720.5,546 713.5,546" /><path d="M38 595 H18 V167 H30" fill="none" stroke="#285D96" stroke-width="1.7" /><path d="M900 595 H928 V167 H908" fill="none" stroke="#285D96" stroke-width="1.7" /><line x1="18" y1="167" x2="30" y2="167" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="30,167 22,163.5 22,170.5" /><line x1="928" y1="167" x2="908" y2="167" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="908,167 916,170.5 916,163.5" /><text x="260" y="696" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Guardar pesos entrenados → recargar → usar congelados</text><line x1="26" y1="721" x2="934" y2="721" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="744" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="744" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Los dos bucles de la figura son aprendizaje de parámetros y generación token a token; una actualización de entrenamiento no se representa</tspan><tspan x="26" y="765" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">como una salida de inferencia.</tspan></text></svg>
