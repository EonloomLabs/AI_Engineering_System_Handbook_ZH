<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 608" role="img" aria-label="Evaluación emparejada: en 20 tareas hay que contabilizar tanto las correcciones como los nuevos errores"><title>Evaluación emparejada: en 20 tareas hay que contabilizar tanto las correcciones como los nuevos errores</title><rect width="960" height="608" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="32" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Alinear pregunta por pregunta el mismo lote de tareas, sin comparar dos muestras ajenas</tspan><tspan x="26" y="62" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">entre sí</tspan></text><text x="317.5" y="151" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Nuevo éxito</text><text x="542.5" y="151" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Nuevo fallo</text><text x="191" y="226" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Éxito anterior</text><rect x="205" y="163" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="226" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">12</text><rect x="430" y="163" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="226" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><text x="191" y="326" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Fallo anterior</text><rect x="205" y="263" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="326" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3</text><rect x="430" y="263" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="326" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">4</text><text x="238" y="454" font-size="22" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3 correcciones nuevas</text><text x="548" y="454" font-size="22" fill="#A13A37" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1 regresión</text><text x="238" y="505" font-size="21" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Mejora neta = (3−1) / 20 = 10 puntos porcentuales</text><line x1="26" y1="530" x2="934" y2="530" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="553" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="553" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La versión anterior acierta 13/20 y la nueva 15/20. La diagonal no cambia la diferencia neta; los porcentajes de estas 20 preguntas por sí solos</tspan><tspan x="26" y="574" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">no demuestran un beneficio estable en la población.</tspan></text></svg>
