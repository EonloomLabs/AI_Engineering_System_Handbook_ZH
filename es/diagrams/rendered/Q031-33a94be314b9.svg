<svg xmlns="http://www.w3.org/2000/svg" aria-label="La compensación al rechazar un borrador es lo que impide sesgar la distribución objetivo" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 522"><title>La compensación al rechazar un borrador es lo que impide sesgar la distribución objetivo</title><rect fill="#fff" height="522" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Masa de probabilidad de la distribución del borrador a la distribución objetivo</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="80">Borrador q</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="713.6" x="24" y="96" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="380.8" y="123">A:0.8</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="178.4" x="737.6" y="96" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="826.8" y="123">B:0.2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="181">Calidad al aceptar directamente</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="446.0" x="24" y="197" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="247" y="224">A:0.5</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="178.4" x="470.0" y="197" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="559.2" y="224">B:0.2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="282">Compensación al rechazar</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="267.59999999999997" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="157.8" y="325">B:0.3</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="383">Objetivo final p</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="446.0" x="24" y="399" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="247" y="426">A:0.5</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="446.0" x="470.0" y="399" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="693" y="426">B:0.5</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="473"><tspan x="22" y="473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Todas las barras usan la misma escala de probabilidad 0—1; la masa total aceptada del centro es 0.7 y los 0.3 restantes vuelven a B</tspan><tspan x="22" y="494" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">mediante la compensación al rechazar.</tspan></text></svg>
