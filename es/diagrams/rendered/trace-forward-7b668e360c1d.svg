<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 1008" role="img" aria-label="Propagación hacia delante común: los parámetros entran por un lado; los residuos conservan y reúnen la representación original"><title>Propagación hacia delante común: los parámetros entran por un lado; los residuos conservan y reúnen la representación original</title><rect width="960" height="1008" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Modelo didáctico de una capa · Deben conservarse ambos puntos de suma residual</text><rect x="90" y="94" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="120" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">E[ids] + P[pos]</text><text x="104" y="145" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">X [B,T,4]</text><rect x="90" y="214" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="240" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">RMSNorm → Q/K/V</text><text x="104" y="265" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Multiplicar cada fila por Wq / Wk / Wv</text><rect x="90" y="334" width="490" height="99" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="360" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">QKᵀ / 2 → máscara → softmax</text><text x="104" y="385" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="104" y="385" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtener A y calcular después A @ V; mezclar sobre las posiciones de</tspan><tspan x="104" y="406" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">origen</tspan></text><rect x="90" y="475" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="501" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Multiplicar por Wo y sumar de nuevo X</text><text x="104" y="526" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">R = X + Δattention</text><rect x="90" y="595" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="621" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">RMSNorm → W1 → ReLU → W2</text><text x="104" y="646" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">4 dimensiones → 8 dimensiones → 4 dimensiones</text><rect x="90" y="715" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="741" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Sumar de nuevo R y aplicar RMSNorm</text><text x="104" y="766" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">H = R + ΔFFN</text><rect x="90" y="835" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="861" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Multiplicar por U</text><text x="104" y="886" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits [B,T,8]</text><line x1="335" y1="172" x2="335" y2="207" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,207 338.5,199 331.5,199" /><line x1="335" y1="292" x2="335" y2="327" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,327 338.5,319 331.5,319" /><line x1="335" y1="433" x2="335" y2="468" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,468 338.5,460 331.5,460" /><line x1="335" y1="553" x2="335" y2="588" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,588 338.5,580 331.5,580" /><line x1="335" y1="673" x2="335" y2="708" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,708 338.5,700 331.5,700" /><line x1="335" y1="793" x2="335" y2="828" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,828 338.5,820 331.5,820" /><path d="M90 133 H43 V514 H82" fill="none" stroke="#16766B" stroke-width="2" /><line x1="60" y1="514" x2="82" y2="514" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="82,514 74,510.5 74,517.5" /><text x="16" y="310" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">X</text><path d="M580 514 H630 V754 H588" fill="none" stroke="#16766B" stroke-width="2" /><line x1="610" y1="754" x2="588" y2="754" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="588,754 596,757.5 596,750.5" /><text x="644" y="639" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">R</text><text x="692" y="134" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros: E, P</text><line x1="676" y1="141" x2="590" y2="141" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,141 598,144.5 598,137.5" /><text x="692" y="254" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros: g1, Wq, Wk, Wv</text><line x1="676" y1="261" x2="590" y2="261" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,261 598,264.5 598,257.5" /><text x="692" y="515" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros: Wo</text><line x1="676" y1="522" x2="590" y2="522" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,522 598,525.5 598,518.5" /><text x="692" y="635" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros: g2, W1, W2</text><line x1="676" y1="642" x2="590" y2="642" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,642 598,645.5 598,638.5" /><text x="692" y="755" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros: gf</text><line x1="676" y1="762" x2="590" y2="762" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,762 598,765.5 598,758.5" /><text x="692" y="875" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetros: U</text><line x1="676" y1="882" x2="590" y2="882" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,882 598,885.5 598,878.5" /><line x1="26" y1="930" x2="934" y2="930" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="953" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="953" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Las flechas indican dependencias de datos, no duración. Entrenamiento e inferencia llaman a forward; pérdida, retropropagación y actualización</tspan><tspan x="26" y="974" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">quedan fuera de esa propagación común.</tspan></text></svg>
