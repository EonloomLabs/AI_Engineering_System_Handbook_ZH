<svg xmlns="http://www.w3.org/2000/svg" aria-label="Los vectores de bloques de imagen y los Embedding de texto tienen fuentes distintas, pero pueden incorporarse a una misma cadena de cálculo" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 543"><title>Los vectores de bloques de imagen y los Embedding de texto tienen fuentes distintas, pero pueden incorporarse a una misma cadena de cálculo</title><rect fill="#fff" height="543" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Imagen RGB de 32×32 → cuatro bloques de 16×16</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="45" y="80" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="120" y="155">Patch 0</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="195" y="80" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="270" y="155">Patch 1</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="45" y="230" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="120" y="305">Patch 2</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="195" y="230" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="270" y="305">Patch 3</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="24" y="415">Cada bloque contiene 16×16×3 = 768 valores de canales de píxel</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="650" text-anchor="start" x="24" y="456">[4,768] × [768,8] → [4,8]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="494"><tspan x="22" y="494" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">768 es la anchura de cada bloque aplanado; 4 es el número de bloques y 8 es la anchura de la proyección didáctica. La imagen no entra en el</tspan><tspan x="22" y="515" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">modelo mediante una consulta de tabla con Token ID de texto.</tspan></text></svg>
