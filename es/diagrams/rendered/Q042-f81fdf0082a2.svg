<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 739" role="img" aria-label="MCP negocia primero las capacidades, descubre después las herramientas y solo al final intenta invocarlas"><title>MCP negocia primero las capacidades, descubre después las herramientas y solo al final intenta invocarlas</title><rect width="960" height="739" fill="white" /><text x="26" y="31" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Los mensajes circulan entre participantes; cada flecha identifica el objeto concreto de un mismo turno</text><text x="60" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Client</text><text x="340" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Server</text><text x="620" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Host</text><text x="900" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Modelo</text><line x1="60.0" y1="109" x2="60.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="340.0" y1="109" x2="340.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="620.0" y1="109" x2="620.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="900.0" y1="109" x2="900.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><rect x="115" y="125" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="146" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">01 initialize(id=1, version=2025-06-18)</text><line x1="60.0" y1="165" x2="340.0" y2="165" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,165 332,161.5 332,168.5" /><text x="132" y="192" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Solicitar negociación</text><rect x="115" y="208" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="229" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">02 result(id=1, capabilities.tools={})</text><line x1="340.0" y1="248" x2="60.0" y2="248" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="60,248 68,251.5 68,244.5" /><text x="132" y="275" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El servicio declara compatibilidad con tools</text><rect x="115" y="291" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="312" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">03 notifications/initialized</text><line x1="60.0" y1="331" x2="340.0" y2="331" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,331 332,327.5 332,334.5" /><text x="132" y="358" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Entrar en la fase de funcionamiento normal</text><rect x="115" y="374" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="395" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">04 tools/list(id=2)</text><line x1="60.0" y1="414" x2="340.0" y2="414" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,414 332,410.5 332,417.5" /><text x="132" y="441" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtener el nombre de herramienta e inputSchema</text><rect x="115" y="457" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="478" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">05 Seleccionar las descripciones de herramientas expuestas</text><line x1="620.0" y1="497" x2="900.0" y2="497" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="900,497 892,493.5 892,500.5" /><text x="132" y="524" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Solo entonces puede elegir el modelo</text><rect x="115" y="540" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="561" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">06 tools/call(id=3, name=...)</text><line x1="60.0" y1="580" x2="340.0" y2="580" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,580 332,576.5 332,583.5" /><text x="132" y="607" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Ejecutar la herramienta especificada y ya autorizada</text><line x1="26" y1="640" x2="934" y2="640" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="663" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="663" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El tiempo avanza de arriba abajo; el espacio entre filas no representa duración. Las líneas continuas son solicitudes o acciones, y las</tspan><tspan x="26" y="684" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">discontinuas son los retornos indicados explícitamente en la figura. La fuente son los mensajes didácticos fijos de esta sección; no se infiere el</tspan><tspan x="26" y="705" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">interior de productos cerrados.</tspan></text></svg>
