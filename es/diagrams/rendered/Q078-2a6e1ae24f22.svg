<svg xmlns="http://www.w3.org/2000/svg" aria-label="La ruta de dependencias más larga del DAG determina cuándo pueden terminar como mínimo las tareas en paralelo" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 471"><title>La ruta de dependencias más larga del DAG determina cuándo pueden terminar como mínimo las tareas en paralelo</title><rect fill="#fff" height="471" width="940" x="0" y="0" /><line stroke="#285d96" stroke-width="2" x1="240" x2="340" y1="198" y2="69" /><polygon fill="#285d96" points="340,69 336.69,78.28 330.9,72.76" /><line stroke="#d6dfe6" stroke-width="2" x1="240" x2="340" y1="198" y2="322" /><polygon fill="#d6dfe6" points="340,322 330.81,318.46 336.46,312.81" /><line stroke="#285d96" stroke-width="2" x1="530" x2="680" y1="69" y2="198" /><polygon fill="#285d96" points="680,198 670.33,196.12 674.92,189.56" /><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="680" y1="322" y2="198" /><polygon fill="#d6dfe6" points="680,198 674.73,206.32 670.29,199.66" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="180" x="60" y="174" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="70" y="200"><tspan x="70" y="200" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A Localizar · 2</tspan><tspan x="70" y="224" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">minutos</tspan></text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="180" x="350" y="45" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="71"><tspan x="360" y="71" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">B Implementar · 4</tspan><tspan x="360" y="95" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">minutos</tspan></text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="298" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="324">C Probar · 3 minutos</text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="180" x="690" y="174" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="700" y="200">D Integrar · 1 minuto</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="24" y="384">Ruta crítica: A → B → D = 2+4+1 = 7 minutos</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="422"><tspan x="22" y="422" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Trabajo total 10 minutos. Acortar la rama no crítica C no cambia necesariamente el momento de entrega; aún no se han incluido los costes de</tspan><tspan x="22" y="443" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">comunicación e integración.</tspan></text></svg>
