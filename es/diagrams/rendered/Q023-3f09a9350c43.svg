<svg xmlns="http://www.w3.org/2000/svg" aria-label="Los resultados del enrutamiento de MoE deben examinarse token por token" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 520"><title>Los resultados del enrutamiento de MoE deben examinarse token por token</title><rect fill="#fff" height="520" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="35">Probabilidad de enrutamiento del token A</text><rect fill="#eff4f8" height="66" rx="4" stroke="#285d96" width="211.25" x="45.0" y="109" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="150.625" y="203">E0: 0.6</text><rect fill="#eff4f8" height="33" rx="4" stroke="#285d96" width="211.25" x="262.5" y="142" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="368.125" y="203">E1: 0.3</text><rect fill="#eff4f8" height="11" rx="4" stroke="#285d96" width="211.25" x="480.0" y="164" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="585.625" y="203">E2: 0.1</text><rect fill="#eff4f8" height="1" rx="4" stroke="#285d96" width="211.25" x="697.5" y="175" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="803.125" y="203">E3: 0</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="265">Probabilidad de enrutamiento del token B</text><rect fill="#eff4f8" height="11" rx="4" stroke="#285d96" width="211.25" x="45.0" y="394" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="150.625" y="433">E0: 0.1</text><rect fill="#eff4f8" height="11" rx="4" stroke="#285d96" width="211.25" x="262.5" y="394" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="368.125" y="433">E1: 0.1</text><rect fill="#eff4f8" height="22" rx="4" stroke="#285d96" width="211.25" x="480.0" y="383" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="585.625" y="433">E2: 0.2</text><rect fill="#eff4f8" height="66" rx="4" stroke="#285d96" width="211.25" x="697.5" y="339" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="803.125" y="433">E3: 0.6</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="471"><tspan x="22" y="471" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A elige E0/E1 y B elige E3/E2. La altura de las barras es la probabilidad de enrutamiento fijada en esta figura, no la calidad de salida de los</tspan><tspan x="22" y="492" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">expertos.</tspan></text></svg>
