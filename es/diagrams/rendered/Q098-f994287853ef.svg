<svg xmlns="http://www.w3.org/2000/svg" aria-label="El numerador del coste por tarea completada con éxito debe incluir los fallos y el retrabajo" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 310"><title>El numerador del coste por tarea completada con éxito debe incluir los fallos y el retrabajo</title><rect fill="#fff" height="310" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Denominador uniforme: completar una tarea con éxito</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="72">A: por tarea completada con éxito</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="743.3333333333334" x="24" y="92" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="120">1.25</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="187">B: por tarea completada con éxito</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="832.5333333333333" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="235">1.4</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="282">A: coste total 100/80 éxitos=1.25; B: coste total 70/50 éxitos=1.40. El coste de las ejecuciones fallidas no se ha eliminado del numerador.</text></svg>
