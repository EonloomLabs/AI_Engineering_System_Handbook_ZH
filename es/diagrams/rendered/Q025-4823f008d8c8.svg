f" height="45" rx="0" stroke="#d6dfe6" width="212.0" x="277.0" y="336" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="383" y="365.25">Antiguo</text><rect fill="#fff" height="45" rx="0" stroke="#d6dfe6" width="212.0" x="489.0" y="336" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="595" y="365.25">Antiguo</text><rect fill="#eff4f8" height="45" rx="0" stroke="#d6dfe6" width="212.0" x="701.0" y="336" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="807" y="365.25">Nuevo</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="413"><tspan x="22" y="413" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El resaltado claro solo muestra los dos grupos de datos añadidos en este turno d; los valores anteriores de cada capa son distintos y no se</tspan><tspan x="22" y="434" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">puede conservar únicamente la capa superior.</tspan></text></svg>
