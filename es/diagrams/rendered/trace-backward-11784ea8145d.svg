<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 1105" role="img" aria-label="La retropropagación sigue las dependencias reales: hay que sumar los gradientes en los dos puntos residuales"><title>La retropropagación sigue las dependencias reales: hay que sumar los gradientes en los dos puntos residuales</title><rect width="960" height="1105" fill="white" /><text x="26" y="32" font-size="19" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="32" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Corresponde elemento a elemento a los objetos de cálculo de manual_backward del modelo</tspan><tspan x="26" y="60.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">didáctico</tspan></text><rect x="110" y="122.5" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="148.5" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dz = (p − onehot) / N</text><text x="124" y="173.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Las probabilidades de salida y las etiquetas reales producen gradientes</text><rect x="110" y="234.5" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="260.5" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dU, dfinal → retropropagación de la última RMSNorm</text><text x="124" y="285.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtener dhidden y dgf</text><rect x="110" y="346.5" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="372.5" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Retropropagación de FFN: W2 → ReLU → W1</text><text x="124" y="397.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtener dW2, dW1 y dn2</text><rect x="110" y="458.5" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="484.5" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Retropropagar la segunda RMSNorm y sumar</text><text x="124" y="509.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dresidual = dhidden + drnorm</text><rect x="110" y="570.5" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="596.5" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Retropropagación de Wo → retropropagación de A @ V</text><text x="124" y="621.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtener dWo, dA y dV</text><rect x="110" y="682.5" width="570" height="103.5" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="708.5" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="124" y="708.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Retropropagación de softmax → retropropagación de</tspan><tspan x="124" y="734" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">proyecciones Q/K/V</tspan></text><text x="124" y="759" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtener dWq, dWk, dWv y dn1</text><rect x="110" y="820" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="846" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Retropropagar la primera RMSNorm y sumar</text><text x="124" y="871" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dx = dresidual + dxnorm</text><rect x="110" y="932" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="958" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Acumular según los ID de token y posición</text><text x="124" y="983" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Sumar las contribuciones de una misma fila Embedding</text><line x1="395" y1="200.5" x2="395" y2="227.5" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,227.5 398.5,219.5 391.5,219.5" /><line x1="395" y1="312.5" x2="395" y2="339.5" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,339.5 398.5,331.5 391.5,331.5" /><line x1="395" y1="424.5" x2="395" y2="451.5" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,451.5 398.5,443.5 391.5,443.5" /><line x1="395" y1="536.5" x2="395" y2="563.5" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,563.5 398.5,555.5 391.5,555.5" /><line x1="395" y1="648.5" x2="395" y2="675.5" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,675.5 398.5,667.5 391.5,667.5" /><line x1="395" y1="786" x2="395" y2="813" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,813 398.5,805 391.5,805" /><line x1="395" y1="898" x2="395" y2="925" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,925 398.5,917 391.5,917" /><path d="M680 273.5 H724 V497.5 H688" fill="none" stroke="#16766B" stroke-width="2" /><line x1="710" y1="497.5" x2="688" y2="497.5" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="688,497.5 696,501 696,494" /><text x="740" y="383.5" font-size="15" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dhidden</text><path d="M110 497.5 H52 V859 H102" fill="none" stroke="#16766B" stroke-width="2" /><line x1="73" y1="859" x2="102" y2="859" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="102,859 94,855.5 94,862.5" /><text x="15" y="668.5" font-size="15" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dR</text><line x1="26" y1="1027" x2="934" y2="1027" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="1050" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="1050" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Las rutas directas de la figura son contribuciones de gradiente que deben sumarse, no adornos. Después de calcular los gradientes, los</tspan><tspan x="26" y="1071" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">parámetros aún deben actualizarse mediante step del optimizador.</tspan></text></svg>
