<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 857" role="img" aria-label="El tiempo de espera agotado lleva a unknown; al recuperar hay que comprobar primero los efectos secundarios"><title>El tiempo de espera agotado lleva a unknown; al recuperar hay que comprobar primero los efectos secundarios</title><rect width="960" height="857" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Separar los nodos de estado de las condiciones de transición; desconocido no es fallo</text><rect x="40" y="92" width="190" height="116" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">recorded</text><text x="54" y="164" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">ID de operación registrado</text><rect x="350" y="92" width="190" height="116" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="364" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">executing</text><text x="364" y="164" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Acción enviada</text><rect x="675" y="92" width="225" height="116" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="689" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">succeeded</text><text x="689" y="164" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="689" y="164" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hay resultado y ya se ha</tspan><tspan x="689" y="185" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">persistido</tspan></text><rect x="350" y="352" width="190" height="116" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="364" y="378" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">unknown</text><text x="364" y="403" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="364" y="403" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">No se ha recibido un</tspan><tspan x="364" y="424" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">acuse de recibo</tspan><tspan x="364" y="445" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">concluyente</tspan></text><rect x="40" y="596" width="240" height="95" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="622" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmed_not_done</text><text x="54" y="647" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="54" y="647" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La verificación confirma que no</tspan><tspan x="54" y="668" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">ocurrió</tspan></text><rect x="650" y="596" width="250" height="95" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="664" y="622" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmed_done</text><text x="664" y="647" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La verificación confirma que ocurrió</text><line x1="230" y1="150" x2="342" y2="150" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="342,150 334,146.5 334,153.5" /><text x="280" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Despachar</text><line x1="540" y1="150" x2="667" y2="150" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="667,150 659,146.5 659,153.5" /><text x="602" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="602" y="111" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Resultado de la</tspan><tspan x="602" y="132" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmación</tspan></text><line x1="445" y1="208" x2="445" y2="343" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="445,343 448.5,335 441.5,335" /><text x="458" y="282" font-size="15" fill="#A05720" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tiempo de espera agotado / conexión interrumpida</text><line x1="391" y1="468" x2="216" y2="587" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="216,587 224.58,585.4 220.65,579.61" /><text x="165" y="523" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Consultar el estado del sistema posterior</text><line x1="499" y1="468" x2="755" y2="587" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="755,587 749.22,580.45 746.27,586.8" /><text x="740" y="523" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Verificar la evidencia de confirmación por ID de operación</text><path d="M40 634 H16 V150 H32" fill="none" stroke="#285D96" stroke-width="1.6" /><line x1="16" y1="150" x2="32" y2="150" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="32,150 24,146.5 24,153.5" /><text x="38" y="730" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Se confirma que no ocurrió: reintentar según la política</text><path d="M900 634 H930 V150 H908" fill="none" stroke="#16766B" stroke-width="1.6" /><line x1="930" y1="150" x2="908" y2="150" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="908,150 916,153.5 916,146.5" /><text x="650" y="730" font-size="16" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="650" y="730" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Se confirma que ocurrió: registrar la</tspan><tspan x="650" y="754" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">finalización sin repetir la ejecución</tspan></text><line x1="26" y1="779" x2="934" y2="779" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="802" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="802" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Este es el diseño de recuperación de un harness didáctico, no una garantía de una API concreta. Si no se puede aclarar el resultado, mantener</tspan><tspan x="26" y="823" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">unknown y escalar el tratamiento; no equiparar la ausencia de acuse de recibo con la ausencia de efectos secundarios.</tspan></text></svg>
