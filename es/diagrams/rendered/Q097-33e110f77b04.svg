<svg xmlns="http://www.w3.org/2000/svg" aria-label="Los segmentos paralelos de Trace no se pueden sumar directamente para obtener la espera del usuario" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 500"><title>Los segmentos paralelos de Trace no se pueden sumar directamente para obtener la espera del usuario</title><rect fill="#fff" height="500" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Eje horizontal: tiempo (segundos)</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="110">Plan</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="130" y2="130" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="165.0" x="80.0" y="85" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="162.5" y="112">0—2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="197">Herramienta A</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="217" y2="217" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="412.5" x="245.0" y="172" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="451.25" y="199">2—7</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="284">Herramienta B</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="304" y2="304" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="247.5" x="245.0" y="259" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="368.75" y="286">2—5</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="371">Integración</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="391" y2="391" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="247.5" x="657.5" y="346" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="781.25" y="373">7—10</text><line stroke="#182632" stroke-width="1" x1="80" x2="905" y1="419" y2="419" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="451"><tspan x="22" y="451" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Las barras se dibujan a escala según las duraciones fijadas en este ejemplo. Las zonas solapadas en paralelo no deben contarse dos veces</tspan><tspan x="22" y="472" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">en el tiempo de reloj.</tspan></text></svg>
