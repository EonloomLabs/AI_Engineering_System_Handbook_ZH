<svg xmlns="http://www.w3.org/2000/svg" aria-label="BM25 compara la frecuencia de términos y la longitud en un mismo denominador" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 330"><title>BM25 compara la frecuencia de términos y la longitud en un mismo denominador</title><rect fill="#fff" height="330" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Factor frecuencia-longitud con el mismo IDF</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="70">A: longitud 100 / frecuencia del término 2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="817.6666666666666" x="24" y="91" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="34" y="119">1.375000</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="186">B: longitud 1000 / frecuencia del término 4</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="393.4636591478697" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="34" y="235">0.661654</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="281"><tspan x="22" y="281" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Ambas comparten la escala 0—1.5. En la figura, B tiene mayor frecuencia del término, pero obtiene menos puntuación por ser un documento</tspan><tspan x="22" y="302" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">muy largo; no es una medición exhaustiva de BM25.</tspan></text></svg>
