<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 664.5" role="img" aria-label="Parámetros y gradientes son dos estados distintos: solo step modifica los parámetros"><title>Parámetros y gradientes son dos estados distintos: solo step modifica los parámetros</title><rect width="960" height="664.5" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">¿Cuándo cambia realmente θ durante una actualización?</text><text x="28" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Acción</text><text x="265" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parámetro θ</text><text x="488" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Gradiente .grad</text><text x="720" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="720" y="83" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Producido o utilizado en este</tspan><tspan x="720" y="105.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">paso</tspan></text><rect x="24" y="134.5" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="168.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">zero_grad</text><text x="272" y="168.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="168.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Vaciar / poner a cero</text><text x="727" y="168.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="168.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Borrar los gradientes</tspan><tspan x="727" y="192.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">anteriores</tspan></text><rect x="24" y="228.5" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="262.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">forward + loss</text><text x="272" y="262.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="262.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Aún sin calcular</text><text x="727" y="262.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits, loss, activaciones</text><rect x="24" y="298.5" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="332.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">backward</text><text x="272" y="332.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="332.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">∂L / ∂θ₀</text><text x="727" y="332.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="332.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Combinar cada gradiente</tspan><tspan x="727" y="356.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">siguiendo la figura</tspan></text><rect x="24" y="392.5" width="902" height="83" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="426.5" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">optimizer.step</text><text x="272" y="426.5" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₁</text><text x="495" y="426.5" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="495" y="426.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Sigue siendo el gradiente</tspan><tspan x="495" y="450.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">de la propagación anterior</tspan></text><text x="727" y="426.5" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="426.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Actualizar θ y el estado</tspan><tspan x="727" y="450.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">de Adam</tspan></text><rect x="24" y="486.5" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="520.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Siguiente forward</text><text x="272" y="520.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Usar θ₁</text><text x="495" y="520.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="495" y="520.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Limpiar/acumular por</tspan><tspan x="495" y="544.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">separado</tspan></text><text x="727" y="520.5" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="520.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Activaciones nuevas,</tspan><tspan x="727" y="544.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">pérdida nueva</tspan></text><line x1="26" y1="586.5" x2="934" y2="586.5" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="609.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="609.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Acumular deliberadamente gradientes de microlotes no es lo mismo que olvidar borrar los anteriores. Después de backward y antes de step no</tspan><tspan x="26" y="630.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">se puede afirmar que los pesos se hayan actualizado.</tspan></text></svg>
