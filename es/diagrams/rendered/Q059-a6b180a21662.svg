<svg xmlns="http://www.w3.org/2000/svg" aria-label="Que dos vectores tengan la misma dimensión no significa que puedan situarse en el mismo espacio de similitud" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 351"><title>Que dos vectores tengan la misma dimensión no significa que puedan situarse en el mismo espacio de similitud</title><rect fill="#fff" height="351" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Dos dimensiones iguales pueden tener coordenadas con significados distintos</text><line stroke="#d6dfe6" stroke-width="1" x1="325.0" x2="615.0" y1="190" y2="190" /><line stroke="#d6dfe6" stroke-width="1" x1="470.0" x2="470.0" y1="45" y2="270" /><line stroke="#182632" stroke-width="2" x1="470.0" x2="585.0" y1="190" y2="190" /><polygon fill="#182632" points="585,190 576,194 576,186" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="585" y="215">q</text><line stroke="#285d96" stroke-width="2" x1="470.0" x2="573.5" y1="190" y2="178.5" /><polygon fill="#285d96" points="573.5,178.5 565,183.47 564.11,175.52" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="573.5" y="160.5">Modelo d compatible</text><line stroke="#8c4a26" stroke-width="2" x1="470.0" x2="458.5" y1="190" y2="86.5" /><polygon fill="#8c4a26" points="458.5,86.5 463.47,95 455.52,95.89" /><text fill="#8c4a26" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="458.5" y="68.5">Cambiar al modelo d</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="302"><tspan x="22" y="302" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tras girar solo los vectores de documentos, la consulta no cambia de forma coordinada. La fórmula de distancia sigue funcionando, pero esa</tspan><tspan x="22" y="323" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">pareja ya no garantiza la relevancia anterior.</tspan></text></svg>
