-serif">Antiguo</text><rect x="778" y="138" width="66" height="70" rx="0" fill="#EAF4EF" stroke="#16766B" stroke-width="1" /><text x="811" y="168" font-size="17" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Nuevo</text><text x="555" y="244" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">V de esta capa</text><rect x="565" y="219" width="66" height="70" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="598" y="249" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Antiguo</text><rect x="636" y="219" width="66" height="70" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="669" y="249" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Antiguo</text><rect x="707" y="219" width="66" height="70" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="740" y="249" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Antiguo</text><rect x="778" y="219" width="66" height="70" rx="0" fill="#EAF4EF" stroke="#16766B" stroke-width="1" /><text x="811" y="249" font-size="17" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Nuevo</text><line x1="426" y1="213" x2="491" y2="213" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="491,213 483,209.5 483,216.5" /><text x="455" y="311" font-size="14" fill="#285D96" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Añadir solo los K/V nuevos</text><rect x="142" y="372" width="680" height="101" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="156" y="398" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits actuales → elegir «！»</text><text x="156" y="423" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="156" y="423" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">«！» es solo el ID elegido entre los candidatos; la caché solo alcanza longitud 5 cuando se introduce</tspan><tspan x="156" y="444" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">en el turno siguiente.</tspan></text><line x1="26" y1="490" x2="934" y2="490" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="513" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="513" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La figura es un esquema lógico de una capa; en modelos multicapa, cada capa conserva sus propios K/V. El número de tokens emitidos no es</tspan><tspan x="26" y="534" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">el de posiciones ya calculadas en caché.</tspan></text></svg>
