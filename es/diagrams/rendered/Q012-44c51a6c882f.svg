<svg xmlns="http://www.w3.org/2000/svg" aria-label="La retropropagación no reproduce las flechas de la propagación hacia delante al revés, sino que distribuye la «influencia» según las dependencias" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 732"><title>La retropropagación no reproduce las flechas de la propagación hacia delante al revés, sino que distribuye la «influencia» según las dependencias</title><rect fill="#fff" height="732" width="940" x="0" y="0" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="46">dO aguas arriba</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="68" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="101">[1,1]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="178">Con respecto a V0 / V1</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="200" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="233">[0.25,0.25] / [0.75,0.75]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="310">Con respecto a P</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="332" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="365">[2,4]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="442">Línea base de dP ponderada por P</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="464" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="497">0.25×2+0.75×4=3.5</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="574">Con respecto a las puntuaciones S</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="596" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="629">[-0.375,+0.375]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="683"><tspan x="22" y="683" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La suma de dS es 0, lo que refleja que trasladar ambas puntuaciones por igual no cambia softmax. Esta figura calcula la influencia sobre la</tspan><tspan x="22" y="704" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">pérdida de una cantidad intermedia.</tspan></text></svg>
