<svg xmlns="http://www.w3.org/2000/svg" aria-label="La memoria de la GPU para entrenar no se calcula solo como «número de parámetros por dos bytes»" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 450"><title>La memoria de la GPU para entrenar no se calcula solo como «número de parámetros por dos bytes»</title><rect fill="#fff" height="450" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="35">Pesos de baja precisión</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="52" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="111.5" x="24" y="52" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="74">2000 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="117">Gradiente</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="134" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="111.5" x="24" y="134" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="156">2000 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="199">Pesos maestros FP32</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="216" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="216" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="238">4000 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="281">Adam m/v</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="298" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="446.0" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="320">8000 B</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="650" text-anchor="start" x="24" y="363">Total: 16000 B</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="401"><tspan x="22" y="401" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La longitud de las barras utiliza un total común como denominador; no mezcla bytes, número de parámetros y cantidad de cálculo en una</tspan><tspan x="22" y="422" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">misma unidad.</tspan></text></svg>
