Fang SC&quot;, sans-serif"><tspan x="26" y="570.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La reutilización válida también exige que coincidan versión del modelo, parámetros, posiciones y configuración de cálculo. Comparar solo el</tspan><tspan x="26" y="591.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">identificador del token actual no basta.</tspan></text></svg>
