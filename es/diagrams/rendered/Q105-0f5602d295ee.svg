<svg xmlns="http://www.w3.org/2000/svg" aria-label="La fiabilidad de «tengo un 80% de confianza» debe calibrarse con un conjunto de resultados reales" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 334"><title>La fiabilidad de «tengo un 80% de confianza» debe calibrarse con un conjunto de resultados reales</title><rect fill="#fff" height="334" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="70">Exactitud autoestimada</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="90" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="713.6" x="24" y="90" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="119">80%</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="190">Exactitud realmente verificada</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="210" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="535.1999999999999" x="24" y="210" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="239">60%</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="285"><tspan x="22" y="285" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Un mismo conjunto de 100 respuestas: confianza declarada de aproximadamente el 80%, pero solo 60 respuestas correctas. Es una muestra</tspan><tspan x="22" y="306" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">didáctica, no una medición de un modelo comercial.</tspan></text></svg>
