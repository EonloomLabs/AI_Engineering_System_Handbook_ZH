<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 436" role="img" aria-label="Cómo se combinan dos listas ordenadas: sumar las contribuciones de los rangos elemento a elemento"><title>Cómo se combinan dos listas ordenadas: sumar las contribuciones de los rangos elemento a elemento</title><rect width="960" height="436" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">RRF · k=60 · Se conserva la identidad A/B/C de los documentos</text><text x="45" y="81" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Ordenación léxica</text><text x="400" y="81" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Ordenación vectorial</text><text x="700" y="81" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Puntuación de fusión</text><text x="40" y="140" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><rect x="82" y="112" width="108" height="48" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="96" y="138" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A</text><path d="M195 136 C270 136 295 312 380 312" fill="none" stroke="#285D96" stroke-width="2" /><text x="40" y="228" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">2</text><rect x="82" y="200" width="108" height="48" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="96" y="226" font-size="17" fill="#182632" font-weight="600" text-anchor="s