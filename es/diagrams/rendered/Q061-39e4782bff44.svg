al, &quot;PingFang SC&quot;, sans-serif">B</text><text x="645" y="131" font-size="22" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.032522</text><text x="645" y="157" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1/62 + 1/61</text><text x="600" y="219" font-size="20" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A</text><text x="645" y="219" font-size="22" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.032266</text><text x="645" y="245" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1/61 + 1/63</text><text x="600" y="307" font-size="20" fill="#A05720" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">C</text><text x="645" y="307" font-size="22" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.032002</text><text x="645" y="333" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1/63 + 1/62</text><line x1="26" y1="358" x2="934" y2="358" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="381" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="381" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Las líneas solo unen un mismo documento y no representan similitud semántica. B ocupa posiciones altas en ambas rutas y por eso precede a</tspan><tspan x="26" y="402" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A. Se fusionan posiciones en el ranking, no se mezclan dos clases de puntuaciones originales.</tspan></text></svg>
