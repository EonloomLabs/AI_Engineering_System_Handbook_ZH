<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 590.5" role="img" aria-label="Los residuos se suman hacia delante; los gradientes se suman en las bifurcaciones hacia atrás"><title>Los residuos se suman hacia delante; los gradientes se suman en las bifurcaciones hacia atrás</title><rect width="960" height="590.5" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Una misma ruta directa cumple funciones distintas hacia delante y hacia atrás</text><text x="28" y="93" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hacia delante: y = x + f(x)</text><rect x="45" y="143" width="120" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="59" y="169" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">x</text><rect x="340" y="143" width="180" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="354" y="169" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">f(x)</text><rect x="785" y="143" width="120" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="799" y="169" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">y</text><line x1="165" y1="172" x2="332" y2="172" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="332,172 324,168.5 324,175.5" /><line x1="520" y1="172" x2="777" y2="172" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="777,172 769,168.5 769,175.5" /><path d="M195 172 V255 H720 V172" fill="none" stroke="#16766B" stroke-width="1.6" /><line x1="720" y1="203" x2="720" y2="172" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="720,172 716.5,180 723.5,180" /><text x="425" y="246" font-size="15" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Ruta directa del valor original sin pasar por f</text><text x="28" y="330" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hacia atrás: dx = dy + df_path</text><rect x="45" y="380" width="120" height="83.5" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="59" y="406" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dx</text><rect x="340" y="380" width="180" height="83.5" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="354" y="406" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="354" y="406" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Retropropagación</tspan><tspan x="354" y="431.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">de f</tspan></text><rect x="785" y="380" width="120" height="83.5" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="799" y="406" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dy</text><line x1="785" y1="409" x2="528" y2="409" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="528,409 536,412.5 536,405.5" /><line x1="340" y1="409" x2="173" y2="409" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="173,409 181,412.5 181,405.5" /><path d="M720 409 V517.5 H205 V409" fill="none" stroke="#16766B" stroke-width="1.6" /><line x1="205" y1="465.5" x2="205" y2="409" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="205,409 201.5,417 208.5,417" /><text x="425" y="508.5" font-size="15" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La ruta directa aporta dy y debe sumarse</text><line x1="26" y1="533.5" x2="934" y2="533.5" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="556.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La entrada compartida x tiene varias rutas hacia la pérdida; hay que sumar sus gradientes y no retropropagar solo por la rama f.</text></svg>
