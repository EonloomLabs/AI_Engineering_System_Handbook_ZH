<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 905" role="img" aria-label="Qué información nueva tiene cada una de las dos llamadas al modelo de una misma tarea"><title>Qué información nueva tiene cada una de las dos llamadas al modelo de una misma tarea</title><rect width="960" height="905" fill="white" /><text x="26" y="31" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Los mensajes circulan entre participantes; cada flecha identifica el objeto concreto de un mismo turno</text><text x="60" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Usuario</text><text x="340" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Harness de ejecución</text><text x="620" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Modelo</text><text x="900" y="90" font-size="16.0486" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Herramienta</text><line x1="60.0" y1="109" x2="60.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="340.0" y1="109" x2="340.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="620.0" y1="109" x2="620.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="900.0" y1="109" x2="900.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><rect x="115" y="125" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="146" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">01 Leer timeout de config.txt</text><line x1="60.0" y1="165" x2="340.0" y2="165" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,165 332,161.5 332,168.5" /><text x="132" y="192" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Se conoce la tarea, pero no el contenido</text><rect x="115" y="208" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="229" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">02 Pregunta + descripción de la herramienta read_file</text><line x1="340.0" y1="248" x2="620.0" y2="248" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="620,248 612,244.5 612,251.5" /><text x="132" y="275" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El modelo dispone de descripciones de capacidades</text><rect x="115" y="291" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="312" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">03 call c1: read_file(config.txt)</text><line x1="620.0" y1="331" x2="340.0" y2="331" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,331 348,334.5 348,327.5" /><text x="132" y="358" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Solo hay una propuesta; aún no se ha obtenido evidencia</text><rect x="115" y="374" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="395" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">04 Ejecutar c1</text><line x1="340.0" y1="414" x2="900.0" y2="414" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="900,414 892,410.5 892,417.5" /><text x="132" y="441" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Leer r7 del disco</text><rect x="115" y="457" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="478" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">05 c1: timeout=30 @r7</text><line x1="900.0" y1="497" x2="340.0" y2="497" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,497 348,500.5 348,493.5" /><text x="132" y="524" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Evidencia obtenida</text><rect x="115" y="540" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="561" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">06 Tarea original + c1 + resultado c1</text><line x1="340.0" y1="580" x2="620.0" y2="580" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="620,580 612,576.5 612,583.5" /><text x="132" y="607" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El siguiente turno incorpora hechos sobre el archivo</text><rect x="115" y="623" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="644" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">07 Borrador de respuesta: timeout es 30, según r7</text><line x1="620.0" y1="663" x2="340.0" y2="663" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,663 348,666.5 348,659.5" /><text x="132" y="690" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">La salida del modelo del segundo turno ha terminado</text><rect x="115" y="706" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="727" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">08 Mostrar el resultado de solo lectura ya comprobado</text><line x1="340.0" y1="746" x2="60.0" y2="746" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="60,746 68,749.5 68,742.5" /><text x="132" y="773" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tarea completada; no se han modificado archivos</text><line x1="26" y1="806" x2="934" y2="806" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="829" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="829" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">El tiempo avanza de arriba abajo; el espacio entre filas no representa duración. Las líneas continuas son solicitudes o acciones, y las</tspan><tspan x="26" y="850" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">discontinuas son los retornos indicados explícitamente en la figura. La fuente son los mensajes didácticos fijos de esta sección; no se infiere el</tspan><tspan x="26" y="871" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">interior de productos cerrados.</tspan></text></svg>
