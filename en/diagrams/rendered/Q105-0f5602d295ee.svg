<svg xmlns="http://www.w3.org/2000/svg" aria-label="Whether &quot;I am 80% sure&quot; is reliable has to be calibrated against a set of actual results" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 334"><title>Whether "I am 80% sure" is reliable has to be calibrated against a set of actual results</title><rect fill="#fff" height="334" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="70">Self-assessed accuracy</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="90" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="713.6" x="24" y="90" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="119">80%</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="190">Actually verified accuracy</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="210" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="535.1999999999999" x="24" y="210" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="239">60%</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="285"><tspan x="22" y="285" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">The same 100 answers: claimed confidence around 80%, with 60 actually correct. Teaching sample only, not a commercial model</tspan><tspan x="22" y="306" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">measurement.</tspan></text></svg>
