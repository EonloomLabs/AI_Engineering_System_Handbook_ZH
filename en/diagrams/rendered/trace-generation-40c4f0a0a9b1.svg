<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 534" role="img" aria-label="One set of trained weights: predict, append and stop, turn by turn"><title>One set of trained weights: predict, append and stop, turn by turn</title><rect width="960" height="534" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Every turn uses θ*; parameters stay unchanged during inference</text><text x="28" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Turn</text><text x="170" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Actual input this turn</text><text x="485" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cache coverage</text><text x="730" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Newly selected Token</text><rect x="24" y="115" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="33" y="148" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Prefill</text><text x="175" y="148" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">BOS / 我 / 爱</text><text x="490" y="148" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0 → 3</text><text x="735" y="148" font-size="17" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">学习</text><text x="180" y="183" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">The newly selected item has not had its own forward pass yet</text><rect x="24" y="231" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="33" y="264" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Decode 1</text><text x="175" y="264" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">学习</text><text x="490" y="264" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3 → 4</text><text x="735" y="264" font-size="17" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">！</text><text x="180" y="299" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">The newly selected item has not had its own forward pass yet</text><rect x="24" y="347" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="33" y="380" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Decode 2</text><text x="175" y="380" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">！</text><text x="490" y="380" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">4 → 5</text><text x="735" y="380" font-size="17" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">EOS</text><text x="180" y="415" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">EOS selected: the harness stops without adding a cache entry for EOS</text><line x1="26" y1="456" x2="934" y2="456" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="479" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="479" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Values and selections come from this package's actual CPU teaching experiment in run.json; argmax is the default. All three forward passes'</tspan><tspan x="26" y="500" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits match full recomputation.</tspan></text></svg>
