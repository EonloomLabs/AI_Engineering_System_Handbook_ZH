<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 594" role="img" aria-label="Parameters and gradients are two separate states: only step changes the parameters"><title>Parameters and gradients are two separate states: only step changes the parameters</title><rect width="960" height="594" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">When does θ actually change during an update?</text><text x="28" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Action</text><text x="265" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters θ</text><text x="488" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Gradient .grad</text><text x="720" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Produced or used at this step</text><rect x="24" y="112" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">zero_grad</text><text x="272" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Clear / zero</text><text x="727" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Clear old gradients</text><rect x="24" y="182" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">forward + loss</text><text x="272" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Not computed yet</text><text x="727" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits, loss, activations</text><rect x="24" y="252" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">backward</text><text x="272" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">∂L / ∂θ₀</text><text x="727" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="286" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Combine all gradients</tspan><tspan x="727" y="310" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">along the graph</tspan></text><rect x="24" y="346" width="902" height="83" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">optimizer.step</text><text x="272" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₁</text><text x="495" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="495" y="380" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Still gradients from the old</tspan><tspan x="495" y="404" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">forward pass</tspan></text><text x="727" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="380" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Update θ and Adam</tspan><tspan x="727" y="404" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">state</tspan></text><rect x="24" y="440" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Next forward</text><text x="272" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Use θ₁</text><text x="495" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Clear / accumulate separately</text><text x="727" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">New activations, new loss</text><line x1="26" y1="516" x2="934" y2="516" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="539" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="539" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Intentionally accumulating microbatch gradients differs from forgetting to clear old gradients. After backward but before step, weights cannot be</tspan><tspan x="26" y="560" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">claimed to have been updated.</tspan></text></svg>
