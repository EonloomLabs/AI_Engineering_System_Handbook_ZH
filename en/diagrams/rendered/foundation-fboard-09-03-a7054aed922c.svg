<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 559" role="img" aria-label="One set of scores [2,1,0], from computation to sampling"><title>One set of scores [2,1,0], from computation to sampling</title><rect width="960" height="559" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Each column always represents the same candidate</text><text x="28" y="70" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Calculation step</text><text x="350" y="70" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A</text><text x="555" y="70" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">B</text><text x="760" y="70" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">C</text><text x="28" y="124" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Raw scores</text><rect x="295" y="98" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="385" y="125" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">2</text><rect x="500" y="98" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="590" y="125" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><rect x="705" y="98" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="795" y="125" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0</text><text x="28" y="182" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Subtract the maximum, 2</text><rect x="295" y="156" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="385" y="183" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0</text><rect x="500" y="156" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="590" y="183" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">-1</text><rect x="705" y="156" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="795" y="183" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">-2</text><text x="28" y="240" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Exponentials</text><rect x="295" y="214" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="385" y="241" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><rect x="500" y="214" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="590" y="241" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.367879</text><rect x="705" y="214" width="180" height="42" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="795" y="241" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.135335</text><text x="28" y="298" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Divide by the sum</text><rect x="295" y="272" width="180" height="42" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="385" y="299" font-size="17" fill="#285D96" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.665241</text><rect x="500" y="272" width="180" height="42" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="590" y="299" font-size="17" fill="#285D96" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.244728</text><rect x="705" y="272" width="180" height="42" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="795" y="299" font-size="17" fill="#285D96" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.090031</text><text x="28" y="335" font-size="16" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Sum of exponentials = 1 + 0.367879… + 0.135335… = 1.503215…</text><rect x="28" y="378" width="582.0858363029691" height="48" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="319.0429" y="408" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">A</text><rect x="610.0858363029691" y="378" width="214.13741217294793" height="48" rx="0" fill="#EAF4EF" stroke="#D6DFE6" stroke-width="1" /><text x="717.1545" y="408" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">B</text><rect x="824.2232484759171" y="378" width="78.77675152408291" height="48" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="863.6116" y="408" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">C</text><line x1="28" y1="426" x2="28" y2="435" stroke="#182632" stroke-width="1" /><text x="28" y="456" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0</text><line x1="610.0858363029691" y1="426" x2="610.0858363029691" y2="435" stroke="#182632" stroke-width="1" /><text x="610.0858" y="456" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.665241</text><line x1="824.2232484759171" y1="426" x2="824.2232484759171" y2="435" stroke="#182632" stroke-width="1" /><text x="824.2232" y="456" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.909969</text><line x1="903" y1="426" x2="903" y2="435" stroke="#182632" stroke-width="1" /><text x="903" y="456" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><line x1="640.5" y1="348" x2="640.5" y2="377" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="640.5,377 644,369 637,369" /><text x="634.5" y="338" font-size="16" fill="#16766B" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">u=0.70 → B</text><line x1="26" y1="481" x2="934" y2="481" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="504" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="504" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Bar lengths are proportional to probabilities; boundaries use unrounded cumulative probabilities. argmax selects A; a given sampling value of</tspan><tspan x="26" y="525" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.70 selects B. This is not whole-answer accuracy.</tspan></text></svg>
