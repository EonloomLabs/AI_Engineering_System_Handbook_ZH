<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 987" role="img" aria-label="The shared forward pass: parameters enter from the side; the residual is kept and rejoins the original representation"><title>The shared forward pass: parameters enter from the side; the residual is kept and rejoins the original representation</title><rect width="960" height="987" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Single-layer teaching model · retain both residual addition points</text><rect x="90" y="94" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="120" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">E[ids] + P[pos]</text><text x="104" y="145" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">X [B,T,4]</text><rect x="90" y="214" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="240" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">RMSNorm → Q/K/V</text><text x="104" y="265" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Multiply each row by Wq / Wk / Wv</text><rect x="90" y="334" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="360" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">QKᵀ / 2 → mask → softmax</text><text x="104" y="385" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Obtain A, then compute A @ V; mix across source positions</text><rect x="90" y="454" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="480" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Multiply by Wo, then add X back</text><text x="104" y="505" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">R = X + Δattention</text><rect x="90" y="574" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="600" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">RMSNorm → W1 → ReLU → W2</text><text x="104" y="625" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">4 dimensions → 8 dimensions → 4 dimensions</text><rect x="90" y="694" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="720" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Add R back, then apply RMSNorm</text><text x="104" y="745" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">H = R + ΔFFN</text><rect x="90" y="814" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="104" y="840" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Multiply by U</text><text x="104" y="865" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits [B,T,8]</text><line x1="335" y1="172" x2="335" y2="207" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,207 338.5,199 331.5,199" /><line x1="335" y1="292" x2="335" y2="327" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,327 338.5,319 331.5,319" /><line x1="335" y1="412" x2="335" y2="447" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,447 338.5,439 331.5,439" /><line x1="335" y1="532" x2="335" y2="567" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,567 338.5,559 331.5,559" /><line x1="335" y1="652" x2="335" y2="687" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,687 338.5,679 331.5,679" /><line x1="335" y1="772" x2="335" y2="807" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="335,807 338.5,799 331.5,799" /><path d="M90 133 H43 V493 H82" fill="none" stroke="#16766B" stroke-width="2" /><line x1="60" y1="493" x2="82" y2="493" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="82,493 74,489.5 74,496.5" /><text x="16" y="310" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">X</text><path d="M580 493 H630 V733 H588" fill="none" stroke="#16766B" stroke-width="2" /><line x1="610" y1="733" x2="588" y2="733" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="588,733 596,736.5 596,729.5" /><text x="644" y="618" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">R</text><text x="692" y="134" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters: E, P</text><line x1="676" y1="141" x2="590" y2="141" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,141 598,144.5 598,137.5" /><text x="692" y="254" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters: g1, Wq, Wk, Wv</text><line x1="676" y1="261" x2="590" y2="261" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,261 598,264.5 598,257.5" /><text x="692" y="494" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters: Wo</text><line x1="676" y1="501" x2="590" y2="501" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,501 598,504.5 598,497.5" /><text x="692" y="614" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters: g2, W1, W2</text><line x1="676" y1="621" x2="590" y2="621" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,621 598,624.5 598,617.5" /><text x="692" y="734" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters: gf</text><line x1="676" y1="741" x2="590" y2="741" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,741 598,744.5 598,737.5" /><text x="692" y="854" font-size="15" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Parameters: U</text><line x1="676" y1="861" x2="590" y2="861" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="590,861 598,864.5 598,857.5" /><line x1="26" y1="909" x2="934" y2="909" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="932" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="932" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Arrows show data dependencies, not durations. Training and inference both call forward; loss, backpropagation and updates are outside this</tspan><tspan x="26" y="953" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">shared forward pass.</tspan></text></svg>
