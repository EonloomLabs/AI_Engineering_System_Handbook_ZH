;, sans-serif">The same shares also apply separately to the other three features</text><rect x="300" y="501" width="115" height="45" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="357.5" y="529.35" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">-0.4450</text><rect x="415" y="501" width="115" height="45" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="472.5" y="529.35" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">0.3388</text><rect x="530" y="501" width="115" height="45" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="587.5" y="529.35" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">-0.1836</text><rect x="645" y="501" width="115" height="45" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="702.5" y="529.35" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">-0.3945</text><line x1="26" y1="563" x2="934" y2="563" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="586" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="586" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Shares are normalized along the "source position" axis; each V column is summed independently with these weights. This does not select a word</tspan><tspan x="26" y="607" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">or remix Keys.</tspan></text></svg>
