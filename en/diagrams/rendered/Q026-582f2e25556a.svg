<svg xmlns="http://www.w3.org/2000/svg" aria-label="A cache is counted in bytes; the compute it saves is a separate account" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 429"><title>A cache is counted in bytes; the compute it saves is a separate account</title><rect fill="#fff" height="429" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="35">Layer 1 K</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="52" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="52" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="74">48 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="117">Layer 1 V</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="134" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="134" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="156">48 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="199">Layer 2 K</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="216" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="216" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="238">48 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="281">Layer 2 V</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="298" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="320">48 B</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="650" text-anchor="start" x="24" y="363">Total: 192 B</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="401">Bar lengths share one total as their denominator; bytes, parameter counts and computation have not been conflated into one unit.</text></svg>
