<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 578" role="img" aria-label="Paired evaluation: across the 20 tasks, both the fixes and the breakages have to be counted"><title>Paired evaluation: across the 20 tasks, both the fixes and the breakages have to be counted</title><rect width="960" height="578" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Align the same tasks item by item, rather than compare unrelated samples</text><text x="317.5" y="121" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">New: success</text><text x="542.5" y="121" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">New: failure</text><text x="191" y="196" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old: success</text><rect x="205" y="133" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="196" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">12</text><rect x="430" y="133" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="196" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><text x="191" y="296" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old: failure</text><rect x="205" y="233" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="296" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3</text><rect x="430" y="233" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="296" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">4</text><text x="238" y="424" font-size="22" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3 new fixes</text><text x="548" y="424" font-size="22" fill="#A13A37" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1 regression</text><text x="238" y="475" font-size="21" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Net improvement = (3−1) / 20 = 10 percentage points</text><line x1="26" y1="500" x2="934" y2="500" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="523" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="523" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old successes 13/20, new successes 15/20. Diagonal cells do not change the net difference; percentages from these 20 questions alone cannot</tspan><tspan x="26" y="544" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">prove stable population-wide gains.</tspan></text></svg>
