<svg xmlns="http://www.w3.org/2000/svg" aria-label="The numerator of cost per successful task must include failures and rework" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 310"><title>The numerator of cost per successful task must include failures and rework</title><rect fill="#fff" height="310" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Shared denominator: completing one successful task</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="72">A: per successful task</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="743.3333333333334" x="24" y="92" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="120">1.25</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="187">B: per successful task</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="832.5333333333333" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="235">1.4</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="282">A total cost 100 / successes 80 = 1.25; B total cost 70 / successes 50 = 1.40. Failed runs' costs remain in the numerator.</text></svg>
