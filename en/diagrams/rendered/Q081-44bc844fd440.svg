<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 794" role="img" aria-label="A timeout goes to unknown, and recovery must check the side effects first"><title>A timeout goes to unknown, and recovery must check the side effects first</title><rect width="960" height="794" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Keep state nodes separate from transition conditions; unknown is not failure</text><rect x="40" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">recorded</text><text x="54" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Operation ID recorded</text><rect x="350" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="364" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">executing</text><text x="364" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Action dispatched</text><rect x="675" y="92" width="225" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="689" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">succeeded</text><text x="689" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Result received and persisted</text><rect x="350" y="310" width="190" height="95" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="364" y="336" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">unknown</text><text x="364" y="361" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="364" y="361" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">No definite</tspan><tspan x="364" y="382" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">acknowledgment received</tspan></text><rect x="40" y="533" width="240" height="95" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="559" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmed_not_done</text><text x="54" y="584" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="54" y="584" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Verification confirms it did not</tspan><tspan x="54" y="605" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">occur</tspan></text><rect x="650" y="533" width="250" height="95" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="664" y="559" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmed_done</text><text x="664" y="584" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Verification confirms it occurred</text><line x1="230" y1="129" x2="342" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="342,129 334,125.5 334,132.5" /><text x="280" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Dispatch</text><line x1="540" y1="129" x2="667" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="667,129 659,125.5 659,132.5" /><text x="602" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Confirm the result</text><line x1="445" y1="166" x2="445" y2="301" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="445,301 448.5,293 441.5,293" /><text x="458" y="240" font-size="15" fill="#A05720" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Timeout / connection interrupted</text><line x1="391" y1="405" x2="216" y2="524" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="216,524 224.58,522.4 220.65,516.61" /><text x="165" y="460" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Query downstream state</text><line x1="499" y1="405" x2="755" y2="524" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="755,524 749.22,517.45 746.27,523.8" /><text x="740" y="460" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Verify commit evidence by operation ID</text><path d="M40 571 H16 V129 H32" fill="none" stroke="#285D96" stroke-width="1.6" /><line x1="16" y1="129" x2="32" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="32,129 24,125.5 24,132.5" /><text x="38" y="667" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Confirmed not to have occurred: retry according to policy</text><path d="M900 571 H930 V129 H908" fill="none" stroke="#16766B" stroke-width="1.6" /><line x1="930" y1="129" x2="908" y2="129" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="908,129 916,132.5 916,125.5" /><text x="650" y="667" font-size="16" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="650" y="667" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Confirmed to have occurred: record</tspan><tspan x="650" y="691" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">completion, do not execute again</tspan></text><line x1="26" y1="716" x2="934" y2="716" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="739" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="739" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">This is a teaching harness's recovery design, not an API guarantee. Keep unknown and escalate if verification is inconclusive; no</tspan><tspan x="26" y="760" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">acknowledgment does not mean no side effect.</tspan></text></svg>
