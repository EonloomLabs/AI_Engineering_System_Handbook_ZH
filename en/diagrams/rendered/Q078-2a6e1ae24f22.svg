<svg xmlns="http://www.w3.org/2000/svg" aria-label="The longest dependency path in a DAG decides the earliest that parallel tasks can finish" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 471"><title>The longest dependency path in a DAG decides the earliest that parallel tasks can finish</title><rect fill="#fff" height="471" width="940" x="0" y="0" /><line stroke="#285d96" stroke-width="2" x1="240" x2="340" y1="198" y2="69" /><polygon fill="#285d96" points="340,69 336.69,78.28 330.9,72.76" /><line stroke="#d6dfe6" stroke-width="2" x1="240" x2="340" y1="198" y2="322" /><polygon fill="#d6dfe6" points="340,322 330.81,318.46 336.46,312.81" /><line stroke="#285d96" stroke-width="2" x1="530" x2="680" y1="69" y2="198" /><polygon fill="#285d96" points="680,198 670.33,196.12 674.92,189.56" /><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="680" y1="322" y2="198" /><polygon fill="#d6dfe6" points="680,198 674.73,206.32 670.29,199.66" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="180" x="60" y="174" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="70" y="200">A locate · 2 minutes</text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="180" x="350" y="45" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="71"><tspan x="360" y="71" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">B implement · 4</tspan><tspan x="360" y="95" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">minutes</tspan></text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="298" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="324">C test · 3 minutes</text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="180" x="690" y="174" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="700" y="200"><tspan x="700" y="200" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">D integrate · 1</tspan><tspan x="700" y="224" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">minute</tspan></text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="24" y="384">Critical path: A → B → D = 2+4+1 = 7 minutes</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="422"><tspan x="22" y="422" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Total work is 10 minutes. Shortening noncritical branch C may not change delivery time; communication and integration overheads are not</tspan><tspan x="22" y="443" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">included yet.</tspan></text></svg>
