<svg xmlns="http://www.w3.org/2000/svg" aria-label="GQA keeps several queries, and only has them share fewer K/V" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 423"><title>GQA keeps several queries, and only has them share fewer K/V</title><rect fill="#fff" height="423" width="940" x="0" y="0" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="45" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="75" y="71">Query head 0</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="70" y2="100" /><polygon fill="#285d96" points="660,100 650.75,103.38 651.29,95.4" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="130" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="75" y="156">Query head 1</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="155" y2="100" /><polygon fill="#285d96" points="660,100 651.57,105.09 650.57,97.15" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="215" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="75" y="241">Query head 2</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="240" y2="275" /><polygon fill="#285d96" points="660,275 650.71,278.27 651.35,270.3" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="300" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="75" y="326">Query head 3</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="325" y2="275" /><polygon fill="#285d96" points="660,275 651.51,279.99 650.61,272.04" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="205" x="670" y="75" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="680" y="101">Shared K0 / V0</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="205" x="670" y="250" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="680" y="276">Shared K1 / V1</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="374"><tspan x="22" y="374" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">The four Query vectors still compute separate shares and outputs; converging arrows mean they read the same KV group, not that their</tspan><tspan x="22" y="395" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">results match.</tspan></text></svg>
