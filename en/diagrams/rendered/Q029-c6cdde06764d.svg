<svg xmlns="http://www.w3.org/2000/svg" aria-label="Continuous batching gives a freed slot to a new request, but a scheduling step is not an equal length of time" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 313"><title>Continuous batching gives a freed slot to a new request, but a scheduling step is not an equal length of time</title><rect fill="#fff" height="313" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="650" text-anchor="start" x="20" y="30">Allocation of two decoding slots at each step</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="206.6667" y="113">Step 1</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="490" y="113">Step 2</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="773.3333" y="113">Step 3</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="55" y="165.25">Slot 0</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="65.0" y="123" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="206.6667" y="165.25">A ends</text><rect fill="#eff4f8" height="65" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="348.3333333333333" y="123" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="490" y="165.25">C 1/2</text><rect fill="#eff4f8" height="65" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="631.6666666666666" y="123" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="773.3333" y="165.25">C ends</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="55" y="230.25">Slot 1</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="65.0" y="188" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="206.6667" y="230.25">B 1/3</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="348.3333333333333" y="188" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="490" y="230.25">B 2/3</text><rect fill="#fff" height="65" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="631.6666666666666" y="188" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="773.3333" y="230.25">B ends</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="285">C is ready; prefill is excluded. Equal-width columns indicate scheduling steps, not equal actual durations.</text></svg>
