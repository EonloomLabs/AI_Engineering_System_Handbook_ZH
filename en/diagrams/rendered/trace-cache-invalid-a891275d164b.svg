<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 600" role="img" aria-label="When the prefix changes partway through, the cache at the change and in the suffix has to be recomputed"><title>When the prefix changes partway through, the cache at the change and in the suffix has to be recomputed</title><rect width="960" height="600" fill="white" /><text x="26" y="32" font-size="19" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Change only position 1: 我 → 你; model parameters and position conventions stay the same</text><text x="266" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Position 0</text><text x="428" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Position 1</text><text x="590" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Position 2</text><text x="752" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Position 3</text><text x="32" y="152" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Original input</text><rect x="185" y="118" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="261" y="158" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">BOS</text><rect x="347" y="118" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="423" y="158" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">我</text><rect x="509" y="118" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="585" y="158" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">爱</text><rect x="671" y="118" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="747" y="158" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">学习</text><text x="32" y="258" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">New input</text><rect x="185" y="224" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="261" y="264" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">BOS</text><rect x="347" y="224" width="152" height="65" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="423" y="264" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">你</text><rect x="509" y="224" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="585" y="264" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">爱</text><rect x="671" y="224" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="747" y="264" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">学习</text><text x="32" y="364" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cache decision</text><rect x="185" y="330" width="152" height="65" rx="0" fill="#EAF4EF" stroke="#D6DFE6" stroke-width="1" /><text x="261" y="370" font-size="20" fill="#16766B" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Reusable</text><rect x="347" y="330" width="152" height="65" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="423" y="370" font-size="19.3571" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Recomputation</text><rect x="509" y="330" width="152" height="65" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="585" y="370" font-size="19.3571" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Recomputation</text><rect x="671" y="330" width="152" height="65" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="747" y="370" font-size="19.3571" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Recomputation</text><path d="M424 290 V424 H824" fill="none" stroke="#A05720" stroke-width="1.7" /><line x1="796" y1="424" x2="824" y2="424" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="824,424 816,420.5 816,427.5" /><text x="340" y="470" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="340" y="470" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Later Tokens are unchanged, but the prefixes they can read have</tspan><tspan x="340" y="497" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">changed.</tspan></text><line x1="26" y1="522" x2="934" y2="522" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="545" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="545" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Valid reuse also requires matching model versions, parameters, positions and computation settings. Comparing only the current Token's ID is</tspan><tspan x="26" y="566" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">insufficient.</tspan></text></svg>
