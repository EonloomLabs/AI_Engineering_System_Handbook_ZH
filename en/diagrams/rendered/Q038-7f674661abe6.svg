<svg xmlns="http://www.w3.org/2000/svg" aria-label="Byte completeness, event completeness and argument completeness are handled by different buffers" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 641"><title>Byte completeness, event completeness and argument completeness are handled by different buffers</title><rect fill="#fff" height="641" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="22" y="35">Network fragment 1</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="65" x="24" y="52" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="78">E7</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="65" x="99" y="52" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="109" y="78">88</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="119">Only the first two UTF-8 bytes of "爱"</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="22" y="171">Network fragment 2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="65" x="24" y="188" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="214">B1</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="255">Only joining E7 88 B1 decodes "爱"</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="22" y="307">One event complete</text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="198.40000000000003" x="24" y="324" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="350">arguments += {"path</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="374">":</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="415">Not a complete JSON object</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="22" y="467">Call arguments complete</text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="148.0" x="24" y="484" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="510">{"path":"a.py"</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="534">}</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="575">Only then begin parsing, type checking and authorization</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="613">The three boundaries have separate buffering rules. Receiving a network chunk does not authorize execution.</text></svg>
