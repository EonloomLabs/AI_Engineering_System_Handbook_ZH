<svg xmlns="http://www.w3.org/2000/svg" aria-label="Separate the wait, the first item and the later items before asking why it is slow" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 399"><title>Separate the wait, the first item and the later items before asking why it is slow</title><rect fill="#fff" height="399" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Horizontal axis: time (seconds)</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="17.7461" y="110">Queuing</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="130" y2="130" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="235.71428571428575" x="80.0" y="85" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="197.8571" y="112">0—0.2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="197">Prefill</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="217" y2="217" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="353.5714285714286" x="315.7142857142858" y="172" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="492.5" y="199">0.2—0.5</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="284">4 decode steps</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="304" y2="304" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="235.71428571428567" x="669.2857142857143" y="259" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="787.1429" y="286">0.5—0.7</text><line stroke="#182632" stroke-width="1" x1="80" x2="905" y1="339" y2="339" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="371">Bars are proportional to the durations given in this example. Parallel overlaps must not be counted twice in wall-clock time.</text></svg>
