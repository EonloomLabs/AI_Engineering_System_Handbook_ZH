mily="Arial, &quot;PingFang SC&quot;, sans-serif">After processing: cache_len=4</text><text x="603" y="119" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">BOS</text><text x="674" y="119" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">我</text><text x="745" y="119" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">爱</text><text x="816" y="119" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">学习</text><text x="555" y="163" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">This layer's K</text><rect x="565" y="138" width="66" height="49" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="598" y="168" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old</text><rect x="636" y="138" width="66" height="49" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="669" y="168" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old</text><rect x="707" y="138" width="66" height="49" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="740" y="168" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old</text><rect x="778" y="138" width="66" height="49" rx="0" fill="#EAF4EF" stroke="#16766B" stroke-width="1" /><text x="811" y="168" font-size="17" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">New</text><text x="555" y="223" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">This layer's V</text><rect x="565" y="198" width="66" height="49" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="598" y="228" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old</text><rect x="636" y="198" width="66" height="49" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="669" y="228" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old</text><rect x="707" y="198" width="66" height="49" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="1" /><text x="740" y="228" font-size="17" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Old</text><rect x="778" y="198" width="66" height="49" rx="0" fill="#EAF4EF" stroke="#16766B" stroke-width="1" /><text x="811" y="228" font-size="17" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">New</text><line x1="426" y1="192" x2="491" y2="192" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="491,192 483,188.5 483,195.5" /><text x="455" y="269" font-size="14" fill="#285D96" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Append only new K/V</text><rect x="142" y="330" width="680" height="80" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="156" y="356" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">This turn's logits → select "！"</text><text x="156" y="381" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">"！" is only the ID selected from the candidates; cache length becomes 5 only after it is input next turn.</text><line x1="26" y1="427" x2="934" y2="427" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="450" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="450" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">This is a single-layer logical illustration; actual multiple layers retain different K/V separately. Output Token count is not the number of positions</tspan><tspan x="26" y="471" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">computed into the cache.</tspan></text></svg>
