<svg xmlns="http://www.w3.org/2000/svg" aria-label="BM25 compares term frequency and length inside the same denominator" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 330"><title>BM25 compares term frequency and length inside the same denominator</title><rect fill="#fff" height="330" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Term-frequency–length factor at the same IDF</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="70">A: length 100 / term frequency 2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="817.6666666666666" x="24" y="91" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="34" y="119">1.375000</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="186">B: length 1000 / term frequency 4</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="393.4636591478697" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="34" y="235">0.661654</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="281"><tspan x="22" y="281" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Both bars share a 0—1.5 scale. B has higher term frequency but scores lower because its document is much longer; this is not a full BM25</tspan><tspan x="22" y="302" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">measurement.</tspan></text></svg>
