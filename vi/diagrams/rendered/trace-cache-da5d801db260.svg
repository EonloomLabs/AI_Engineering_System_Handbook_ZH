23" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">“！” chỉ là ID được chọn từ ứng viên; đến lượt sau nhập nó vào thì độ dài bộ nhớ đệm mới thành 5.</text><line x1="26" y1="469" x2="934" y2="469" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="492" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hình là minh họa logic một lớp; nhiều lớp thực tế mỗi lớp giữ K/V khác nhau. Không thể coi số Token đã xuất là số vị trí đã tính vào bộ nhớ đệm.</text></svg>
