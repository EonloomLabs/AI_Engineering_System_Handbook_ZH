<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 773" role="img" aria-label="Hết thời gian chờ chuyển sang unknown, khôi phục phải đối chiếu tác dụng phụ trước"><title>Hết thời gian chờ chuyển sang unknown, khôi phục phải đối chiếu tác dụng phụ trước</title><rect width="960" height="773" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tách nút trạng thái và điều kiện chuyển; chưa xác định không phải thất bại</text><rect x="40" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">recorded</text><text x="54" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đã ghi ID thao tác</text><rect x="350" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="364" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">executing</text><text x="364" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hành động đã gửi</text><rect x="675" y="92" width="225" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="689" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">succeeded</text><text x="689" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Có kết quả và đã lưu bền</text><rect x="350" y="310" width="190" height="95" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="364" y="336" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">unknown</text><text x="364" y="361" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="364" y="361" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Chưa nhận biên nhận</tspan><tspan x="364" y="382" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">chắc chắn</tspan></text><rect x="40" y="533" width="240" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="559" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmed_not_done</text><text x="54" y="584" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Kiểm chứng xác nhận chưa xảy ra</text><rect x="650" y="533" width="250" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="664" y="559" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">confirmed_done</text><text x="664" y="584" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Kiểm chứng xác nhận đã xảy ra</text><line x1="230" y1="129" x2="342" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="342,129 334,125.5 334,132.5" /><text x="280" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Phân công</text><line x1="540" y1="129" x2="667" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="667,129 659,125.5 659,132.5" /><text x="602" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Xác nhận kết quả</text><line x1="445" y1="166" x2="445" y2="301" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="445,301 448.5,293 441.5,293" /><text x="458" y="240" font-size="15" fill="#A05720" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hết thời gian chờ / Mất kết nối</text><line x1="391" y1="405" x2="216" y2="524" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="216,524 224.58,522.4 220.65,516.61" /><text x="165" y="460" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Truy vấn trạng thái phía hạ nguồn</text><line x1="499" y1="405" x2="755" y2="524" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="755,524 749.22,517.45 746.27,523.8" /><text x="740" y="460" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Kiểm chứng bằng chứng commit theo ID thao tác</text><path d="M40 571 H16 V129 H32" fill="none" stroke="#285D96" stroke-width="1.6" /><line x1="16" y1="129" x2="32" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="32,129 24,125.5 24,132.5" /><text x="38" y="646" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Xác nhận chưa xảy ra: thử lại theo chính sách</text><path d="M900 571 H930 V129 H908" fill="none" stroke="#16766B" stroke-width="1.6" /><line x1="930" y1="129" x2="908" y2="129" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="908,129 916,132.5 916,125.5" /><text x="650" y="646" font-size="16" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="650" y="646" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Xác nhận đã xảy ra: ghi bổ sung hoàn</tspan><tspan x="650" y="670" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">thành, không thực thi lặp</tspan></text><line x1="26" y1="695" x2="934" y2="695" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="718" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="718" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đây là thiết kế khôi phục của khung thực thi giảng dạy, không phải bảo đảm của một API cụ thể. Khi chưa xác minh được thì giữ unknown và</tspan><tspan x="26" y="739" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">chuyển cấp xử lý, không được xem thiếu biên nhận là không có tác dụng phụ.</tspan></text></svg>
