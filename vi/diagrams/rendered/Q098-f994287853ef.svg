<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tử số chi phí trên nhiệm vụ thành công phải bao gồm cả thất bại và làm lại" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 310"><title>Tử số chi phí trên nhiệm vụ thành công phải bao gồm cả thất bại và làm lại</title><rect fill="#fff" height="310" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Mẫu số thống nhất: hoàn thành một nhiệm vụ thành công</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="72">A: trên mỗi nhiệm vụ thành công</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="743.3333333333334" x="24" y="92" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="120">1.25</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="187">B: trên mỗi nhiệm vụ thành công</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="832.5333333333333" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="235">1.4</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="282">A tổng chi phí 100/thành công 80=1.25; B tổng chi phí 70/thành công 50=1.40. Chi phí của các lần chạy thất bại không bị loại khỏi tử số.</text></svg>
