ect fill="#eff4f8" height="11" rx="4" stroke="#285d96" width="211.25" x="262.5" y="394" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="368.125" y="433">E1: 0.1</text><rect fill="#eff4f8" height="22" rx="4" stroke="#285d96" width="211.25" x="480.0" y="383" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="585.625" y="433">E2: 0.2</text><rect fill="#eff4f8" height="66" rx="4" stroke="#285d96" width="211.25" x="697.5" y="339" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="803.125" y="433">E3: 0.6</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="471">A chọn E0/E1, B chọn E3/E2. Chiều cao cột là xác suất định tuyến cho trước trong hình này, không phải chất lượng đầu ra chuyên gia.</text></svg>
