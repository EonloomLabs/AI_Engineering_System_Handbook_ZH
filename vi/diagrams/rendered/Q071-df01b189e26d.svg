<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 601" role="img" aria-label="Thời gian hiệu lực và thời gian ghi nhận: thời điểm hệ thống biết không phải thời điểm sự kiện có hiệu lực"><title>Thời gian hiệu lực và thời gian ghi nhận: thời điểm hệ thống biết không phải thời điểm sự kiện có hiệu lực</title><rect width="960" height="601" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Một sự kiện có hai trục thời gian</text><text x="26" y="157" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Thời gian hiệu lực</text><line x1="165" y1="150" x2="915" y2="150" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="915,150 907,146.5 907,153.5" /><line x1="165.0" y1="144" x2="165.0" y2="156" stroke="#182632" stroke-width="1" /><text x="165" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/1</text><line x1="365.0" y1="144" x2="365.0" y2="156" stroke="#182632" stroke-width="1" /><text x="365" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/3</text><line x1="565.0" y1="144" x2="565.0" y2="156" stroke="#182632" stroke-width="1" /><text x="565" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/5</text><line x1="665.0" y1="144" x2="665.0" y2="156" stroke="#182632" stroke-width="1" /><text x="665" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/6</text><line x1="865.0" y1="144" x2="865.0" y2="156" stroke="#182632" stroke-width="1" /><text x="865" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/8</text><text x="26" y="361" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Thời gian ghi nhận</text><line x1="165" y1="354" x2="915" y2="354" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="915,354 907,350.5 907,357.5" /><line x1="165.0" y1="348" x2="165.0" y2="360" stroke="#182632" stroke-width="1" /><text x="165" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/1</text><line x1="365.0" y1="348" x2="365.0" y2="360" stroke="#182632" stroke-width="1" /><text x="365" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/3</text><line x1="565.0" y1="348" x2="565.0" y2="360" stroke="#182632" stroke-width="1" /><text x="565" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/5</text><line x1="665.0" y1="348" x2="665.0" y2="360" stroke="#182632" stroke-width="1" /><text x="665" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/6</text><line x1="865.0" y1="348" x2="865.0" y2="360" stroke="#182632" stroke-width="1" /><text x="865" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">10/8</text><rect x="165.0" y="106" width="400.0" height="32" rx="0" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="365" y="96" font-size="17" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Quy tắc có hiệu lực từ ngày 1 đến ngày 5</text><line x1="365.0" y1="284" x2="365.0" y2="352" stroke="#16766B" stroke-width="2" /><text x="365" y="246" font-size="16" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hệ thống ghi nhận có hiệu lực</text><line x1="865.0" y1="284" x2="865.0" y2="352" stroke="#16766B" stroke-width="2" /><text x="865" y="246" font-size="16" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="865" y="246" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hệ thống ghi nhận thu</tspan><tspan x="865" y="270" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">hồi</tspan></text><path d="M665 192 V414" fill="none" stroke="#A05720" stroke-width="1.4" stroke-dasharray="4 4" /><text x="665" y="454" font-size="17" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Phát lại quyết định ngày 10/6 (tháng/ngày)</text><text x="80" y="498" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Thời gian hiệu lực thực đã kết thúc nhưng đến 10/8 hệ thống mới biết việc thu hồi.</text><line x1="26" y1="523" x2="934" y2="523" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="546" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="546" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Khi phát lại phán đoán lịch sử, cố định cả “thời điểm được hỏi” và “tài liệu đã biết lúc đó”. Không được lén đưa thông tin biết sau vào đầu vào</tspan><tspan x="26" y="567" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">quá khứ.</tspan></text></svg>
