<svg xmlns="http://www.w3.org/2000/svg" aria-label="“Tôi chắc 80%” có đáng tin hay không cần được hiệu chuẩn bằng một tập kết quả thực tế" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 313"><title>“Tôi chắc 80%” có đáng tin hay không cần được hiệu chuẩn bằng một tập kết quả thực tế</title><rect fill="#fff" height="313" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="70">Độ chính xác tự đánh giá</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="90" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="713.6" x="24" y="90" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="119">80%</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="190">Độ chính xác được kiểm chứng thực tế</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="210" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="535.1999999999999" x="24" y="210" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="239">60%</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="285">Cùng tập 100 câu trả lời: tuyên bố chắc khoảng 80%, thực tế 60 câu đúng. Chỉ là mẫu giảng dạy, không phải đo thực tế mô hình thương mại.</text></svg>
