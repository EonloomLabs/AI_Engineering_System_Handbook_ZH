<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 597" role="img" aria-label="Tham số và gradient là hai trạng thái: chỉ step mới thay đổi tham số"><title>Tham số và gradient là hai trạng thái: chỉ step mới thay đổi tham số</title><rect width="960" height="597" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Trong một lần cập nhật, khi nào θ thực sự thay đổi?</text><text x="28" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hành động</text><text x="265" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tham số θ</text><text x="488" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Gradient .grad</text><text x="720" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Bước này tạo ra hoặc sử dụng</text><rect x="24" y="112" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">zero_grad</text><text x="272" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Xóa/đặt về không</text><text x="727" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Xóa gradient cũ</text><rect x="24" y="182" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">forward + loss</text><text x="272" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Chưa tính được</text><text x="727" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">logits, loss, kích hoạt</text><rect x="24" y="252" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">backward</text><text x="272" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀</text><text x="495" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">∂L / ∂θ₀</text><text x="727" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="286" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hợp từng gradient theo</tspan><tspan x="727" y="310" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">hình</tspan></text><rect x="24" y="346" width="902" height="83" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">optimizer.step</text><text x="272" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₁</text><text x="495" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="495" y="380" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Vẫn là gradient của lượt lan</tspan><tspan x="495" y="404" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">truyền xuôi cũ</tspan></text><text x="727" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="380" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cập nhật θ và trạng thái</tspan><tspan x="727" y="404" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Adam</tspan></text><rect x="24" y="440" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Lần forward tiếp theo</text><text x="272" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Dùng θ₁</text><text x="495" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Dọn dẹp/tích lũy riêng</text><text x="727" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="727" y="474" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Kích hoạt mới, hàm mất</tspan><tspan x="727" y="498" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">mát mới</tspan></text><line x1="26" y1="540" x2="934" y2="540" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="563" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cố ý tích lũy gradient vi lô khác với quên xóa gradient cũ. Sau backward mà chưa step thì không thể khẳng định trọng số đã cập nhật.</text></svg>
