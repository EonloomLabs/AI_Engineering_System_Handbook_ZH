<svg xmlns="http://www.w3.org/2000/svg" aria-label="Phân trang thay đổi nơi lưu vật lý, không thay đổi thứ tự logic của Token" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 392"><title>Phân trang thay đổi nơi lưu vật lý, không thay đổi thứ tự logic của Token</title><rect fill="#fff" height="392" width="940" x="0" y="0" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="245" x="20" y="36" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="30" y="62">Khối logic 0 vị trí 0, 1</text><line stroke="#285d96" stroke-width="2" x1="280" x2="570" y1="74" y2="74" /><polygon fill="#285d96" points="570,74 561,78 561,70" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="260" x="600" y="36" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="610" y="62"><tspan x="610" y="62" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Khối vật lý 6 được định vị</tspan><tspan x="610" y="86" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">bằng bảng ánh xạ</tspan></text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="245" x="20" y="151" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="30" y="177">Khối logic 1 vị trí 2, 3</text><line stroke="#285d96" stroke-width="2" x1="280" x2="570" y1="189" y2="189" /><polygon fill="#285d96" points="570,189 561,193 561,185" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="260" x="600" y="151" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="610" y="177"><tspan x="610" y="177" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Khối vật lý 1 được định vị</tspan><tspan x="610" y="201" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">bằng bảng ánh xạ</tspan></text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="245" x="20" y="266" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="30" y="292">Khối logic 2 vị trí 4, ô trống</text><line stroke="#285d96" stroke-width="2" x1="280" x2="570" y1="304" y2="304" /><polygon fill="#285d96" points="570,304 561,308 561,300" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="260" x="600" y="266" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="610" y="292"><tspan x="610" y="292" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Khối vật lý 9 được định vị</tspan><tspan x="610" y="316" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">bằng bảng ánh xạ</tspan></text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="364">Số khối vật lý không biểu thị thứ tự Token. Dữ liệu thực tế được khôi phục theo vị trí logic, không thể sắp theo số vật lý.</text></svg>
