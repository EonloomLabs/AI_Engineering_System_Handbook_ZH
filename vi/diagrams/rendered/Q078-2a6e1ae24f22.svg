<svg xmlns="http://www.w3.org/2000/svg" aria-label="Đường phụ thuộc dài nhất trên DAG quyết định thời điểm sớm nhất nhiệm vụ song song kết thúc" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 423"><title>Đường phụ thuộc dài nhất trên DAG quyết định thời điểm sớm nhất nhiệm vụ song song kết thúc</title><rect fill="#fff" height="423" width="940" x="0" y="0" /><line stroke="#285d96" stroke-width="2" x1="240" x2="340" y1="174" y2="69" /><polygon fill="#285d96" points="340,69 336.69,78.28 330.9,72.76" /><line stroke="#d6dfe6" stroke-width="2" x1="240" x2="340" y1="174" y2="274" /><polygon fill="#d6dfe6" points="340,274 330.81,270.46 336.46,264.81" /><line stroke="#285d96" stroke-width="2" x1="530" x2="680" y1="69" y2="174" /><polygon fill="#285d96" points="680,174 670.33,172.12 674.92,165.56" /><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="680" y1="274" y2="174" /><polygon fill="#d6dfe6" points="680,174 674.73,182.32 670.29,175.66" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="60" y="150" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="70" y="176">A Định vị · 2 phút</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="45" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="71">B Triển khai · 4 phút</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="250" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="276">C Kiểm thử · 3 phút</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="690" y="150" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="700" y="176">D Tích hợp · 1 phút</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="24" y="336">Đường găng: A → B → D = 2+4+1 = 7 phút</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="374"><tspan x="22" y="374" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tổng khối lượng công việc 10 phút. Rút ngắn nhánh không găng C chưa chắc làm thay đổi thời điểm bàn giao; chưa tính chi phí giao tiếp và</tspan><tspan x="22" y="395" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">tích hợp.</tspan></text></svg>
