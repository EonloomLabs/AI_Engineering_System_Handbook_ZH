<svg xmlns="http://www.w3.org/2000/svg" aria-label="Tách thời gian chờ, mục đầu và các mục sau trước, rồi mới hỏi vì sao chậm" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 420"><title>Tách thời gian chờ, mục đầu và các mục sau trước, rồi mới hỏi vì sao chậm</title><rect fill="#fff" height="420" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Trục ngang: thời gian (giây)</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="110"><tspan x="20" y="110" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Xếp</tspan><tspan x="20" y="131" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">hàng</tspan></text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="151" y2="151" /><rect fill="#eff4f8" height="64" rx="1" stroke="#285d96" width="235.71428571428575" x="80.0" y="85" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="197.8571" y="112">0—0.2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="218">Prefill</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="238" y2="238" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="353.5714285714286" x="315.7142857142858" y="193" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="492.5" y="220">0.2—0.5</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="305">4 lần Decode</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="325" y2="325" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="235.71428571428567" x="669.2857142857143" y="280" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="787.1429" y="307">0.5—0.7</text><line stroke="#182632" stroke-width="1" x1="80" x2="905" y1="360" y2="360" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="392">Thanh ngang được vẽ theo tỷ lệ thời lượng cho trước trong ví dụ này. Không được tính lặp phần chồng lấp song song vào thời gian thực.</text></svg>
