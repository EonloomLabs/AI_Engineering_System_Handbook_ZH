<svg xmlns="http://www.w3.org/2000/svg" aria-label="Bộ nhớ GPU khi huấn luyện không chỉ là phép tính “số tham số nhân hai byte”" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 429"><title>Bộ nhớ GPU khi huấn luyện không chỉ là phép tính “số tham số nhân hai byte”</title><rect fill="#fff" height="429" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="35">Trọng số độ chính xác thấp</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="52" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="111.5" x="24" y="52" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="74">2000 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="117">Gradient</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="134" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="111.5" x="24" y="134" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="156">2000 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="199">Trọng số chính FP32</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="216" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="216" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="238">4000 B</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="281">Adam m/v</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="298" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="446.0" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="320">8000 B</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="650" text-anchor="start" x="24" y="363">Tổng: 16000 B</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="401">Độ dài thanh ngang dùng cùng tổng lượng làm mẫu số; không trộn byte, số lượng tham số và khối lượng tính toán thành cùng một đơn vị.</text></svg>
