<svg xmlns="http://www.w3.org/2000/svg" aria-label="Ngân sách ngữ cảnh: trừ không gian bắt buộc phải giữ trước, rồi chọn tài liệu" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 593"><title>Ngân sách ngữ cảnh: trừ không gian bắt buộc phải giữ trước, rồi chọn tài liệu</title><rect fill="#fff" height="593" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="35">Quy tắc</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="52" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="178.4" x="24" y="52" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="74">20 đơn vị</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="117">Công cụ</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="134" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="89.2" x="24" y="134" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="156">10 đơn vị</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="199">Nhiệm vụ</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="216" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="89.2" x="24" y="216" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="238">10 đơn vị</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="281">Dự phòng đầu ra</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="298" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="178.4" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="320">20 đơn vị</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="363">Phần còn lại</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="380" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="44.6" x="24" y="380" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="402">5 đơn vị</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="445">Bằng chứng dùng được</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="462" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="312.2" x="24" y="462" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="484">35 đơn vị</text><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="650" text-anchor="start" x="24" y="527">Tổng: 100 đơn vị</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="565">Độ dài thanh ngang dùng cùng tổng lượng làm mẫu số; không trộn byte, số lượng tham số và khối lượng tính toán thành cùng một đơn vị.</text></svg>
