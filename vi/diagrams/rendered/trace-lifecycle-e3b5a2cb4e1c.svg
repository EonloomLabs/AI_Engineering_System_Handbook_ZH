<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 688" role="img" aria-label="Huấn luyện và suy luận dùng chung lan truyền xuôi, nhưng chỉ huấn luyện cập nhật tham số"><title>Huấn luyện và suy luận dùng chung lan truyền xuôi, nhưng chỉ huấn luyện cập nhật tham số</title><rect width="960" height="688" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cùng lõi tính toán, hai đường chạy khác nhau</text><text x="38" y="83" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Huấn luyện: mục tiêu đã biết</text><text x="535" y="83" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Suy luận: mục tiếp theo chưa biết</text><rect x="38" y="107" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="133" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Lô huấn luyện + nhãn</text><text x="52" y="158" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">input=5 mục đầu; targets=5 mục sau</text><rect x="535" y="107" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="133" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tiền tố đã có</text><text x="549" y="158" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">BOS + 我 + 爱</text><rect x="250" y="227" width="460" height="76" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="264" y="253" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cùng một forward(ids, cache, …)</text><text x="264" y="278" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Embedding → Attention → FFN → logits</text><line x1="220" y1="175" x2="345" y2="220" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="345,220 338.66,214 336.29,220.58" /><line x1="716" y1="175" x2="614" y2="220" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="614,220 622.73,219.97 619.91,213.57" /><rect x="38" y="358" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="384" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">loss → backward</text><text x="52" y="409" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tạo gradient; tham số vẫn chưa đổi</text><rect x="535" y="358" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="384" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Chọn Token tiếp theo</text><text x="549" y="409" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cố định tham số; không gọi backward hoặc step</text><line x1="350" y1="303" x2="220" y2="350" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="220,350 228.71,350.57 226.33,343.99" /><line x1="610" y1="303" x2="717" y2="350" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="717,350 711.08,343.58 708.27,349.99" /><rect x="38" y="493" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="519" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">AdamW.step</text><text x="52" y="544" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">θ₀ → θ₁; lần sau lan truyền xuôi lại</text><rect x="535" y="493" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="519" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Thêm Token hoặc kết thúc</text><text x="549" y="544" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Chỉ sang lượt tiếp theo khi chưa kết thúc</text><line x1="220" y1="426" x2="220" y2="485" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="220,485 223.5,477 216.5,477" /><line x1="717" y1="426" x2="717" y2="485" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="717,485 720.5,477 713.5,477" /><path d="M38 526 H18 V140 H30" fill="none" stroke="#285D96" stroke-width="1.7" /><path d="M900 526 H928 V140 H908" fill="none" stroke="#285D96" stroke-width="1.7" /><line x1="18" y1="140" x2="30" y2="140" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="30,140 22,136.5 22,143.5" /><line x1="928" y1="140" x2="908" y2="140" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="908,140 916,143.5 916,136.5" /><text x="260" y="606" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Lưu trọng số huấn luyện → nạp lại → đóng băng để dùng</text><line x1="26" y1="631" x2="934" y2="631" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="654" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Hai vòng trong hình lần lượt là học tham số và sinh từng Token; không vẽ một lần cập nhật huấn luyện thành một đầu ra suy luận.</text></svg>
