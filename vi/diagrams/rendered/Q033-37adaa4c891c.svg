<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 911" role="img" aria-label="Hai lượt gọi mô hình trong một nhiệm vụ, mỗi lượt biết thêm điều gì"><title>Hai lượt gọi mô hình trong một nhiệm vụ, mỗi lượt biết thêm điều gì</title><rect width="960" height="911" fill="white" /><text x="26" y="31" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Thông điệp luân chuyển giữa các bên tham gia; mỗi mũi tên ghi đối tượng cụ thể của cùng một lượt</text><text x="60" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="60" y="90" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Người</tspan><tspan x="60" y="117" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dùng</tspan></text><text x="340" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Khung thực thi</text><text x="620" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Mô hình</text><text x="900" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Công cụ</text><line x1="60.0" y1="136" x2="60.0" y2="816" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="340.0" y1="136" x2="340.0" y2="816" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="620.0" y1="136" x2="620.0" y2="816" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="900.0" y1="136" x2="900.0" y2="816" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><rect x="115" y="152" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="173" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">01 Đọc timeout trong config.txt</text><line x1="60.0" y1="192" x2="340.0" y2="192" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,192 332,188.5 332,195.5" /><text x="132" y="219" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đã biết nhiệm vụ, chưa biết nội dung</text><rect x="115" y="235" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="256" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">02 Câu hỏi + mô tả công cụ read_file</text><line x1="340.0" y1="275" x2="620.0" y2="275" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="620,275 612,271.5 612,278.5" /><text x="132" y="302" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Mô hình có mô tả năng lực khả dụng</text><rect x="115" y="318" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="339" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">03 call c1: read_file(config.txt)</text><line x1="620.0" y1="358" x2="340.0" y2="358" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,358 348,361.5 348,354.5" /><text x="132" y="385" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Mới có đề xuất, chưa thu thập bằng chứng</text><rect x="115" y="401" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="422" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">04 Thực thi c1</text><line x1="340.0" y1="441" x2="900.0" y2="441" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="900,441 892,437.5 892,444.5" /><text x="132" y="468" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đọc r7 trên đĩa</text><rect x="115" y="484" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="505" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">05 c1: timeout=30 @r7</text><line x1="900.0" y1="524" x2="340.0" y2="524" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,524 348,527.5 348,520.5" /><text x="132" y="551" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đã thu thập bằng chứng</text><rect x="115" y="567" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="588" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">06 Nhiệm vụ ban đầu + c1 + kết quả c1</text><line x1="340.0" y1="607" x2="620.0" y2="607" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="620,607 612,603.5 612,610.5" /><text x="132" y="634" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Lượt tiếp theo bổ sung sự kiện về tệp</text><rect x="115" y="650" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="671" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">07 Bản nháp trả lời: timeout là 30, căn cứ r7</text><line x1="620.0" y1="690" x2="340.0" y2="690" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,690 348,693.5 348,686.5" /><text x="132" y="717" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đầu ra mô hình lượt thứ hai đã kết thúc</text><rect x="115" y="733" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="754" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">08 Hiển thị kết quả chỉ đọc đã đối chiếu</text><line x1="340.0" y1="773" x2="60.0" y2="773" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="60,773 68,776.5 68,769.5" /><text x="132" y="800" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Nhiệm vụ hoàn thành; không xảy ra sửa đổi tệp</text><line x1="26" y1="833" x2="934" y2="833" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="856" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="856" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Thời gian đi từ trên xuống; khoảng cách giữa các hàng không biểu thị thời lượng. Nét liền là yêu cầu/hành động, nét đứt là phản hồi được nêu rõ</tspan><tspan x="26" y="877" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">trong hình. Nguồn là các thông điệp giảng dạy cố định của mục này, không suy đoán phần bên trong nguồn đóng.</tspan></text></svg>
