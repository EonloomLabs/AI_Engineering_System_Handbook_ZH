g SC&quot;, sans-serif">nhớ đệm</tspan></text><rect x="185" y="330" width="152" height="120.5" rx="0" fill="#EAF4EF" stroke="#D6DFE6" stroke-width="1" /><text x="261" y="370" font-size="20" fill="#16766B" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="261" y="370" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Có thể tái sử</tspan><tspan x="261" y="400" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">dụng</tspan></text><rect x="347" y="330" width="152" height="120.5" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="423" y="370" font-size="20" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tính lại</text><rect x="509" y="330" width="152" height="120.5" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="585" y="370" font-size="20" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tính lại</text><rect x="671" y="330" width="152" height="120.5" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="747" y="370" font-size="20" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tính lại</text><path d="M424 290 V479.5 H824" fill="none" stroke="#A05720" stroke-width="1.7" /><line x1="796" y1="479.5" x2="824" y2="479.5" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="824,479.5 816,476 816,483" /><text x="340" y="525.5" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="340" y="525.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Token phía sau dù không đổi nhưng tiền tố chúng đọc được đã thay</tspan><tspan x="340" y="552.5" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">đổi.</tspan></text><line x1="26" y1="577.5" x2="934" y2="577.5" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="600.5" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tái sử dụng hợp lệ còn đòi hỏi phiên bản mô hình, tham số, vị trí và cấu hình tính toán khớp. Không thể chỉ so mã Token hiện tại.</text></svg>
