<svg xmlns="http://www.w3.org/2000/svg" aria-label="Năng lực xử lý trung bình đủ không có nghĩa là yêu cầu giờ cao điểm không phải xếp hàng" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 413"><title>Năng lực xử lý trung bình đủ không có nghĩa là yêu cầu giờ cao điểm không phải xếp hàng</title><rect fill="#fff" height="413" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">Trục ngang: thời gian (giây)</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="110"><tspan x="20" y="110" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Dịch vụ</tspan><tspan x="20" y="131" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">R1</tspan></text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="151" y2="151" /><rect fill="#eff4f8" height="64" rx="1" stroke="#285d96" width="275.0" x="80.0" y="85" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="217.5" y="112">0—1</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="218">Dịch vụ R2</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="238" y2="238" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="275.0" x="355.0" y="193" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="492.5" y="220">1—2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="305">Dịch vụ R3</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="325" y2="325" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="275.0" x="630.0" y="280" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="767.5" y="307">2—3</text><line stroke="#182632" stroke-width="1" x1="80" x2="905" y1="353" y2="353" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="385">Thanh ngang được vẽ theo tỷ lệ thời lượng cho trước trong ví dụ này. Không được tính lặp phần chồng lấp song song vào thời gian thực.</text></svg>
