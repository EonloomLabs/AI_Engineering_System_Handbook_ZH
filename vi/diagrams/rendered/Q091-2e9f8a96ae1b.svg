<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 960 578" role="img" aria-label="Đánh giá ghép cặp: trong 20 nhiệm vụ, phải tính cả sửa đúng lẫn sửa sai"><title>Đánh giá ghép cặp: trong 20 nhiệm vụ, phải tính cả sửa đúng lẫn sửa sai</title><rect width="960" height="578" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Đối chiếu từng câu trên cùng nhóm nhiệm vụ, không so hai mẫu không liên quan</text><text x="317.5" y="121" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Mới thành công</text><text x="542.5" y="121" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Mới thất bại</text><text x="191" y="196" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cũ thành công</text><rect x="205" y="133" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="196" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">12</text><rect x="430" y="133" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="196" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1</text><text x="191" y="296" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cũ thất bại</text><rect x="205" y="233" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="296" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3</text><rect x="430" y="233" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="296" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">4</text><text x="238" y="424" font-size="22" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">3 lỗi mới được sửa</text><text x="548" y="424" font-size="22" fill="#A13A37" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">1 hồi quy</text><text x="238" y="475" font-size="21" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cải thiện ròng = (3−1) / 20 = 10 điểm phần trăm</text><line x1="26" y1="500" x2="934" y2="500" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="523" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;PingFang SC&quot;, sans-serif"><tspan x="26" y="523" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Cũ thành công 13/20, mới thành công 15/20. Đường chéo không thay đổi chênh lệch ròng; kết quả 20 câu này không thể chỉ dựa vào tỷ lệ phần</tspan><tspan x="26" y="544" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">trăm mà chứng minh lợi ích ổn định trên tổng thể.</tspan></text></svg>
