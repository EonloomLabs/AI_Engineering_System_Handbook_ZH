<svg xmlns="http://www.w3.org/2000/svg" aria-label="Token vừa được chọn chưa đi vào lượt tính toán của chính nó" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 681"><title>Token vừa được chọn chưa đi vào lượt tính toán của chính nó</title><rect fill="#fff" height="681" width="940" x="0" y="0" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="43">Đầu vào/đã xử lý</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="65" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="91">[我,爱]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="87" y2="87" /><polygon fill="#285d96" points="530,87 521,91 521,83" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="65" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="91">cache_len=2</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="141">Chọn 学习: mục vừa chọn chưa thực hiện lượt lan truyền xuôi của chính nó.</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="201">Xử lý ở lượt tiếp theo</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="223" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="249">[学习]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="245" y2="245" /><polygon fill="#285d96" points="530,245 521,249 521,241" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="223" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="249">cache_len=3</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="299">Chọn ！: mục vừa chọn chưa thực hiện lượt lan truyền xuôi của chính nó.</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="359">Xử lý ở lượt sau nữa</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="381" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="407">[！]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="403" y2="403" /><polygon fill="#285d96" points="530,403 521,407 521,399" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="381" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="407">cache_len=4</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="457">Chọn EOS: mục vừa chọn chưa thực hiện lượt lan truyền xuôi của chính nó.</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="517">Dừng</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="539" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="565">Không xử lý EOS nữa</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="561" y2="561" /><polygon fill="#285d96" points="530,561 521,565 521,557" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="539" /><text fill="#285d96" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="565">cache_len=4</text><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="615">Khung thực thi thấy dấu kết thúc và chấm dứt các phép tính mô hình tiếp theo.</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="653">Minh họa giả định giải mã nhân quả từng Token; không nhầm số mã đầu ra với số lượng bộ nhớ đệm đã xử lý.</text></svg>
