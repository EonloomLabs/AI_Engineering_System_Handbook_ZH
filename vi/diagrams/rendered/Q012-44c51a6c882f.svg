<svg xmlns="http://www.w3.org/2000/svg" aria-label="Lan truyền ngược không phải phát ngược mũi tên xuôi, mà là phân bổ “ảnh hưởng” theo phụ thuộc" class="mx-svg" role="img" style=";font-family:Arial,&quot;PingFang SC&quot;,sans-serif" viewBox="0 0 940 732"><title>Lan truyền ngược không phải phát ngược mũi tên xuôi, mà là phân bổ “ảnh hưởng” theo phụ thuộc</title><rect fill="#fff" height="732" width="940" x="0" y="0" /><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="46">dO thượng nguồn</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="68" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="101">[1,1]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="178">Đối với V0 / V1</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="200" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="233">[0.25,0.25] / [0.75,0.75]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="310">Đối với P</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="332" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="365">[2,4]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="442">Đường cơ sở dP có trọng số P</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="464" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="497">0.25×2+0.75×4=3.5</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="574">Đối với điểm số S</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="596" /><text fill="#182632" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="629">[-0.375,+0.375]</text><text fill="#536473" font-family="Arial, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="683"><tspan x="22" y="683" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">Tổng dS bằng 0, phản ánh rằng dịch đều hai điểm số không làm thay đổi softmax. Hình này tính ảnh hưởng của hàm mất mát đối với các đại</tspan><tspan x="22" y="704" font-family="Arial, &quot;PingFang SC&quot;, sans-serif">lượng trung gian.</tspan></text></svg>
