1.6" /><polygon fill="#285D96" points="491,192 483,188.5 483,195.5" /><text x="455" y="269" font-size="14" fill="#285D96" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新しいK/Vだけを追加</text><rect x="142" y="330" width="680" height="101" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="156" y="356" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">このターンのlogits → 「！」を選択</text><text x="156" y="381" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="156" y="381" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">「！」は候補から選んだIDにすぎません。次のターンで入力して初めて、キャッシュの長さが5になり</tspan><tspan x="156" y="402" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ます。</tspan></text><line x1="26" y1="448" x2="934" y2="448" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="471" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="471" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">図は一層の論理的な模式図です。実際の多層モデルでは、各層で異なるK/Vを保持します。出力済みトークン数を、計算してキャッシュに入れ</tspan><tspan x="26" y="492" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">た位置の数と見なしてはいけません。</tspan></text></svg>
