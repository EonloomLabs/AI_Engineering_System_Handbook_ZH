<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 718" role="img" aria-label="MCPはまず能力をネゴシエートし、次にツールを発見し、最後に呼び出しを試みる"><title>MCPはまず能力をネゴシエートし、次にツールを発見し、最後に呼び出しを試みる</title><rect width="960" height="718" fill="white" /><text x="26" y="31" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">メッセージは参加者間を移動し、各矢印は同じターンの具体的なオブジェクトを示します</text><text x="60" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Client</text><text x="340" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Server</text><text x="620" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Host</text><text x="900" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">モデル</text><line x1="60.0" y1="109" x2="60.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="340.0" y1="109" x2="340.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="620.0" y1="109" x2="620.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="900.0" y1="109" x2="900.0" y2="623" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><rect x="115" y="125" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="146" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">01  initialize(id=1, version=2025-06-18)</text><line x1="60.0" y1="165" x2="340.0" y2="165" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,165 332,161.5 332,168.5" /><text x="132" y="192" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">リクエストのネゴシエーション</text><rect x="115" y="208" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="229" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">02  result(id=1, capabilities.tools={})</text><line x1="340.0" y1="248" x2="60.0" y2="248" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="60,248 68,251.5 68,244.5" /><text x="132" y="275" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">サービスがtools対応を宣言</text><rect x="115" y="291" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="312" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">03  notifications/initialized</text><line x1="60.0" y1="331" x2="340.0" y2="331" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,331 332,327.5 332,334.5" /><text x="132" y="358" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">通常の実行段階に入る</text><rect x="115" y="374" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="395" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">04  tools/list(id=2)</text><line x1="60.0" y1="414" x2="340.0" y2="414" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,414 332,410.5 332,417.5" /><text x="132" y="441" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ツール名とinputSchemaを取得</text><rect x="115" y="457" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="478" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">05  公開するツールの記述を選択</text><line x1="620.0" y1="497" x2="900.0" y2="497" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="900,497 892,493.5 892,500.5" /><text x="132" y="524" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ここで初めてモデルが選択できる</text><rect x="115" y="540" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="561" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">06  tools/call(id=3, name=...)</text><line x1="60.0" y1="580" x2="340.0" y2="580" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,580 332,576.5 332,583.5" /><text x="132" y="607" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">指定された認可済みツールを実行</text><line x1="26" y1="640" x2="934" y2="640" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="663" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="663" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">時間は上から下へ進み、行間は所要時間を示しません。実線はリクエスト／操作、破線は図で明示した戻りを示します。出典はこの節の固定し</tspan><tspan x="26" y="684" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">た教育用メッセージであり、非公開の内部動作は推測しません。</tspan></text></svg>
