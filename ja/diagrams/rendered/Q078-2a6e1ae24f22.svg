<svg xmlns="http://www.w3.org/2000/svg" aria-label="DAGの最長依存経路が、並列タスクの最も早い終了時刻を決める" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 423"><title>DAGの最長依存経路が、並列タスクの最も早い終了時刻を決める</title><rect fill="#fff" height="423" width="940" x="0" y="0" /><line stroke="#285d96" stroke-width="2" x1="240" x2="340" y1="174" y2="69" /><polygon fill="#285d96" points="340,69 336.69,78.28 330.9,72.76" /><line stroke="#d6dfe6" stroke-width="2" x1="240" x2="340" y1="174" y2="274" /><polygon fill="#d6dfe6" points="340,274 330.81,270.46 336.46,264.81" /><line stroke="#285d96" stroke-width="2" x1="530" x2="680" y1="69" y2="174" /><polygon fill="#285d96" points="680,174 670.33,172.12 674.92,165.56" /><line stroke="#d6dfe6" stroke-width="2" x1="530" x2="680" y1="274" y2="174" /><polygon fill="#d6dfe6" points="680,174 674.73,182.32 670.29,175.66" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="60" y="150" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="70" y="176">A 位置特定 · 2分</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="45" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="71">B 実装 · 4分</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="350" y="250" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="360" y="276">C テスト · 3分</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="180" x="690" y="150" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="700" y="176">D 統合 · 1分</text><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="24" y="336">クリティカルパス：A → B → D = 2+4+1 = 7分</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="374"><tspan x="22" y="374" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">総作業量は10分です。クリティカルパスにない分岐Cを短縮しても、納品の完了時刻が変わるとは限りません。通信と統合のオーバーヘッド</tspan><tspan x="22" y="395" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">は未計上です。</tspan></text></svg>
