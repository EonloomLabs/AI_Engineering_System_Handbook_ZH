<svg xmlns="http://www.w3.org/2000/svg" aria-label="BM25は、同じ分母の中で語の頻度と文書長を比較する" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 330"><title>BM25は、同じ分母の中で語の頻度と文書長を比較する</title><rect fill="#fff" height="330" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">同じIDFでの単語頻度—長さの因子</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="70">A：長さ100 / 単語の出現頻度2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="817.6666666666666" x="24" y="91" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="34" y="119">1.375000</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="186">B：長さ1000 / 単語の出現頻度4</text><rect fill="#eff4f8" height="42" rx="4" stroke="#285d96" width="393.4636591478697" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="34" y="235">0.661654</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="281"><tspan x="22" y="281" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">二本とも0—1.5の目盛りを使います。Bは単語の出現頻度が高くても、文書が非常に長いためスコアは低くなります。BM25を網羅的に実測</tspan><tspan x="22" y="302" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">したものではありません。</tspan></text></svg>
