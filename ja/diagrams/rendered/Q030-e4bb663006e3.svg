<svg xmlns="http://www.w3.org/2000/svg" aria-label="待機・最初の項目・以降の項目を分けてから、遅い理由を考える" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 420"><title>待機・最初の項目・以降の項目を分けてから、遅い理由を考える</title><rect fill="#fff" height="420" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">横軸：時間（秒）</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="110"><tspan x="20" y="110" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">キュー</tspan><tspan x="20" y="131" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">待ち</tspan></text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="151" y2="151" /><rect fill="#eff4f8" height="64" rx="1" stroke="#285d96" width="235.71428571428575" x="80.0" y="85" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="197.8571" y="112">0—0.2</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="218">Prefill</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="238" y2="238" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="353.5714285714286" x="315.7142857142858" y="193" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="492.5" y="220">0.2—0.5</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="305">4回のDecode</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="325" y2="325" /><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="235.71428571428567" x="669.2857142857143" y="280" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="787.1429" y="307">0.5—0.7</text><line stroke="#182632" stroke-width="1" x1="80" x2="905" y1="360" y2="360" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="392">バーは、この例で指定した所要時間に比例して描いています。並列で重なる区間を実経過時間に重複計上してはいけません。</text></svg>
