<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 601" role="img" aria-label="有効時間と記録時間：システムが知った時刻は、事実の発効時刻とは異なる"><title>有効時間と記録時間：システムが知った時刻は、事実の発効時刻とは異なる</title><rect width="960" height="601" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">同じ事実に二つの時間軸</text><text x="26" y="157" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">有効時間</text><line x1="165" y1="150" x2="915" y2="150" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="915,150 907,146.5 907,153.5" /><line x1="165.0" y1="144" x2="165.0" y2="156" stroke="#182632" stroke-width="1" /><text x="165" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/1</text><line x1="365.0" y1="144" x2="365.0" y2="156" stroke="#182632" stroke-width="1" /><text x="365" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/3</text><line x1="565.0" y1="144" x2="565.0" y2="156" stroke="#182632" stroke-width="1" /><text x="565" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/5</text><line x1="665.0" y1="144" x2="665.0" y2="156" stroke="#182632" stroke-width="1" /><text x="665" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/6</text><line x1="865.0" y1="144" x2="865.0" y2="156" stroke="#182632" stroke-width="1" /><text x="865" y="180" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/8</text><text x="26" y="361" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">記録時間</text><line x1="165" y1="354" x2="915" y2="354" stroke="#D6DFE6" stroke-width="1.6" /><polygon fill="#D6DFE6" points="915,354 907,350.5 907,357.5" /><line x1="165.0" y1="348" x2="165.0" y2="360" stroke="#182632" stroke-width="1" /><text x="165" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/1</text><line x1="365.0" y1="348" x2="365.0" y2="360" stroke="#182632" stroke-width="1" /><text x="365" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/3</text><line x1="565.0" y1="348" x2="565.0" y2="360" stroke="#182632" stroke-width="1" /><text x="565" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/5</text><line x1="665.0" y1="348" x2="665.0" y2="360" stroke="#182632" stroke-width="1" /><text x="665" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/6</text><line x1="865.0" y1="348" x2="865.0" y2="360" stroke="#182632" stroke-width="1" /><text x="865" y="384" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/8</text><rect x="165.0" y="106" width="400.0" height="32" rx="0" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="365" y="96" font-size="17" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">規則は1日から5日まで有効</text><line x1="365.0" y1="284" x2="365.0" y2="352" stroke="#16766B" stroke-width="2" /><text x="365" y="246" font-size="16" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">システムが発効を記録</text><line x1="865.0" y1="284" x2="865.0" y2="352" stroke="#16766B" stroke-width="2" /><text x="865" y="246" font-size="16" fill="#16766B" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="865" y="246" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">システムが取り消しを</tspan><tspan x="865" y="270" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">記録</tspan></text><path d="M665 192 V414" fill="none" stroke="#A05720" stroke-width="1.4" stroke-dasharray="4 4" /><text x="665" y="454" font-size="17" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">10/6の判断を再生</text><text x="80" y="498" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">実際の有効期間はすでに終了していますが、システムが取り消しを知るのは10/8です。</text><line x1="26" y1="523" x2="934" y2="523" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="546" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="546" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">過去の判断を再現するときは、「問われた時点」と「当時すでに得ていた資料」を併せて固定します。後から知った情報を、過去の入力にひそ</tspan><tspan x="26" y="567" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">かに入れてはいけません。</tspan></text></svg>
