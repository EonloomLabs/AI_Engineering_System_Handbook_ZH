<svg xmlns="http://www.w3.org/2000/svg" aria-label="選んだばかりのトークンは、まだ自分自身の計算ターンに入っていない" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 681"><title>選んだばかりのトークンは、まだ自分自身の計算ターンに入っていない</title><rect fill="#fff" height="681" width="940" x="0" y="0" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="43">入力/処理済み</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="65" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="91">[我,爱]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="87" y2="87" /><polygon fill="#285d96" points="530,87 521,91 521,83" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="65" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="91">cache_len=2</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="141">学习を選択：新しく選ばれた項目は、まだ自身の順伝播を行っていません。</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="201">次のターンで処理</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="223" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="249">[学习]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="245" y2="245" /><polygon fill="#285d96" points="530,245 521,249 521,241" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="223" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="249">cache_len=3</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="299">！を選択：新しく選ばれた項目は、まだ自身の順伝播を行っていません。</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="359">さらに次のターンで処理</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="381" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="407">[！]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="403" y2="403" /><polygon fill="#285d96" points="530,403 521,407 521,399" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="381" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="407">cache_len=4</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="457">EOSを選択：新しく選ばれた項目は、まだ自身の順伝播を行っていません。</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="517">停止</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="539" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="32" y="565">EOSはその後処理しない</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="561" y2="561" /><polygon fill="#285d96" points="530,561 521,565 521,557" /><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="539" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="560" y="565">cache_len=4</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="615">ハーネスが終了マーカーを認識し、その後のモデル計算を停止する。</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="653">図はトークンごとの因果的デコードを前提とし、出力IDの数をキャッシュの処理済み位置数と混同していません。</text></svg>
