<svg xmlns="http://www.w3.org/2000/svg" aria-label="RoPEが保つのは相対角度であり、各ターンで最初に戻る位置ではない" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 368"><title>RoPEが保つのは相対角度であり、各ターンで最初に戻る位置ではない</title><rect fill="#fff" height="368" width="940" x="0" y="0" /><line stroke="#d6dfe6" stroke-width="1" x1="65" x2="255" y1="180" y2="180" /><line stroke="#d6dfe6" stroke-width="1" x1="155" x2="155" y1="90" y2="270" /><line stroke="#285d96" stroke-width="2" x1="155" x2="227" y1="180" y2="180" /><polygon fill="#285d96" points="227,180 218,184 218,176" /><line stroke="#8c4a26" stroke-width="2" x1="159" x2="159" y1="184" y2="124" /><polygon fill="#8c4a26" points="159,124 163,133 155,133" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="155" y="302">位置の差1：内積0</text><line stroke="#d6dfe6" stroke-width="1" x1="375" x2="565" y1="180" y2="180" /><line stroke="#d6dfe6" stroke-width="1" x1="465" x2="465" y1="90" y2="270" /><line stroke="#285d96" stroke-width="2" x1="465" x2="465" y1="180" y2="108" /><polygon fill="#285d96" points="465,108 469,117 461,117" /><line stroke="#8c4a26" stroke-width="2" x1="469" x2="409" y1="184" y2="184" /><polygon fill="#8c4a26" points="409,184 418,180 418,188" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="465" y="302">両方の位置に1を加える：内積は依然0</text><line stroke="#d6dfe6" stroke-width="1" x1="685" x2="875" y1="180" y2="180" /><line stroke="#d6dfe6" stroke-width="1" x1="775" x2="775" y1="90" y2="270" /><line stroke="#285d96" stroke-width="2" x1="775" x2="847" y1="180" y2="180" /><polygon fill="#285d96" points="847,180 838,184 838,176" /><line stroke="#8c4a26" stroke-width="2" x1="779" x2="839" y1="184" y2="184" /><polygon fill="#8c4a26" points="839,184 830,188 830,180" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="775" y="302">新しいqを誤ってゼロにする：内積1</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="340">青=Key、茶=Query。二次元ベクトルの長さは変わらず、相対角度によって一致度が変わります。周波数90°は教育用の設定です。</text></svg>
