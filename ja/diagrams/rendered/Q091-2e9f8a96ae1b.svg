<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 578" role="img" aria-label="対応のある評価：20タスクで、改善と悪化をどちらも数える必要がある"><title>対応のある評価：20タスクで、改善と悪化をどちらも数える必要がある</title><rect width="960" height="578" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">同じタスク群を一問ずつ対応させ、無関係な二つのサンプルは比較しない</text><text x="317.5" y="121" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新版の成功</text><text x="542.5" y="121" font-size="13" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新版の失敗</text><text x="191" y="196" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">旧版の成功</text><rect x="205" y="133" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="196" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">12</text><rect x="430" y="133" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="196" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">1</text><text x="191" y="296" font-size="14" fill="#536473" font-weight="400" text-anchor="end" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">旧版の失敗</text><rect x="205" y="233" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65" /><text x="317.5" y="296" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">3</text><rect x="430" y="233" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65" /><text x="542.5" y="296" font-size="15" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">4</text><text x="238" y="424" font-size="22" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">3 件の新たな修正</text><text x="548" y="424" font-size="22" fill="#A13A37" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">1 件の回帰</text><text x="238" y="475" font-size="21" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">正味の改善 = (3−1) / 20 = 10 パーセントポイント</text><line x1="26" y1="500" x2="934" y2="500" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="523" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="523" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">旧版の成功は13/20、新版の成功は15/20です。対角線上の結果は正味の差を変えません。この20問の結果だけでは、割合のみを根拠に母集団全</tspan><tspan x="26" y="544" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">体での安定した効果を証明できません。</tspan></text></svg>
