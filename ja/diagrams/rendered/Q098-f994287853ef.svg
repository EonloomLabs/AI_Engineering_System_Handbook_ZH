<svg xmlns="http://www.w3.org/2000/svg" aria-label="成功タスクあたりのコストの分子には、失敗と手戻りを含める必要があります" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 310"><title>成功タスクあたりのコストの分子には、失敗と手戻りを含める必要があります</title><rect fill="#fff" height="310" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="22" y="30">分母を統一：成功タスク一件を完了する</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="72">A：成功タスクあたり</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="743.3333333333334" x="24" y="92" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="120">1.25</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="24" y="187">B：成功タスクあたり</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="832.5333333333333" x="24" y="207" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="36" y="235">1.4</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="282">Aの総費用100/成功80=1.25；Bの総費用70/成功50=1.40。失敗した実行の費用も分子から除いていません。</text></svg>
