<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 773" role="img" aria-label="タイムアウトではunknownになり、復旧時はまず副作用を照合する"><title>タイムアウトではunknownになり、復旧時はまず副作用を照合する</title><rect width="960" height="773" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">状態のノードと遷移条件を分ける。結果不明は失敗ではない</text><rect x="40" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">recorded</text><text x="54" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">操作IDを記録済み</text><rect x="350" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="364" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">executing</text><text x="364" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">操作は送出済み</text><rect x="675" y="92" width="225" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="689" y="118" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">succeeded</text><text x="689" y="143" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">結果があり、永続化済み</text><rect x="350" y="310" width="190" height="95" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="364" y="336" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">unknown</text><text x="364" y="361" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="364" y="361" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">確定した受領確認は未受</tspan><tspan x="364" y="382" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">信</tspan></text><rect x="40" y="533" width="240" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="54" y="559" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">confirmed_not_done</text><text x="54" y="584" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">検証で未発生と確認</text><rect x="650" y="533" width="250" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="664" y="559" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">confirmed_done</text><text x="664" y="584" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">検証で発生済みと確認</text><line x1="230" y1="129" x2="342" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="342,129 334,125.5 334,132.5" /><text x="280" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ディスパッチ</text><line x1="540" y1="129" x2="667" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="667,129 659,125.5 659,132.5" /><text x="602" y="111" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">結果を確認</text><line x1="445" y1="166" x2="445" y2="301" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="445,301 448.5,293 441.5,293" /><text x="458" y="240" font-size="15" fill="#A05720" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">タイムアウト / 接続の切断</text><line x1="391" y1="405" x2="216" y2="524" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="216,524 224.58,522.4 220.65,516.61" /><text x="165" y="460" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">下流の状態を照会</text><line x1="499" y1="405" x2="755" y2="524" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="755,524 749.22,517.45 746.27,523.8" /><text x="740" y="460" font-size="14" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">操作IDでコミットの証拠を検証</text><path d="M40 571 H16 V129 H32" fill="none" stroke="#285D96" stroke-width="1.6" /><line x1="16" y1="129" x2="32" y2="129" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="32,129 24,125.5 24,132.5" /><text x="38" y="646" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">未発生と確認：ポリシーに従って再試行</text><path d="M900 571 H930 V129 H908" fill="none" stroke="#16766B" stroke-width="1.6" /><line x1="930" y1="129" x2="908" y2="129" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="908,129 916,132.5 916,125.5" /><text x="650" y="646" font-size="16" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="650" y="646" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">発生済みと確認：完了を追記し、再実行</tspan><tspan x="650" y="670" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">しない</tspan></text><line x1="26" y1="695" x2="934" y2="695" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="718" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="718" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">これは教育用ハーネスの復旧設計であり、特定のAPIによる保証ではありません。確認できない場合はunknownを保って上位へ対応を引き継</tspan><tspan x="26" y="739" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ぎ、受領確認がないことを、副作用がないことと見なしてはいけません。</tspan></text></svg>
