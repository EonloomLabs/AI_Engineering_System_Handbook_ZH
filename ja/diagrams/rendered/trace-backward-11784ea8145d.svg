<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 1051" role="img" aria-label="逆伝播は実際の依存関係に従う：二つの残差点で、どちらも勾配を合流させる"><title>逆伝播は実際の依存関係に従う：二つの残差点で、どちらも勾配を合流させる</title><rect width="960" height="1051" fill="white" /><text x="26" y="32" font-size="19" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">教育用モデルmanual_backwardの計算対象と項目ごとに対応</text><rect x="110" y="94" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="120" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dz = (p − onehot) / N</text><text x="124" y="145" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">出力確率と正解ラベルから勾配を生成</text><rect x="110" y="206" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="232" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dU、dfinal → 最後のRMSNormの逆伝播</text><text x="124" y="257" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dhidden・dgfを得る</text><rect x="110" y="318" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="344" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">FFNの逆伝播：W2 → ReLU → W1</text><text x="124" y="369" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dW2・dW1・dn2を得る</text><rect x="110" y="430" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="456" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">二つ目のRMSNormを逆伝播し、加算</text><text x="124" y="481" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dresidual = dhidden + drnorm</text><rect x="110" y="542" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="568" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Woの逆伝播 → A @ Vの逆伝播</text><text x="124" y="593" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dWo・dA・dVを得る</text><rect x="110" y="654" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="680" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">softmaxの逆伝播 → Q/K/V射影の逆伝播</text><text x="124" y="705" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dWq・dWk・dWv・dn1を得る</text><rect x="110" y="766" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="792" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">最初のRMSNormを逆伝播し、加算</text><text x="124" y="817" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dx = dresidual + dxnorm</text><rect x="110" y="878" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="124" y="904" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">トークンと位置IDごとに累積</text><text x="124" y="929" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">同じEmbedding行への寄与を足す</text><line x1="395" y1="172" x2="395" y2="199" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,199 398.5,191 391.5,191" /><line x1="395" y1="284" x2="395" y2="311" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,311 398.5,303 391.5,303" /><line x1="395" y1="396" x2="395" y2="423" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,423 398.5,415 391.5,415" /><line x1="395" y1="508" x2="395" y2="535" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,535 398.5,527 391.5,527" /><line x1="395" y1="620" x2="395" y2="647" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,647 398.5,639 391.5,639" /><line x1="395" y1="732" x2="395" y2="759" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,759 398.5,751 391.5,751" /><line x1="395" y1="844" x2="395" y2="871" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="395,871 398.5,863 391.5,863" /><path d="M680 245 H724 V469 H688" fill="none" stroke="#16766B" stroke-width="2" /><line x1="710" y1="469" x2="688" y2="469" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="688,469 696,472.5 696,465.5" /><text x="740" y="355" font-size="15" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dhidden</text><path d="M110 469 H52 V805 H102" fill="none" stroke="#16766B" stroke-width="2" /><line x1="73" y1="805" x2="102" y2="805" stroke="#16766B" stroke-width="1.6" /><polygon fill="#16766B" points="102,805 94,801.5 94,808.5" /><text x="15" y="640" font-size="15" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dR</text><line x1="26" y1="973" x2="934" y2="973" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="996" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="996" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">図のバイパスは、加算が必要な勾配の寄与であり、余計な飾りではありません。逆伝播で勾配を計算した後も、パラメーターの更新にはオプ</tspan><tspan x="26" y="1017" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ティマイザーのstepが必要です。</tspan></text></svg>
