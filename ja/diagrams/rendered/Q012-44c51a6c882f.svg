<svg xmlns="http://www.w3.org/2000/svg" aria-label="逆伝播は順伝播の矢印の逆再生ではなく、依存関係に沿って「影響」を配分する処理" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 732"><title>逆伝播は順伝播の矢印の逆再生ではなく、依存関係に沿って「影響」を配分する処理</title><rect fill="#fff" height="732" width="940" x="0" y="0" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="46">上流 dO</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="68" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="101">[1,1]</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="178">V0 / V1に対して</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="200" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="233">[0.25,0.25] / [0.75,0.75]</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="310">Pに対して</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="332" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="365">[2,4]</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="442">Pで重み付けしたdPの基準値</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="464" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="497">0.25×2+0.75×4=3.5</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="574">スコアSに対して</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="596" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="38" y="629">[-0.375,+0.375]</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="683"><tspan x="22" y="683" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">dSの和が0なのは、二つのスコアを一様に平行移動してもsoftmaxが変わらないことを表します。この図で計算するのは、中間量に対する損</tspan><tspan x="22" y="704" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">失の感度です。</tspan></text></svg>
