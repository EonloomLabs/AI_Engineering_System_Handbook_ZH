<svg xmlns="http://www.w3.org/2000/svg" aria-label="連続バッチ処理は空いたスロットを新しいリクエストに渡すが、各スケジューリングステップの時間は同じとは限らない" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 418"><title>連続バッチ処理は空いたスロットを新しいリクエストに渡すが、各スケジューリングステップの時間は同じとは限らない</title><rect fill="#fff" height="418" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="19" font-weight="650" text-anchor="start" x="20" y="30">二つのデコードスロットの各ステップでの割り当て</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="206.6667" y="113">ステップ1</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="490" y="113">ステップ2</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="773.3333" y="113">ステップ3</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="55" y="165.25"><tspan x="55" y="165.25" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ス</tspan><tspan x="55" y="186.25" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ロッ</tspan><tspan x="55" y="207.25" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ト0</tspan></text><rect fill="#fff" height="107" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="65.0" y="123" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="206.6667" y="165.25">Aが終了</text><rect fill="#eff4f8" height="107" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="348.3333333333333" y="123" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="490" y="165.25">C 1/2</text><rect fill="#eff4f8" height="107" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="631.6666666666666" y="123" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="middle" x="773.3333" y="165.25">Cが終了</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="55" y="272.25"><tspan x="55" y="272.25" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ス</tspan><tspan x="55" y="293.25" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ロッ</tspan><tspan x="55" y="314.25" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ト1</tspan></text><rect fill="#fff" height="107" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="65.0" y="230" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="206.6667" y="272.25">B 1/3</text><rect fill="#fff" height="107" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="348.3333333333333" y="230" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="490" y="272.25">B 2/3</text><rect fill="#fff" height="107" rx="0" stroke="#d6dfe6" width="283.3333333333333" x="631.6666666666666" y="230" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="773.3333" y="272.25">Bが終了</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="369"><tspan x="22" y="369" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Cは準備済みですが、prefillは未計上です。等幅の列はスケジューリングのステップを表すだけで、各ステップの実際の所要時間が同じという</tspan><tspan x="22" y="390" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">意味ではありません。</tspan></text></svg>
