, &quot;Yu Gothic&quot;, Meiryo, sans-serif">学习</text><text x="32" y="364" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">キャッシュの判定</text><rect x="185" y="330" width="152" height="65" rx="0" fill="#EAF4EF" stroke="#D6DFE6" stroke-width="1" /><text x="261" y="370" font-size="20" fill="#16766B" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">再利用可能</text><rect x="347" y="330" width="152" height="65" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="423" y="370" font-size="20" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">再計算</text><rect x="509" y="330" width="152" height="65" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="585" y="370" font-size="20" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">再計算</text><rect x="671" y="330" width="152" height="65" rx="0" fill="#FBF0E7" stroke="#D6DFE6" stroke-width="1" /><text x="747" y="370" font-size="20" fill="#A05720" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">再計算</text><path d="M424 290 V424 H824" fill="none" stroke="#A05720" stroke-width="1.7" /><line x1="796" y1="424" x2="824" y2="424" stroke="#A05720" stroke-width="1.6" /><polygon fill="#A05720" points="824,424 816,420.5 816,427.5" /><text x="340" y="470" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="340" y="470" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">後のトークン自体は変わっていませんが、読み取れるプレフィックスが</tspan><tspan x="340" y="497" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">変わっています。</tspan></text><line x1="26" y1="522" x2="934" y2="522" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="545" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="545" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">有効な再利用には、モデルのバージョン、パラメーター、位置、計算の設定の一致も必要です。現在のトークンIDだけを比較してはいけませ</tspan><tspan x="26" y="566" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ん。</tspan></text></svg>
