<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 600" role="img" aria-label="プレフィックスの途中が変わると、変更箇所以降のキャッシュを再計算する必要がある"><title>プレフィックスの途中が変わると、変更箇所以降のキャッシュを再計算する必要がある</title><rect width="960" height="600" fill="white" /><text x="26" y="32" font-size="19" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">位置1だけを変更：我 → 你。モデルのパラメーターと位置の取り決めは固定</text><text x="266" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">位置 0</text><text x="428" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">位置 1</text><text x="590" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">位置 2</text><text x="752" y="92" font-size="15" fill="#536473" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">位置 3</text><text x="32" y="152" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">元の入力</text><rect x="185" y="118" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="261" y="158" font-size="20" fill="#182632" font-weight="400" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">BOS</text><rect x="347" y="118" width="152" height="65" rx="0" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="423" y="158" font-size="20" fill="#182632" font-weight="400" text-anc