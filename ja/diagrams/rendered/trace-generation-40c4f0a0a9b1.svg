<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 534" role="img" aria-label="同じ学習済み重み：各ターンで予測、追加、停止する"><title>同じ学習済み重み：各ターンで予測、追加、停止する</title><rect width="960" height="534" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">各ターンでθ*を使い、推論中にパラメーターは変わらない</text><text x="28" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ターン</text><text x="170" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">このターンの実際の入力</text><text x="485" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">キャッシュの対象範囲</text><text x="730" y="82" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新たに選んだトークン</text><rect x="24" y="115" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="33" y="148" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Prefill</text><text x="175" y="148" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">BOS / 我 / 爱</text><text x="490" y="148" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">0 → 3</text><text x="735" y="148" font-size="17" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">学习</text><text x="180" y="183" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新しく選ばれた項目は、まだ自身の順伝播を行っていない</text><rect x="24" y="231" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="33" y="264" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Decode 1</text><text x="175" y="264" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">学习</text><text x="490" y="264" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">3 → 4</text><text x="735" y="264" font-size="17" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">！</text><text x="180" y="299" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新しく選ばれた項目は、まだ自身の順伝播を行っていない</text><rect x="24" y="347" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="33" y="380" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Decode 2</text><text x="175" y="380" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">！</text><text x="490" y="380" font-size="17" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">4 → 5</text><text x="735" y="380" font-size="17" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">EOS</text><text x="180" y="415" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">EOSを選ぶとハーネスが終了し、EOSのためのキャッシュは追加しない</text><line x1="26" y1="456" x2="934" y2="456" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="479" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="479" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">数値と選択は、このパッケージのrun.jsonにある、実際にCPUで動かした教育用実験に基づきます。標準はargmaxです。三回の順伝播のlogits</tspan><tspan x="26" y="500" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">は、完全な再計算と一致します。</tspan></text></svg>
