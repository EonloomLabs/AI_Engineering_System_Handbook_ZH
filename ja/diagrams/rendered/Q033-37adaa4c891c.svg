<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 884" role="img" aria-label="一つのタスクの二回のモデル呼び出しで、それぞれ何を新しく知るのか"><title>一つのタスクの二回のモデル呼び出しで、それぞれ何を新しく知るのか</title><rect width="960" height="884" fill="white" /><text x="26" y="31" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">メッセージは参加者間を移動し、各矢印は同じターンの具体的なオブジェクトを示します</text><text x="60" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ユーザー</text><text x="340" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ハーネス</text><text x="620" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">モデル</text><text x="900" y="90" font-size="18" fill="#182632" font-weight="600" text-anchor="middle" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ツール</text><line x1="60.0" y1="109" x2="60.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="340.0" y1="109" x2="340.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="620.0" y1="109" x2="620.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><line x1="900.0" y1="109" x2="900.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5" /><rect x="115" y="125" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="146" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">01  config.txt内のtimeoutを読み取る</text><line x1="60.0" y1="165" x2="340.0" y2="165" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="340,165 332,161.5 332,168.5" /><text x="132" y="192" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">タスクは既知、内容は未知</text><rect x="115" y="208" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="229" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">02  問い + read_fileツールの説明</text><line x1="340.0" y1="248" x2="620.0" y2="248" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="620,248 612,244.5 612,251.5" /><text x="132" y="275" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">モデルに利用可能な能力の説明がある</text><rect x="115" y="291" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="312" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">03  call c1: read_file(config.txt)</text><line x1="620.0" y1="331" x2="340.0" y2="331" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,331 348,334.5 348,327.5" /><text x="132" y="358" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">提案だけで、証拠はまだない</text><rect x="115" y="374" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="395" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">04  c1を実行</text><line x1="340.0" y1="414" x2="900.0" y2="414" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="900,414 892,410.5 892,417.5" /><text x="132" y="441" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ディスクのr7を読む</text><rect x="115" y="457" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="478" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">05  c1: timeout=30 @r7</text><line x1="900.0" y1="497" x2="340.0" y2="497" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,497 348,500.5 348,493.5" /><text x="132" y="524" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">証拠を取得済み</text><rect x="115" y="540" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="561" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">06  元のタスク + c1 + c1の結果</text><line x1="340.0" y1="580" x2="620.0" y2="580" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="620,580 612,576.5 612,583.5" /><text x="132" y="607" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">次のターンでファイルに関する事実が加わる</text><rect x="115" y="623" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="644" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">07  回答の下書き：timeoutは30、根拠はr7</text><line x1="620.0" y1="663" x2="340.0" y2="663" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="340,663 348,666.5 348,659.5" /><text x="132" y="690" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">二回目のモデル出力が終了</text><rect x="115" y="706" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1" /><text x="132" y="727" font-size="16" fill="#285D96" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">08  確認済みの読み取り専用の結果を表示</text><line x1="340.0" y1="746" x2="60.0" y2="746" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3" /><polygon fill="#285D96" points="60,746 68,749.5 68,742.5" /><text x="132" y="773" font-size="13" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">タスク完了。ファイルの変更はなし</text><line x1="26" y1="806" x2="934" y2="806" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="829" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="829" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">時間は上から下へ進み、行間は所要時間を示しません。実線はリクエスト／操作、破線は図で明示した戻りを示します。出典はこの節の固定し</tspan><tspan x="26" y="850" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">た教育用メッセージであり、非公開の内部動作は推測しません。</tspan></text></svg>
