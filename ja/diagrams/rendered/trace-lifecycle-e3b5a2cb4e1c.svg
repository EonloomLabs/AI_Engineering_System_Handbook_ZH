<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 709" role="img" aria-label="学習と推論は順伝播を共用するが、パラメーターを更新するのは学習だけ"><title>学習と推論は順伝播を共用するが、パラメーターを更新するのは学習だけ</title><rect width="960" height="709" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">同じ計算の中核、異なる二つの実行経路</text><text x="38" y="83" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">学習：目標は既知</text><text x="535" y="83" font-size="18" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">推論：次の項目は未知</text><rect x="38" y="107" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="133" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">学習バッチ + ラベル</text><text x="52" y="158" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">input=先頭5項目；targets=末尾5項目</text><rect x="535" y="107" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="133" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">既存のプレフィックス</text><text x="549" y="158" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">BOS + 我 + 爱</text><rect x="250" y="227" width="460" height="76" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1" /><text x="264" y="253" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">同じforward(ids, cache, …)</text><text x="264" y="278" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">Embedding → Attention → FFN → logits</text><line x1="220" y1="175" x2="345" y2="220" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="345,220 338.66,214 336.29,220.58" /><line x1="716" y1="175" x2="614" y2="220" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="614,220 622.73,219.97 619.91,213.57" /><rect x="38" y="358" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="384" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">loss → backward</text><text x="52" y="409" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">勾配を生成。パラメーターはまだ変わっていない</text><rect x="535" y="358" width="365" height="89" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="384" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">次のトークンを選択</text><text x="549" y="409" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="549" y="409" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">パラメーターを固定し、backwardやstepは呼び出さ</tspan><tspan x="549" y="430" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ない</tspan></text><line x1="350" y1="303" x2="220" y2="350" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="220,350 228.71,350.57 226.33,343.99" /><line x1="610" y1="303" x2="717" y2="350" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="717,350 711.08,343.58 708.27,349.99" /><rect x="38" y="514" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="52" y="540" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">AdamW.step</text><text x="52" y="565" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θ₀ → θ₁；次は改めて順伝播</text><rect x="535" y="514" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1" /><text x="549" y="540" font-size="17" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">トークンを追加、または終了</text><text x="549" y="565" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">終了していない場合だけ、次のターンへ進む</text><line x1="220" y1="447" x2="220" y2="506" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="220,506 223.5,498 216.5,498" /><line x1="717" y1="447" x2="717" y2="506" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="717,506 720.5,498 713.5,498" /><path d="M38 547 H18 V140 H30" fill="none" stroke="#285D96" stroke-width="1.7" /><path d="M900 547 H928 V140 H908" fill="none" stroke="#285D96" stroke-width="1.7" /><line x1="18" y1="140" x2="30" y2="140" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="30,140 22,136.5 22,143.5" /><line x1="928" y1="140" x2="908" y2="140" stroke="#285D96" stroke-width="1.6" /><polygon fill="#285D96" points="908,140 916,143.5 916,136.5" /><text x="260" y="627" font-size="17" fill="#16766B" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">学習した重みを保存 → 再読み込み → 凍結して使用</text><line x1="26" y1="652" x2="934" y2="652" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="675" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">図の二つのループは、パラメーターの学習とトークンごとの生成です。一回の学習更新を、一回の推論出力として描いてはいません。</text></svg>
