amily="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">-0.3945</text><line x1="26" y1="563" x2="934" y2="563" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="586" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="586" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">割合は「出所の位置」の軸に沿って正規化し、Vの各列で独立して重み付き和を取ります。一つの語を選んだり、Keyを混合し直したりするの</tspan><tspan x="26" y="607" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ではありません。</tspan></text></svg>
