<svg xmlns="http://www.w3.org/2000/svg" aria-label="学習時のVRAMは「パラメーター数に二バイトを掛ける」だけでは見積もれない" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 429"><title>学習時のVRAMは「パラメーター数に二バイトを掛ける」だけでは見積もれない</title><rect fill="#fff" height="429" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="35">低精度の重み</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="52" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="111.5" x="24" y="52" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="74">2000 B</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="117">勾配</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="134" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="111.5" x="24" y="134" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="156">2000 B</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="199">FP32マスター重み</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="216" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="223.0" x="24" y="216" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="238">4000 B</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="24" y="281">Adam m/v</text><rect fill="#f7f9fb" height="30" rx="4" stroke="#d6dfe6" width="892" x="24" y="298" /><rect fill="#eff4f8" height="30" rx="0" stroke="#285d96" width="446.0" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="32" y="320">8000 B</text><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="20" font-weight="650" text-anchor="start" x="24" y="363">合計：16000 B</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="401">バーの長さには共通の合計を分母として使います。バイト・パラメーター数・計算量を同じ単位として混同していません。</text></svg>
