<svg xmlns="http://www.w3.org/2000/svg" aria-label="「80%の確信がある」の信頼性は、実際の結果の集合で較正する" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 334"><title>「80%の確信がある」の信頼性は、実際の結果の集合で較正する</title><rect fill="#fff" height="334" width="940" x="0" y="0" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="70">自己評価の正答率</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="90" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="713.6" x="24" y="90" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="119">80%</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="190">実際の確認正答率</text><rect fill="#f7f9fb" height="43" rx="4" stroke="#d6dfe6" width="892" x="24" y="210" /><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="535.1999999999999" x="24" y="210" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="18" font-weight="650" text-anchor="start" x="35" y="239">60%</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="285"><tspan x="22" y="285" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">同じ100件の回答で、約80%の確信を表明しているのに、実際に正しいのは60件です。教育用の標本であり、商用モデルの実測ではありませ</tspan><tspan x="22" y="306" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ん。</tspan></text></svg>
