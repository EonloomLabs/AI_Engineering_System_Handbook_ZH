<svg xmlns="http://www.w3.org/2000/svg" aria-label="BPEの結合順序が、その後に結合できるものを決める" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 568"><title>BPEの結合順序が、その後に結合できるものを決める</title><rect fill="#fff" height="568" width="940" x="0" y="0" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="32">時刻0</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="48" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="74">a</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="114" y="48" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="124" y="74">b</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="204" y="48" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="214" y="74">c</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="118">規則①：隣り合う a、bを結合</text><line stroke="#285d96" stroke-width="2" x1="52" x2="52" y1="138" y2="155" /><polygon fill="#285d96" points="52,155 48,146 56,146" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="160">時刻1</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="176" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="202">ab</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="114" y="176" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="124" y="202">c</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="246">規則②：新しくできた abとcを結合</text><line stroke="#285d96" stroke-width="2" x1="52" x2="52" y1="266" y2="283" /><polygon fill="#285d96" points="52,283 48,274 56,274" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="288">時刻2</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="304" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="330">abc</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="374">固定の語彙表を参照</text><line stroke="#285d96" stroke-width="2" x1="52" x2="52" y1="394" y2="411" /><polygon fill="#285d96" points="52,411 48,402 56,402" /><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="20" y="416">時刻3</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="76" x="24" y="432" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="34" y="458">ID 7</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="24" y="502">一項目だけが残る。原文はabcのまま</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="540">マスは現在の記号項目を表します。一つのマスが一文字とは限りません。</text></svg>
