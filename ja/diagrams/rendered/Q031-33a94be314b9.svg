anchor="middle" x="559.2" y="224">B:0.2</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="282">補償を拒否</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="267.59999999999997" x="24" y="298" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="157.8" y="325">B:0.3</text><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="17" font-weight="650" text-anchor="start" x="24" y="383">最終的な目標 p</text><rect fill="#eff4f8" height="42" rx="0" stroke="#285d96" width="446.0" x="24" y="399" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="247" y="426">A:0.5</text><rect fill="#e6f1ed" height="42" rx="0" stroke="#21694c" width="446.0" x="470.0" y="399" /><text fill="#182632" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="15" font-weight="400" text-anchor="middle" x="693" y="426">B:0.5</text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="473">すべての棒で同じ確率の目盛り0—1を使います。中間の受理された総質量は0.7で、残りの0.3は棄却時の補正でBに補います。</text></svg>
