<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="white-space:pre;font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 960 594" role="img" aria-label="パラメーターと勾配は別々の状態であり、パラメーターを変えるのはstepだけ"><title>パラメーターと勾配は別々の状態であり、パラメーターを変えるのはstepだけ</title><rect width="960" height="594" fill="white" /><text x="26" y="32" font-size="20" fill="#182632" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">一回の更新で、θが実際に変わる時点は？</text><text x="28" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">操作</text><text x="265" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">パラメーター θ</text><text x="488" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">勾配 .grad</text><text x="720" y="83" font-size="15" fill="#536473" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">このステップで生成または使用</text><rect x="24" y="112" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">zero_grad</text><text x="272" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θ₀</text><text x="495" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">クリア/ゼロ化</text><text x="727" y="146" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">古い勾配を消去</text><rect x="24" y="182" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">forward + loss</text><text x="272" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θ₀</text><text x="495" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">まだ求めていない</text><text x="727" y="216" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">logits・loss・活性値</text><rect x="24" y="252" width="902" height="83" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">backward</text><text x="272" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θ₀</text><text x="495" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">∂L / ∂θ₀</text><text x="727" y="286" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="727" y="286" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">グラフに沿って各勾配を</tspan><tspan x="727" y="310" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">合流</tspan></text><rect x="24" y="346" width="902" height="83" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">optimizer.step</text><text x="272" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θ₁</text><text x="495" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="495" y="380" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">依然として以前の順伝播の勾</tspan><tspan x="495" y="404" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">配</tspan></text><text x="727" y="380" font-size="16" fill="#285D96" font-weight="600" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θとAdam状態を更新</text><rect x="24" y="440" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6" /><text x="35" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">次のforward</text><text x="272" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">θ₁を使用</text><text x="495" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">別途クリア/累積</text><text x="727" y="474" font-size="16" fill="#182632" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">新しい活性値と損失</text><line x1="26" y1="516" x2="934" y2="516" stroke="#D6DFE6" stroke-width="1" /><text x="26" y="539" font-size="14" fill="#536473" font-weight="400" text-anchor="start" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif"><tspan x="26" y="539" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">意図的にマイクロバッチの勾配を累積することと、古い勾配を消し忘れることは異なります。backwardの後でも、まだstepを行っていなけれ</tspan><tspan x="26" y="560" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ば、重みを更新したとは主張できません。</tspan></text></svg>
