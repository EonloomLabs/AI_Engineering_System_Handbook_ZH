<svg xmlns="http://www.w3.org/2000/svg" aria-label="ページングは物理的な配置を変え、トークンの論理順序は変えない" class="mx-svg" role="img" style=";font-family:Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" viewBox="0 0 940 392"><title>ページングは物理的な配置を変え、トークンの論理順序は変えない</title><rect fill="#fff" height="392" width="940" x="0" y="0" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="245" x="20" y="36" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="30" y="62">論理ブロック0の位置0、1</text><line stroke="#285d96" stroke-width="2" x1="280" x2="570" y1="74" y2="74" /><polygon fill="#285d96" points="570,74 561,78 561,70" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="260" x="600" y="36" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="610" y="62"><tspan x="610" y="62" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">物理ブロック6はマッピングテー</tspan><tspan x="610" y="86" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ブルで特定する</tspan></text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="245" x="20" y="151" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="30" y="177">論理ブロック1の位置2、3</text><line stroke="#285d96" stroke-width="2" x1="280" x2="570" y1="189" y2="189" /><polygon fill="#285d96" points="570,189 561,193 561,185" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="260" x="600" y="151" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="610" y="177"><tspan x="610" y="177" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">物理ブロック1はマッピングテー</tspan><tspan x="610" y="201" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ブルで特定する</tspan></text><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="245" x="20" y="266" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="30" y="292">論理ブロック2の位置4、空き</text><line stroke="#285d96" stroke-width="2" x1="280" x2="570" y1="304" y2="304" /><polygon fill="#285d96" points="570,304 561,308 561,300" /><rect fill="#eff4f8" height="66" rx="4" stroke="#d6dfe6" width="260" x="600" y="266" /><text fill="#285d96" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="16" font-weight="650" text-anchor="start" x="610" y="292"><tspan x="610" y="292" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">物理ブロック9はマッピングテー</tspan><tspan x="610" y="316" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif">ブルで特定する</tspan></text><text fill="#536473" font-family="Arial, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="22" y="364">物理ブロック番号はトークンの順序を表しません。実データは論理位置に従って復元するため、物理番号で並べ替えてはいけません。</text></svg>
