<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 863" role="img" aria-label="一次任务里的两轮模型调用，各自多知道了什么"><title>一次任务里的两轮模型调用，各自多知道了什么</title><rect width="960" height="863" fill="white"/><text x="26" y="31.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">消息沿参与方流转；每条箭头标注同一轮的具体对象</text><text x="60.0" y="90.0" font-size="18" fill="#182632" font-weight="600" text-anchor="middle">用户</text><text x="340.0" y="90.0" font-size="18" fill="#182632" font-weight="600" text-anchor="middle">宿主</text><text x="620.0" y="90.0" font-size="18" fill="#182632" font-weight="600" text-anchor="middle">模型</text><text x="900.0" y="90.0" font-size="18" fill="#182632" font-weight="600" text-anchor="middle">工具</text><line x1="60.0" y1="109" x2="60.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5"/><line x1="340.0" y1="109" x2="340.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5"/><line x1="620.0" y1="109" x2="620.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5"/><line x1="900.0" y1="109" x2="900.0" y2="789" stroke="#D6DFE6" stroke-width="1" stroke-dasharray="3 5"/><rect x="115" y="125" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="146.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">01  读取config.txt中的timeout</text><line x1="60.0" y1="165" x2="340.0" y2="165" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="340.00,165.00 332.00,161.50 332.00,168.50"/><text x="132" y="192.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">任务已知，内容未知</text><rect x="115" y="208" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="229.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">02  问题 + read_file工具说明</text><line x1="340.0" y1="248" x2="620.0" y2="248" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="620.00,248.00 612.00,244.50 612.00,251.50"/><text x="132" y="275.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">模型有可用能力描述</text><rect x="115" y="291" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="312.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">03  call c1: read_file(config.txt)</text><line x1="620.0" y1="331" x2="340.0" y2="331" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="340.00,331.00 348.00,334.50 348.00,327.50"/><text x="132" y="358.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">只有提议，尚未取证</text><rect x="115" y="374" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="395.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">04  执行c1</text><line x1="340.0" y1="414" x2="900.0" y2="414" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="900.00,414.00 892.00,410.50 892.00,417.50"/><text x="132" y="441.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">读取磁盘r7</text><rect x="115" y="457" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="478.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">05  c1: timeout=30 @r7</text><line x1="900.0" y1="497" x2="340.0" y2="497" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="340.00,497.00 348.00,500.50 348.00,493.50"/><text x="132" y="524.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">证据已取得</text><rect x="115" y="540" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="561.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">06  原任务 + c1 + c1结果</text><line x1="340.0" y1="580" x2="620.0" y2="580" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3"/><polygon fill="#285D96" points="620.00,580.00 612.00,576.50 612.00,583.50"/><text x="132" y="607.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">下一轮新增了文件事实</text><rect x="115" y="623" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="644.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">07  回答草稿：timeout为30，依据r7</text><line x1="620.0" y1="663" x2="340.0" y2="663" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="340.00,663.00 348.00,666.50 348.00,659.50"/><text x="132" y="690.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">第二轮模型输出已结束</text><rect x="115" y="706" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="727.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">08  显示已核对的只读结果</text><line x1="340.0" y1="746" x2="60.0" y2="746" stroke="#285D96" stroke-width="1.6" stroke-dasharray="5 3"/><polygon fill="#285D96" points="60.00,746.00 68.00,749.50 68.00,742.50"/><text x="132" y="773.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">任务完成；没有发生文件修改</text><line x1="26" y1="806" x2="934" y2="806" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="829.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">时间自上而下；行距不代表耗时。实线是请求/动作，虚线表示图中明确的返回。来源为本节固定教学消息，不推测闭源内部。</text></svg>