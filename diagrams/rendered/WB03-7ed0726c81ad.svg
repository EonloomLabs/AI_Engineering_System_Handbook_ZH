oke-width="1.6"/><polygon fill="#285D96" points="620.00,248.00 612.00,244.50 612.00,251.50"/><text x="132" y="275.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">工具访问r42工作区</text><rect x="115" y="291" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="312.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">03  c1：filter.py 20–35行；test_filter.py 10–28行</text><line x1="620.0" y1="331" x2="340.0" y2="331" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="340.00,331.00 348.00,334.50 348.00,327.50"/><text x="132" y="358.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">这些是定位片段，未包含完整文件</text><rect x="115" y="374" width="730" height="28" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="132" y="395.0" font-size="16" fill="#285D96" font-weight="400" text-anchor="start">04  原任务＋约束＋c1调用＋c1结果</text><line x1="340.0" y1="414" x2="900.0" y2="414" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="900.00,414.00 892.00,410.50 892.00,417.50"/><text x="132" y="441.0" font-size="13" fill="#536473" font-weight="400" text-anchor="start">M2能决定继续读取哪些范围</text><line x1="26" y1="474" x2="934" y2="474" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="497.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">时间自上而下；行距不代表耗时。实线是请求/动作，虚线表示图中明确的返回。来源为本节固定教学消息，不推测闭源内部。</text></svg>