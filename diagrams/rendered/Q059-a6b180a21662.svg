<svg aria-label="向量同维度，不代表能放在同一个相似度空间" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg"><title>向量同维度，不代表能放在同一个相似度空间</title><rect fill="#fff" height="330" width="940" x="0" y="0"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">同样二维，坐标意义可以不同</text><line stroke="#d6dfe6" stroke-width="1" x1="325.0" x2="615.0" y1="190" y2="190"/><line stroke="#d6dfe6" stroke-width="1" x1="470.0" x2="470.0" y1="45" y2="270"/><line stroke="#182632" stroke-width="2" x1="470.0" x2="585.0" y1="190" y2="190"/><polygon fill="#182632" points="585.00,190.00 576.00,194.00 576.00,186.00"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="585.0" y="215.0">q</text><line stroke="#285d96" stroke-width="2" x1="470.0" x2="573.5" y1="190" y2="178.5"/><polygon fill="#285d96" points="573.50,178.50 565.00,183.47 564.11,175.52"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="573.5" y="160.5">配套d</text><line stroke="#8c4a26" stroke-width="2" x1="470.0" x2="458.5" y1="190" y2="86.5"/><polygon fill="#8c4a26" points="458.50,86.50 463.47,95.00 455.52,95.89"/><text fill="#8c4a26" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="middle" x="458.5" y="68.5">换模型d</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="302.0">仅文档向量旋转后，查询没有同步改变。距离公式仍能运行，但原先的相关性不再由该配对保证。</text></svg>