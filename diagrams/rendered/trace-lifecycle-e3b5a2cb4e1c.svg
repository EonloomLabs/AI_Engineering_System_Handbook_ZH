<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 688" role="img" aria-label="训练与推理共用前向，但只有训练更新参数"><title>训练与推理共用前向，但只有训练更新参数</title><rect width="960" height="688" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">同一个计算核心，两条不同的运行路径</text><text x="38" y="83.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">训练：目标已知</text><text x="535" y="83.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">推理：下一项未知</text><rect x="38" y="107" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="52" y="133.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">训练批次 + 标签</text><text x="52" y="158.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">input=前5项；targets=后5项</text><rect x="535" y="107" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="549" y="133.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">已有前缀</text><text x="549" y="158.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">BOS + 我 + 爱</text><rect x="250" y="227" width="460" height="76" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1"/><text x="264" y="253.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">同一个 forward(ids, cache, …)</text><text x="264" y="278.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">Embedding → Attention → FFN → logits</text><line x1="220" y1="175" x2="345" y2="220" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="345.00,220.00 338.66,214.00 336.29,220.58"/><line x1="716" y1="175" x2="614" y2="220" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="614.00,220.00 622.73,219.97 619.91,213.57"/><rect x="38" y="358" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="52" y="384.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">loss → backward</text><text x="52" y="409.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">产生梯度；参数仍未改变</text><rect x="535" y="358" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="549" y="384.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">选择下一个Token</text><text x="549" y="409.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">固定参数；不调用backward或step</text><line x1="350" y1="303" x2="220" y2="350" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="220.00,350.00 228.71,350.57 226.33,343.99"/><line x1="610" y1="303" x2="717" y2="350" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="717.00,350.00 711.08,343.58 708.27,349.99"/><rect x="38" y="493" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="52" y="519.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">AdamW.step</text><text x="52" y="544.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">θ₀ → θ₁；下一次重新前向</text><rect x="535" y="493" width="365" height="68" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="549" y="519.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">追加Token或结束</text><text x="549" y="544.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">只有未结束时才进入下一轮</text><line x1="220" y1="426" x2="220" y2="485" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="220.00,485.00 223.50,477.00 216.50,477.00"/><line x1="717" y1="426" x2="717" y2="485" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="717.00,485.00 720.50,477.00 713.50,477.00"/><path d="M38 526 H18 V140 H30" fill="none" stroke="#285D96" stroke-width="1.7"/><path d="M900 526 H928 V140 H908" fill="none" stroke="#285D96" stroke-width="1.7"/><line x1="18" y1="140" x2="30" y2="140" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="30.00,140.00 22.00,136.50 22.00,143.50"/><line x1="928" y1="140" x2="908" y2="140" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="908.00,140.00 916.00,143.50 916.00,136.50"/><text x="260" y="606.0" font-size="17" fill="#16766B" font-weight="600" text-anchor="start">保存训练权重 → 重新加载 → 冻结使用</text><line x1="26" y1="631.0" x2="934" y2="631.0" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="654.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">图中两条回路分别是参数学习与逐Token生成；没有把一次训练更新画成一次推理输出。</text></svg>