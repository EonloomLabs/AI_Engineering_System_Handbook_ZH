<svg aria-label="成功任务成本的分子，必须包含失败和返工" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg"><title>成功任务成本的分子，必须包含失败和返工</title><rect fill="#fff" height="310" width="940" x="0" y="0"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">统一分母：完成一个成功任务</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="24" y="72.0">A：每成功任务</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="743.3333333333334" x="24" y="92"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="36" y="120.0">1.25</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="17" font-weight="400" text-anchor="start" x="24" y="187.0">B：每成功任务</text><rect fill="#eff4f8" height="43" rx="4" stroke="#285d96" width="832.5333333333333" x="24" y="207"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="36" y="235.0">1.4</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="282.0">A总费用100/成功80=1.25；B总费用70/成功50=1.40。失败运行的费用没有从分子删除。</text></svg>