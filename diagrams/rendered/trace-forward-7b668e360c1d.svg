<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 966" role="img" aria-label="共通前向：参数从侧面进入；残差保留并汇合原表示"><title>共通前向：参数从侧面进入；残差保留并汇合原表示</title><rect width="960" height="966" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">单层教学模型 · 两个残差汇合点必须保留</text><rect x="90" y="94" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="120.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">E[ids] + P[pos]</text><text x="104" y="145.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">X  [B,T,4]</text><rect x="90" y="214" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="240.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">RMSNorm → Q/K/V</text><text x="104" y="265.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">每行乘 Wq / Wk / Wv</text><rect x="90" y="334" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="360.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">QKᵀ / 2 → 掩码 → softmax</text><text x="104" y="385.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">得到A，再算A @ V；沿来源位置混合</text><rect x="90" y="454" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="480.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">乘 Wo，再加回 X</text><text x="104" y="505.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">R = X + Δattention</text><rect x="90" y="574" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="600.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">RMSNorm → W1 → ReLU → W2</text><text x="104" y="625.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">4维 → 8维 → 4维</text><rect x="90" y="694" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="720.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">加回 R，再做 RMSNorm</text><text x="104" y="745.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">H = R + ΔFFN</text><rect x="90" y="814" width="490" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="104" y="840.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">乘 U</text><text x="104" y="865.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">logits [B,T,8]</text><line x1="335" y1="172" x2="335" y2="207" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="335.00,207.00 338.50,199.00 331.50,199.00"/><line x1="335" y1="292" x2="335" y2="327" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="335.00,327.00 338.50,319.00 331.50,319.00"/><line x1="335" y1="412" x2="335" y2="447" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="335.00,447.00 338.50,439.00 331.50,439.00"/><line x1="335" y1="532" x2="335" y2="567" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="335.00,567.00 338.50,559.00 331.50,559.00"/><line x1="335" y1="652" x2="335" y2="687" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="335.00,687.00 338.50,679.00 331.50,679.00"/><line x1="335" y1="772" x2="335" y2="807" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="335.00,807.00 338.50,799.00 331.50,799.00"/><path d="M90 133 H43 V493 H82" fill="none" stroke="#16766B" stroke-width="2"/><line x1="60" y1="493" x2="82" y2="493" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="82.00,493.00 74.00,489.50 74.00,496.50"/><text x="16" y="310.0" font-size="17" fill="#16766B" font-weight="600" text-anchor="start">X</text><path d="M580 493 H630 V733 H588" fill="none" stroke="#16766B" stroke-width="2"/><line x1="610" y1="733" x2="588" y2="733" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="588.00,733.00 596.00,736.50 596.00,729.50"/><text x="644" y="618.0" font-size="17" fill="#16766B" font-weight="600" text-anchor="start">R</text><text x="692" y="134.0" font-size="15" fill="#536473" font-weight="400" text-anchor="start">参数：E、P</text><line x1="676" y1="141" x2="590" y2="141" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="590.00,141.00 598.00,144.50 598.00,137.50"/><text x="692" y="254.0" font-size="15" fill="#536473" font-weight="400" text-anchor="start">参数：g1、Wq、Wk、Wv</text><line x1="676" y1="261" x2="590" y2="261" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="590.00,261.00 598.00,264.50 598.00,257.50"/><text x="692" y="494.0" font-size="15" fill="#536473" font-weight="400" text-anchor="start">参数：Wo</text><line x1="676" y1="501" x2="590" y2="501" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="590.00,501.00 598.00,504.50 598.00,497.50"/><text x="692" y="614.0" font-size="15" fill="#536473" font-weight="400" text-anchor="start">参数：g2、W1、W2</text><line x1="676" y1="621" x2="590" y2="621" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="590.00,621.00 598.00,624.50 598.00,617.50"/><text x="692" y="734.0" font-size="15" fill="#536473" font-weight="400" text-anchor="start">参数：gf</text><line x1="676" y1="741" x2="590" y2="741" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="590.00,741.00 598.00,744.50 598.00,737.50"/><text x="692" y="854.0" font-size="15" fill="#536473" font-weight="400" text-anchor="start">参数：U</text><line x1="676" y1="861" x2="590" y2="861" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="590.00,861.00 598.00,864.50 598.00,857.50"/><line x1="26" y1="909" x2="934" y2="909" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="932.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">箭头是数据依赖，不是耗时。训练与推理都调用 forward；损失、反向和更新不属于这个共通前向。</text></svg>