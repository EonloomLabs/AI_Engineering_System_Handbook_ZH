<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 513" role="img" aria-label="同一份已训练权重：逐轮预测、追加、停止"><title>同一份已训练权重：逐轮预测、追加、停止</title><rect width="960" height="513" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">每一轮都用 θ*；参数在推理中不改变</text><text x="28" y="82.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">轮次</text><text x="170" y="82.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">本轮实际输入</text><text x="485" y="82.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">缓存覆盖</text><text x="730" y="82.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">新选中的Token</text><rect x="24" y="115" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="33" y="148.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">Prefill</text><text x="175" y="148.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">BOS / 我 / 爱</text><text x="490" y="148.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">0 → 3</text><text x="735" y="148.0" font-size="17" fill="#285D96" font-weight="600" text-anchor="start">学习</text><text x="180" y="183.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">新选出的项尚未做自己的前向</text><rect x="24" y="231" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="33" y="264.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">Decode 1</text><text x="175" y="264.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">学习</text><text x="490" y="264.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">3 → 4</text><text x="735" y="264.0" font-size="17" fill="#285D96" font-weight="600" text-anchor="start">！</text><text x="180" y="299.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">新选出的项尚未做自己的前向</text><rect x="24" y="347" width="906" height="92" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="33" y="380.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">Decode 2</text><text x="175" y="380.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">！</text><text x="490" y="380.0" font-size="17" fill="#182632" font-weight="400" text-anchor="start">4 → 5</text><text x="735" y="380.0" font-size="17" fill="#285D96" font-weight="600" text-anchor="start">EOS</text><text x="180" y="415.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">选到EOS，宿主结束，不再为EOS追加缓存</text><line x1="26" y1="456" x2="934" y2="456" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="479.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">数值与选取来自本包 run.json 的真实CPU教学实验；默认argmax。三次前向的logits与完整重算一致。</text></svg>