<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 707" role="img" aria-label="超时进入unknown，恢复必须先核对副作用"><title>超时进入unknown，恢复必须先核对副作用</title><rect width="960" height="707" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">状态节点与转移条件分开；未知不是失败</text><rect x="40" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="54" y="118.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">recorded</text><text x="54" y="143.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">操作ID已记录</text><rect x="350" y="92" width="190" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="364" y="118.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">executing</text><text x="364" y="143.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">动作已发出</text><rect x="675" y="92" width="225" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="689" y="118.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">succeeded</text><text x="689" y="143.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">有结果且已持久化</text><rect x="350" y="310" width="190" height="74" rx="3" fill="#EFF4F8" stroke="#285D96" stroke-width="1"/><text x="364" y="336.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">unknown</text><text x="364" y="361.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">未收到确定回执</text><rect x="40" y="512" width="240" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="54" y="538.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">confirmed_not_done</text><text x="54" y="563.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">核验确认没有发生</text><rect x="650" y="512" width="250" height="74" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="664" y="538.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">confirmed_done</text><text x="664" y="563.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">核验确认已发生</text><line x1="230" y1="129" x2="342" y2="129" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="342.00,129.00 334.00,125.50 334.00,132.50"/><text x="280" y="111.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">派发</text><line x1="540" y1="129" x2="667" y2="129" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="667.00,129.00 659.00,125.50 659.00,132.50"/><text x="602" y="111.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">确认结果</text><line x1="445" y1="166" x2="445" y2="301" stroke="#A05720" stroke-width="1.6"/><polygon fill="#A05720" points="445.00,301.00 448.50,293.00 441.50,293.00"/><text x="458" y="240.0" font-size="15" fill="#A05720" font-weight="400" text-anchor="start">超时 / 连接中断</text><line x1="391" y1="384" x2="216" y2="503" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="216.00,503.00 224.58,501.40 220.65,495.61"/><text x="165" y="439.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">查询下游状态</text><line x1="499" y1="384" x2="755" y2="503" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="755.00,503.00 749.22,496.45 746.27,502.80"/><text x="740" y="439.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">按操作ID核验提交证据</text><path d="M40 550 H16 V129 H32" fill="none" stroke="#285D96" stroke-width="1.6"/><line x1="16" y1="129" x2="32" y2="129" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="32.00,129.00 24.00,125.50 24.00,132.50"/><text x="38" y="625.0" font-size="16" fill="#285D96" font-weight="600" text-anchor="start">确认未发生：按策略重试</text><path d="M900 550 H930 V129 H908" fill="none" stroke="#16766B" stroke-width="1.6"/><line x1="930" y1="129" x2="908" y2="129" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="908.00,129.00 916.00,132.50 916.00,125.50"/><text x="650" y="625.0" font-size="16" fill="#16766B" font-weight="600" text-anchor="start">确认已发生：补记完成，勿重复执行</text><line x1="26" y1="650.0" x2="934" y2="650.0" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="673.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">这是教学宿主的恢复设计，不是某一API的保证。查不清时维持unknown并升级处理，不能把没有回执当作没有副作用。</text></svg>