<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 525" role="img" aria-label="参数和梯度是两份状态：只有step才改参数"><title>参数和梯度是两份状态：只有step才改参数</title><rect width="960" height="525" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">一次更新中，θ何时真正改变？</text><text x="28" y="83.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">动作</text><text x="265" y="83.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">参数 θ</text><text x="488" y="83.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">梯度 .grad</text><text x="720" y="83.0" font-size="15" fill="#536473" font-weight="600" text-anchor="start">本步产生或使用</text><rect x="24" y="112" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="35" y="146.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">zero_grad</text><text x="272" y="146.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">θ₀</text><text x="495" y="146.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">清空/置零</text><text x="727" y="146.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">清除旧梯度</text><rect x="24" y="182" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="35" y="216.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">forward + loss</text><text x="272" y="216.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">θ₀</text><text x="495" y="216.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">尚未求出</text><text x="727" y="216.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">logits、loss、激活</text><rect x="24" y="252" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="35" y="286.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">backward</text><text x="272" y="286.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">θ₀</text><text x="495" y="286.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">∂L / ∂θ₀</text><text x="727" y="286.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">沿图汇合每条梯度</text><rect x="24" y="322" width="902" height="59" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.6"/><text x="35" y="356.0" font-size="16" fill="#285D96" font-weight="600" text-anchor="start">optimizer.step</text><text x="272" y="356.0" font-size="16" fill="#285D96" font-weight="600" text-anchor="start">θ₁</text><text x="495" y="356.0" font-size="16" fill="#285D96" font-weight="600" text-anchor="start">仍是旧前向的梯度</text><text x="727" y="356.0" font-size="16" fill="#285D96" font-weight="600" text-anchor="start">更新θ与Adam状态</text><rect x="24" y="392" width="902" height="59" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.6"/><text x="35" y="426.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">下一次 forward</text><text x="272" y="426.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">使用θ₁</text><text x="495" y="426.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">另行清理/累计</text><text x="727" y="426.0" font-size="16" fill="#182632" font-weight="400" text-anchor="start">新激活、新损失</text><line x1="26" y1="468" x2="934" y2="468" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="491.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">有意累积微批梯度与忘记清理旧梯度不同。backward之后还没step，不能声称权重已更新。</text></svg>