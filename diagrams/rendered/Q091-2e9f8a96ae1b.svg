<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 557" role="img" aria-label="配对评测：20个任务中，改对与改错必须同时计入"><title>配对评测：20个任务中，改对与改错必须同时计入</title><rect width="960" height="557" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">同一批任务逐题对齐，不比较两个无关样本</text><text x="317.5" y="121.0" font-size="13" fill="#536473" font-weight="400" text-anchor="middle">新成功</text><text x="542.5" y="121.0" font-size="13" fill="#536473" font-weight="400" text-anchor="middle">新失败</text><text x="191" y="196.0" font-size="14" fill="#536473" font-weight="400" text-anchor="end">旧成功</text><rect x="205" y="133" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65"/><text x="317.5" y="196.0" font-size="15" fill="#182632" font-weight="400" text-anchor="middle">12</text><rect x="430" y="133" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65"/><text x="542.5" y="196.0" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle">1</text><text x="191" y="296.0" font-size="14" fill="#536473" font-weight="400" text-anchor="end">旧失败</text><rect x="205" y="233" width="225" height="100" rx="0" fill="#EFF4F8" stroke="#D6DFE6" stroke-width="0.65"/><text x="317.5" y="296.0" font-size="15" fill="#285D96" font-weight="600" text-anchor="middle">3</text><rect x="430" y="233" width="225" height="100" rx="0" fill="white" stroke="#D6DFE6" stroke-width="0.65"/><text x="542.5" y="296.0" font-size="15" fill="#182632" font-weight="400" text-anchor="middle">4</text><text x="238" y="424.0" font-size="22" fill="#16766B" font-weight="600" text-anchor="start">3 个新修复</text><text x="548" y="424.0" font-size="22" fill="#A13A37" font-weight="600" text-anchor="start">1 个回归</text><text x="238" y="475.0" font-size="21" fill="#285D96" font-weight="600" text-anchor="start">净改善 = (3−1) / 20 = 10 个百分点</text><line x1="26" y1="500.0" x2="934" y2="500.0" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="523.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">旧成功13/20，新成功15/20。对角线不改变净差；这20题的结果不能单凭百分比证明总体稳定收益。</text></svg>