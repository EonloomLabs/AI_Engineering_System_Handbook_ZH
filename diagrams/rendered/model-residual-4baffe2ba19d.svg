<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 565" role="img" aria-label="残差前向相加，反向在分叉处相加"><title>残差前向相加，反向在分叉处相加</title><rect width="960" height="565" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">同一条旁路，在前向与反向中承担不同作用</text><text x="28" y="93.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">前向：y = x + f(x)</text><rect x="45" y="143" width="120" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="59" y="169.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">x</text><rect x="340" y="143" width="180" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="354" y="169.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">f(x)</text><rect x="785" y="143" width="120" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="799" y="169.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">y</text><line x1="165" y1="172" x2="332" y2="172" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="332.00,172.00 324.00,168.50 324.00,175.50"/><line x1="520" y1="172" x2="777" y2="172" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="777.00,172.00 769.00,168.50 769.00,175.50"/><path d="M195 172 V255 H720 V172" fill="none" stroke="#16766B" stroke-width="1.6"/><line x1="720" y1="203" x2="720" y2="172" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="720.00,172.00 716.50,180.00 723.50,180.00"/><text x="425" y="246.0" font-size="15" fill="#16766B" font-weight="400" text-anchor="middle">不经过 f 的原值旁路</text><text x="28" y="330.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">反向：dx = dy + df_path</text><rect x="45" y="380" width="120" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="59" y="406.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">dx</text><rect x="340" y="380" width="180" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="354" y="406.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">f的反向</text><rect x="785" y="380" width="120" height="58" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="799" y="406.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">dy</text><line x1="785" y1="409" x2="528" y2="409" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="528.00,409.00 536.00,412.50 536.00,405.50"/><line x1="340" y1="409" x2="173" y2="409" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="173.00,409.00 181.00,412.50 181.00,405.50"/><path d="M720 409 V492 H205 V409" fill="none" stroke="#16766B" stroke-width="1.6"/><line x1="205" y1="440" x2="205" y2="409" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="205.00,409.00 201.50,417.00 208.50,417.00"/><text x="425" y="483.0" font-size="15" fill="#16766B" font-weight="400" text-anchor="middle">旁路直接贡献 dy，不能漏加</text><line x1="26" y1="508.0" x2="934" y2="508.0" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="531.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">共享输入x有多条到损失的路径，必须把各路径的梯度加起来；不能只沿f这一条支路回传。</text></svg>