<svg aria-label="缓存前缀是在复用相同前段，不是复用“差不多的意思”" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 310" xmlns="http://www.w3.org/2000/svg"><title>缓存前缀是在复用相同前段，不是复用“差不多的意思”</title><rect fill="#fff" height="310" width="940" x="0" y="0"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">每行一份完整请求，从最左侧开始比</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="55" y="120.75">A</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="65.0" y="85"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="171.25" y="120.75">R1</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="277.5" y="85"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="383.75" y="120.75">R2</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="490.0" y="85"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="596.25" y="120.75">T1</text><rect fill="#fff" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="702.5" y="85"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="808.75" y="120.75">U1</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="55" y="175.75">B</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="65.0" y="140"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="171.25" y="175.75">R1</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="277.5" y="140"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="383.75" y="175.75">R2</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="490.0" y="140"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="596.25" y="175.75">T1</text><rect fill="#fff" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="702.5" y="140"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="808.75" y="175.75">U2</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="end" x="55" y="230.75">C</text><rect fill="#eff4f8" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="65.0" y="195"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="middle" x="171.25" y="230.75">R1</text><rect fill="#fff" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="277.5" y="195"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="383.75" y="230.75">new</text><rect fill="#fff" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="490.0" y="195"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="596.25" y="230.75">T1</text><rect fill="#fff" height="55" rx="0" stroke="#d6dfe6" width="212.5" x="702.5" y="195"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="808.75" y="230.75">U2</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="282.0">A/B共有连续前3项；B/C只有连续前1项。后面相同的T1不能跨过不同的new拼接前缀。</text></svg>