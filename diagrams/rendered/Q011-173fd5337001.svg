<svg aria-label="GQA保留多个Query，只让它们共享较少的K/V" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 402" xmlns="http://www.w3.org/2000/svg"><title>GQA保留多个Query，只让它们共享较少的K/V</title><rect fill="#fff" height="402" width="940" x="0" y="0"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="45"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="75" y="71.0">Query头 0</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="70" y2="100"/><polygon fill="#285d96" points="660.00,100.00 650.75,103.38 651.29,95.40"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="130"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="75" y="156.0">Query头 1</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="155" y2="100"/><polygon fill="#285d96" points="660.00,100.00 651.57,105.09 650.57,97.15"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="215"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="75" y="241.0">Query头 2</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="240" y2="275"/><polygon fill="#285d96" points="660.00,275.00 650.71,278.27 651.35,270.30"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="150" x="65" y="300"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="75" y="326.0">Query头 3</text><line stroke="#285d96" stroke-width="2" x1="220" x2="660" y1="325" y2="275"/><polygon fill="#285d96" points="660.00,275.00 651.51,279.99 650.61,272.04"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="205" x="670" y="75"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="680" y="101.0">共享 K0 / V0</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="205" x="670" y="250"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="680" y="276.0">共享 K1 / V1</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="374.0">四条Query仍分别计算份额和输出；箭头汇合代表读取同一KV组，不代表结果相同。</text></svg>