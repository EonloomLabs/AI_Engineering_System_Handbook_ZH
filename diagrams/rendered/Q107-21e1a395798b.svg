<svg aria-label="图像块向量与文字Embedding，输入来源不同但可接入同一计算链" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 522" xmlns="http://www.w3.org/2000/svg"><title>图像块向量与文字Embedding，输入来源不同但可接入同一计算链</title><rect fill="#fff" height="522" width="940" x="0" y="0"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">32×32 RGB图像 → 四个16×16块</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="45" y="80"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="120.0" y="155.0">Patch 0</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="195" y="80"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="270.0" y="155.0">Patch 1</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="45" y="230"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="120.0" y="305.0">Patch 2</text><rect fill="#eff4f8" height="150" rx="0" stroke="#285d96" width="150" x="195" y="230"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="middle" x="270.0" y="305.0">Patch 3</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="24" y="415.0">每块 16×16×3 = 768 个像素通道数值</text><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="20" font-weight="650" text-anchor="start" x="24" y="456.0">[4,768] × [768,8] → [4,8]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="494.0">768是每块展平后的宽度；4是块数；8是教学投影宽度。图像不是靠文字Token ID查表进入模型。</text></svg>