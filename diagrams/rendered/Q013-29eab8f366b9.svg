<svg aria-label="刚选出的Token，还没进入自己的那一轮计算" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 681" xmlns="http://www.w3.org/2000/svg"><title>刚选出的Token，还没进入自己的那一轮计算</title><rect fill="#fff" height="681" width="940" x="0" y="0"/><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="22" y="43.0">输入/已处理</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="65"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="32" y="91.0">[我,爱]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="87" y2="87"/><polygon fill="#285d96" points="530.00,87.00 521.00,91.00 521.00,83.00"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="65"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="560" y="91.0">cache_len=2</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="141.0">选择 学习：新选中项尚未做自己的前向。</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="22" y="201.0">下一轮处理</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="223.0"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="32" y="249.0">[学习]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="245.0" y2="245.0"/><polygon fill="#285d96" points="530.00,245.00 521.00,249.00 521.00,241.00"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="223.0"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="560" y="249.0">cache_len=3</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="299.0">选择 ！：新选中项尚未做自己的前向。</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="22" y="359.0">再下一轮处理</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="381.0"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="32" y="407.0">[！]</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="403.0" y2="403.0"/><polygon fill="#285d96" points="530.00,403.00 521.00,407.00 521.00,399.00"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="381.0"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="560" y="407.0">cache_len=4</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="457.0">选择 EOS：新选中项尚未做自己的前向。</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="15" font-weight="400" text-anchor="start" x="22" y="517.0">停止</text><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="250" x="22" y="539.0"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="32" y="565.0">不再处理EOS</text><line stroke="#285d96" stroke-width="2" x1="290" x2="530" y1="561.0" y2="561.0"/><polygon fill="#285d96" points="530.00,561.00 521.00,565.00 521.00,557.00"/><rect fill="#eff4f8" height="42" rx="4" stroke="#d6dfe6" width="300" x="550" y="539.0"/><text fill="#285d96" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="650" text-anchor="start" x="560" y="565.0">cache_len=4</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="615.0">宿主看到结束标记，终止后续模型计算。</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="653.0">示意以逐Token因果解码为前提；没有把输出编号数误当成缓存已处理数。</text></svg>