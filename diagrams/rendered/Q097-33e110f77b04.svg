<svg aria-label="Trace里的并行段不能直接相加成用户等待时间" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 479" xmlns="http://www.w3.org/2000/svg"><title>Trace里的并行段不能直接相加成用户等待时间</title><rect fill="#fff" height="479" width="940" x="0" y="0"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="22" y="30.0">横轴：时间（秒）</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="110.0">计划</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="130" y2="130"/><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="165.0" x="80.0" y="85"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="162.5" y="112.0">0—2</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="197.0">工具A</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="217" y2="217"/><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="412.5" x="245.0" y="172"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="451.25" y="199.0">2—7</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="284.0">工具B</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="304" y2="304"/><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="247.5" x="245.0" y="259"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="368.75" y="286.0">2—5</text><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="20" y="371.0">整合</text><line stroke="#d6dfe6" stroke-width="1" x1="80" x2="905" y1="391" y2="391"/><rect fill="#eff4f8" height="43" rx="1" stroke="#285d96" width="247.5" x="657.5" y="346"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="middle" x="781.25" y="373.0">7—10</text><line stroke="#182632" stroke-width="1" x1="80" x2="905" y1="419" y2="419"/><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="451.0">横条按本例给定时长等比例绘制。并行重叠区不能重复计入墙钟时间。</text></svg>