<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 556" role="img" aria-label="有效时间与记录时间：系统何时知道，不等于事实何时生效"><title>有效时间与记录时间：系统何时知道，不等于事实何时生效</title><rect width="960" height="556" fill="white"/><text x="26" y="32.0" font-size="20" fill="#182632" font-weight="600" text-anchor="start">同一事实有两条时间轴</text><text x="26" y="157.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">有效时间</text><line x1="165" y1="150" x2="915" y2="150" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="915.00,150.00 907.00,146.50 907.00,153.50"/><line x1="165.0" y1="144" x2="165.0" y2="156" stroke="#182632" stroke-width="1"/><text x="165.0" y="180.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/1</text><line x1="365.0" y1="144" x2="365.0" y2="156" stroke="#182632" stroke-width="1"/><text x="365.0" y="180.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/3</text><line x1="565.0" y1="144" x2="565.0" y2="156" stroke="#182632" stroke-width="1"/><text x="565.0" y="180.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/5</text><line x1="665.0" y1="144" x2="665.0" y2="156" stroke="#182632" stroke-width="1"/><text x="665.0" y="180.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/6</text><line x1="865.0" y1="144" x2="865.0" y2="156" stroke="#182632" stroke-width="1"/><text x="865.0" y="180.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/8</text><text x="26" y="337.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">记录时间</text><line x1="165" y1="330" x2="915" y2="330" stroke="#D6DFE6" stroke-width="1.6"/><polygon fill="#D6DFE6" points="915.00,330.00 907.00,326.50 907.00,333.50"/><line x1="165.0" y1="324" x2="165.0" y2="336" stroke="#182632" stroke-width="1"/><text x="165.0" y="360.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/1</text><line x1="365.0" y1="324" x2="365.0" y2="336" stroke="#182632" stroke-width="1"/><text x="365.0" y="360.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/3</text><line x1="565.0" y1="324" x2="565.0" y2="336" stroke="#182632" stroke-width="1"/><text x="565.0" y="360.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/5</text><line x1="665.0" y1="324" x2="665.0" y2="336" stroke="#182632" stroke-width="1"/><text x="665.0" y="360.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/6</text><line x1="865.0" y1="324" x2="865.0" y2="336" stroke="#182632" stroke-width="1"/><text x="865.0" y="360.0" font-size="14" fill="#536473" font-weight="400" text-anchor="middle">10/8</text><rect x="165.0" y="106" width="400.0" height="32" rx="0" fill="#EFF4F8" stroke="#285D96" stroke-width="1"/><text x="365.0" y="96.0" font-size="17" fill="#285D96" font-weight="600" text-anchor="middle">规则在1日至5日有效</text><line x1="365.0" y1="260" x2="365.0" y2="328" stroke="#16766B" stroke-width="2"/><text x="365.0" y="246.0" font-size="16" fill="#16766B" font-weight="400" text-anchor="middle">系统录入生效</text><line x1="865.0" y1="260" x2="865.0" y2="328" stroke="#16766B" stroke-width="2"/><text x="865.0" y="246.0" font-size="16" fill="#16766B" font-weight="400" text-anchor="middle">系统录入撤销</text><path d="M665.0 192 V390" fill="none" stroke="#A05720" stroke-width="1.4" stroke-dasharray="4 4"/><text x="665.0" y="430.0" font-size="17" fill="#A05720" font-weight="600" text-anchor="middle">回放10/6的决策</text><text x="80" y="474.0" font-size="18" fill="#182632" font-weight="600" text-anchor="start">真实有效期已经结束，但系统要到10/8才知道撤销。</text><line x1="26" y1="499.0" x2="934" y2="499.0" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="522.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">回放历史判断时同时固定“被问的时刻”和“当时已获知的资料”。不能把后来得知的信息偷放进过去的输入。</text></svg>