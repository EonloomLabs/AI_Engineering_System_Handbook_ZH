<svg xmlns="http://www.w3.org/2000/svg" class="d-svg" style="font-family:Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif;white-space:pre" viewBox="0 0 960 1030" role="img" aria-label="反向按真实依赖传递：两个残差点都要合并梯度"><title>反向按真实依赖传递：两个残差点都要合并梯度</title><rect width="960" height="1030" fill="white"/><text x="26" y="32.0" font-size="19" fill="#182632" font-weight="600" text-anchor="start">与教学模型 manual_backward 的计算对象逐项对应</text><rect x="110" y="94" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="120.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">dz = (p − onehot) / N</text><text x="124" y="145.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">输出概率与真实标签产生梯度</text><rect x="110" y="206" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="232.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">dU、dfinal → 最后RMSNorm反向</text><text x="124" y="257.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">得到 dhidden 与 dgf</text><rect x="110" y="318" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="344.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">FFN反向：W2 → ReLU → W1</text><text x="124" y="369.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">得到 dW2、dW1 与 dn2</text><rect x="110" y="430" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="456.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">第二RMSNorm反向并相加</text><text x="124" y="481.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">dresidual = dhidden + drnorm</text><rect x="110" y="542" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="568.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">Wo反向 → A @ V 反向</text><text x="124" y="593.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">得到 dWo、dA、dV</text><rect x="110" y="654" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="680.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">softmax反向 → Q/K/V投影反向</text><text x="124" y="705.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">得到 dWq、dWk、dWv 与 dn1</text><rect x="110" y="766" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="792.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">第一RMSNorm反向并相加</text><text x="124" y="817.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">dx = dresidual + dxnorm</text><rect x="110" y="878" width="570" height="78" rx="3" fill="white" stroke="#D6DFE6" stroke-width="1"/><text x="124" y="904.0" font-size="17" fill="#182632" font-weight="600" text-anchor="start">按Token与位置ID累计</text><text x="124" y="929.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">同一个Embedding行的贡献相加</text><line x1="395" y1="172" x2="395" y2="199" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,199.00 398.50,191.00 391.50,191.00"/><line x1="395" y1="284" x2="395" y2="311" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,311.00 398.50,303.00 391.50,303.00"/><line x1="395" y1="396" x2="395" y2="423" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,423.00 398.50,415.00 391.50,415.00"/><line x1="395" y1="508" x2="395" y2="535" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,535.00 398.50,527.00 391.50,527.00"/><line x1="395" y1="620" x2="395" y2="647" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,647.00 398.50,639.00 391.50,639.00"/><line x1="395" y1="732" x2="395" y2="759" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,759.00 398.50,751.00 391.50,751.00"/><line x1="395" y1="844" x2="395" y2="871" stroke="#285D96" stroke-width="1.6"/><polygon fill="#285D96" points="395.00,871.00 398.50,863.00 391.50,863.00"/><path d="M680 245 H724 V469 H688" fill="none" stroke="#16766B" stroke-width="2"/><line x1="710" y1="469" x2="688" y2="469" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="688.00,469.00 696.00,472.50 696.00,465.50"/><text x="740" y="355.0" font-size="15" fill="#16766B" font-weight="600" text-anchor="start">dhidden</text><path d="M110 469 H52 V805 H102" fill="none" stroke="#16766B" stroke-width="2"/><line x1="73" y1="805" x2="102" y2="805" stroke="#16766B" stroke-width="1.6"/><polygon fill="#16766B" points="102.00,805.00 94.00,801.50 94.00,808.50"/><text x="15" y="640.0" font-size="15" fill="#16766B" font-weight="600" text-anchor="start">dR</text><line x1="26" y1="973" x2="934" y2="973" stroke="#D6DFE6" stroke-width="1"/><text x="26" y="996.0" font-size="14" fill="#536473" font-weight="400" text-anchor="start">图的旁路是必须相加的梯度贡献，不是多余装饰。反向算出梯度后，参数仍须由优化器step更新。</text></svg>