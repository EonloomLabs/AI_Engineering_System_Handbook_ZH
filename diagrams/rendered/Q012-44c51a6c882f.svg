<svg aria-label="反向不是把前向箭头倒放，而是把“影响”按依赖分配" class="mx-svg" role="img" style='font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' viewBox="0 0 940 711" xmlns="http://www.w3.org/2000/svg"><title>反向不是把前向箭头倒放，而是把“影响”按依赖分配</title><rect fill="#fff" height="711" width="940" x="0" y="0"/><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="46.0">上游 dO</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="68"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="38" y="101.0">[1,1]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="178.0">对V0 / V1</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="200"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="38" y="233.0">[0.25,0.25] / [0.75,0.75]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="310.0">对P</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="332"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="38" y="365.0">[2,4]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="442.0">P加权的dP基线</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="464"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="38" y="497.0">0.25×2+0.75×4=3.5</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="16" font-weight="400" text-anchor="start" x="24" y="574.0">对分数S</text><rect fill="#eff4f8" height="55" rx="4" stroke="#d6dfe6" width="892" x="24" y="596"/><text fill="#182632" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="18" font-weight="650" text-anchor="start" x="38" y="629.0">[-0.375,+0.375]</text><text fill="#536473" font-family='"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif' font-size="14" font-weight="400" text-anchor="start" x="22" y="683.0">dS之和为0，反映统一平移两个分数不改变softmax。此图计算的是损失对中间量的影响。</text></svg>