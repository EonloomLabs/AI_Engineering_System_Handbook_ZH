<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 665" role="img" aria-label="残差路径如何汇合梯度"><title>残差路径如何汇合梯度</title><desc>独立标量例：x等于2，w等于0.5，y等于x加wx等于3，损失是y平方的一半。x的梯度由两条路径相加得到4.5。</desc><rect width="370" height="665" fill="white"/><text x="20" y="34.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">独立标量例：x=2，w=0.5</text><rect x="20" y="61" width="330" height="80" rx="6" fill="#f1f5fa"/><text x="37" y="91.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">前向：y = x + wx = 2 + 1 = 3</text><text x="37" y="121.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">L = ½y² = 4.5</text><line x1="185" y1="150" x2="185" y2="181" stroke="#a54139" stroke-width="2"/><path d="M 181.52027572711015 173.7964231811786 L 185 181 L 188.47972427288985 173.7964231811786" stroke="#a54139" stroke-width="2" fill="none"/><text x="20" y="218.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a54139" font-weight="650" text-anchor="start">从损失向回看：dL/dy = 3</text><rect x="20" y="250" width="330" height="98" rx="6" fill="#f8efee"/><text x="37" y="279.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a54139" font-weight="650" text-anchor="start">直接路径 y ← x</text><text x="37" y="315.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">对 x 的贡献：3 × 1 = 3</text><rect x="20" y="372" width="330" height="98" rx="6" fill="#f8efee"/><text x="37" y="401.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a54139" font-weight="650" text-anchor="start">乘法路径 y ← wx ← x</text><text x="37" y="437.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">对 x 的贡献：3 × 0.5 = 1.5</text><text x="20" y="524.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">汇合：dL/dx = 3 + 1.5 = 4.5</text><text x="20" y="563.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">另一个问题：dL/dw = 3 × x = 6</text><text x="20" y="608.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">两个求导对象不同，不能混写。</text></svg>