<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 395" role="img" aria-label="确认丢失时，两本账为什么不一致"><title>确认丢失时，两本账为什么不一致</title><desc>教学故障：下游提交成功后，确认消息丢失。宿主只能记为未知，先核验而不能认定失败。</desc><rect width="1040" height="395" fill="white"/><text x="20" y="66.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">宿主记录</text><text x="20" y="208.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">外部状态</text><text x="220" y="27.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="500" text-anchor="middle">发送</text><rect x="128" y="45" width="184" height="54" rx="6" fill="#f1f5fa"/><text x="220" y="78.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">等待确认</text><rect x="128" y="183" width="184" height="54" rx="6" fill="#e9f5f2"/><text x="220" y="216.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="middle">尚未改变</text><text x="480" y="27.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="500" text-anchor="middle">提交完成</text><rect x="388" y="45" width="184" height="54" rx="6" fill="#f1f5fa"/><text x="480" y="78.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">仍在等待</text><rect x="388" y="183" width="184" height="54" rx="6" fill="#e9f5f2"/><text x="480" y="216.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="middle">已经改变</text><text x="740" y="27.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="500" text-anchor="middle">确认丢失</text><rect x="648" y="45" width="184" height="54" rx="6" fill="#f1f5fa"/><text x="740" y="78.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">结果未知</text><rect x="648" y="183" width="184" height="54" rx="6" fill="#e9f5f2"/><text x="740" y="216.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="middle">仍然已改变</text><line x1="318" y1="72" x2="382" y2="72" stroke="#2558b5" stroke-width="2"/><path d="M 374.79642318117857 75.47972427288984 L 382 72 L 374.79642318117857 68.52027572711016" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="578" y1="72" x2="642" y2="72" stroke="#2558b5" stroke-width="2"/><path d="M 634.7964231811786 75.47972427288984 L 642 72 L 634.7964231811786 68.52027572711016" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="318" y1="210" x2="382" y2="210" stroke="#2558b5" stroke-width="2"/><path d="M 374.79642318117857 213.47972427288985 L 382 210 L 374.79642318117857 206.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="578" y1="210" x2="642" y2="210" stroke="#2558b5" stroke-width="2"/><path d="M 634.7964231811786 213.47972427288985 L 642 210 L 634.7964231811786 206.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="480" y1="174" x2="480" y2="111" stroke="#a54139" stroke-width="2" stroke-dasharray="5 5"/><path d="M 483.4797242728898 118.20357681882142 L 480 111 L 476.5202757271102 118.20357681882142" stroke="#a54139" stroke-width="2" fill="none"/><text x="510" y="145.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a54139" font-weight="400" text-anchor="start">确认消息没有送达</text><rect x="128" y="275" width="880" height="80" rx="6" fill="#f7f8fa"/><text x="150" y="305.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="600" text-anchor="start">正确后续：核对外部结果，保留原操作身份；确认后补记状态。</text><text x="150" y="333.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#a54139" font-weight="400" text-anchor="start">错误后续：把“未知”当“失败”，生成新操作ID后直接重做。</text></svg>