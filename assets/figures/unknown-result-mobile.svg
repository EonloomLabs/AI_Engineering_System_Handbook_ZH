<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 615" role="img" aria-label="确认丢失时，两本账为什么不一致"><title>确认丢失时，两本账为什么不一致</title><desc>教学故障：下游提交成功后，确认消息丢失。宿主只能记为未知，先核验而不能认定失败。</desc><rect width="370" height="615" fill="white"/><rect x="14" y="16" width="342" height="116" rx="6" fill="#f1f5fa"/><text x="28" y="42.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">发送动作</text><text x="28" y="73.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#202b3b" font-weight="400" text-anchor="start">宿主：等待确认</text><text x="28" y="101.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#167469" font-weight="400" text-anchor="start">外部：尚未改变</text><line x1="185" y1="135" x2="185" y2="153" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 145.7964231811786 L 185 153 L 188.47972427288985 145.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="156" width="342" height="116" rx="6" fill="#f1f5fa"/><text x="28" y="182.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">外部提交</text><text x="28" y="213.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#202b3b" font-weight="400" text-anchor="start">宿主：仍在等待</text><text x="28" y="241.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#167469" font-weight="400" text-anchor="start">外部：已经改变</text><line x1="185" y1="275" x2="185" y2="293" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 285.79642318117857 L 185 293 L 188.47972427288985 285.79642318117857" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="296" width="342" height="116" rx="6" fill="#f1f5fa"/><text x="28" y="322.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">确认丢失 / 超时</text><text x="28" y="353.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#202b3b" font-weight="400" text-anchor="start">宿主：结果未知</text><text x="28" y="381.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#167469" font-weight="400" text-anchor="start">外部：可能已经成功</text><text x="24" y="466.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">先读取结果，或按同一幂等键查询。</text><text x="24" y="500.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#a54139" font-weight="400" text-anchor="start">不要因为超时，换一个新ID再执行。</text><text x="24" y="545.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">只有确认“未发生”且允许重试，</text><text x="24" y="567.5" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">才进入受控重试路径。</text></svg>