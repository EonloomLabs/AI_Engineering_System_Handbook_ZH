<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-label="并行工作量和整项任务等待时间不是同一个数"><title>并行工作量和整项任务等待时间不是同一个数</title><desc>教学时间例：模型先40毫秒，随后读取20毫秒和搜索60毫秒并行，最后模型30毫秒。时间总和150毫秒，关键路径130毫秒。</desc><rect width="1040" height="430" fill="white"/><text x="25" y="28.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">同一任务的时间轴；所有数字为明确设定的教学值。</text><line x1="170.0" y1="57" x2="170.0" y2="302" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="3 5"/><text x="170.0" y="48.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="500" text-anchor="middle">0 ms</text><line x1="394.0" y1="57" x2="394.0" y2="302" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="3 5"/><text x="394.0" y="48.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="500" text-anchor="middle">40 ms</text><line x1="506.0" y1="57" x2="506.0" y2="302" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="3 5"/><text x="506.0" y="48.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="500" text-anchor="middle">60 ms</text><line x1="730.0" y1="57" x2="730.0" y2="302" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="3 5"/><text x="730.0" y="48.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="500" text-anchor="middle">100 ms</text><line x1="898.0" y1="57" x2="898.0" y2="302" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="3 5"/><text x="898.0" y="48.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="500" text-anchor="middle">130 ms</text><text x="25" y="109.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="600" text-anchor="start">模型步骤A</text><rect x="170.0" y="86" width="224.0" height="36" rx="6" fill="#eaf0fb"/><text x="282.0" y="110.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">40 ms</text><text x="25" y="166.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="600" text-anchor="start">读取工具</text><rect x="394.0" y="143" width="112.0" height="36" rx="6" fill="#eaf0fb"/><text x="450.0" y="167.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">20 ms</text><text x="25" y="223.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="600" text-anchor="start">搜索工具</text><rect x="394.0" y="200" width="336.0" height="36" rx="6" fill="#e9f5f2"/><text x="562.0" y="224.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="middle">60 ms</text><text x="25" y="280.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="600" text-anchor="start">模型步骤B</text><rect x="730.0" y="257" width="168.0" height="36" rx="6" fill="#eaf0fb"/><text x="814.0" y="281.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">30 ms</text><text x="25" y="350.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#167469" font-weight="650" text-anchor="start">墙钟时间：40 + max(20,60) + 30 = 130 ms</text><text x="25" y="390.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">工作量相加为150 ms。只缩短读取分支，搜索仍然要60 ms，因此本例总等待不变。</text></svg>