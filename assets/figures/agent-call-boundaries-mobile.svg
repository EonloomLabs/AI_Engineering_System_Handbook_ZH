<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 740" role="img" aria-label="同一个调用如何穿过模型、宿主和真实文件"><title>同一个调用如何穿过模型、宿主和真实文件</title><desc>工具提议不修改文件。宿主读取或修改工作区，将对应调用的结果带入下一次模型请求。最终还要验收。</desc><rect width="370" height="740" fill="white"/><rect x="14" y="16" width="342" height="96" rx="6" fill="#f1f5fa"/><text x="28" y="41.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="start">模型调用1：提出读取</text><text x="28" y="68.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#202b3b" font-weight="400" text-anchor="start">call_1 · read_file</text><text x="28" y="92.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">文件还没有变化</text><line x1="185" y1="114" x2="185" y2="132" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 124.79642318117858 L 185 132 L 188.47972427288985 124.79642318117858" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="135" width="342" height="96" rx="6" fill="#f1f5fa"/><text x="28" y="160.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">宿主与工具：读取文件</text><text x="28" y="187.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#202b3b" font-weight="400" text-anchor="start">rules.json → 空排除项 + 指纹</text><text x="28" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">把结果配回 call_1</text><line x1="185" y1="233" x2="185" y2="251" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 243.7964231811786 L 185 251 L 188.47972427288985 243.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="254" width="342" height="96" rx="6" fill="#f1f5fa"/><text x="28" y="279.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="start">模型调用2：提出修改</text><text x="28" y="306.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#202b3b" font-weight="400" text-anchor="start">call_2 · set_exclusion(vendor)</text><text x="28" y="330.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">此刻仍只是提议</text><line x1="185" y1="352" x2="185" y2="370" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 362.79642318117857 L 185 370 L 188.47972427288985 362.79642318117857" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="373" width="342" height="96" rx="6" fill="#f1f5fa"/><text x="28" y="398.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">宿主与工具：核对并写入</text><text x="28" y="425.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#202b3b" font-weight="400" text-anchor="start">指纹一致 → exclude_dirs=[vendor]</text><text x="28" y="449.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">外部状态在这里改变</text><line x1="185" y1="471" x2="185" y2="489" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 481.79642318117857 L 185 489 L 188.47972427288985 481.79642318117857" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="492" width="342" height="96" rx="6" fill="#f1f5fa"/><text x="28" y="517.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="start">模型调用3：请求检查</text><text x="28" y="544.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#202b3b" font-weight="400" text-anchor="start">call_3 · verify_index</text><text x="28" y="568.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">目标目录排除，相邻目录保留</text><line x1="185" y1="590" x2="185" y2="608" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 600.7964231811786 L 185 608 L 188.47972427288985 600.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="14" y="611" width="342" height="96" rx="6" fill="#f1f5fa"/><text x="28" y="636.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">模型调用4 + 宿主最终验收</text><text x="28" y="663.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#202b3b" font-weight="400" text-anchor="start">组织答复 ≠ 自动验收通过</text><text x="28" y="687.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">检查真实文件后，才判定任务结果</text></svg>