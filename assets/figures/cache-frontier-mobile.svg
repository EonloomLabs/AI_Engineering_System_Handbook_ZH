<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 740" role="img" aria-label="刚选出的Token为什么还不在KV缓存里"><title>刚选出的Token为什么还不在KV缓存里</title><desc>前向之后缓存只覆盖已经计算过的位置；接下来选出的Token，要等下一轮前向才写入缓存。</desc><rect width="370" height="740" fill="white"/><rect x="15" y="16" width="340" height="190" rx="6" fill="#f1f5fa"/><text x="31" y="46.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">第1轮 · prefill</text><text x="31" y="79.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">实际送入：BOS / 我 / 爱</text><text x="31" y="113.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">前向后缓存：3 个位置</text><text x="31" y="146.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="start">本轮选择：学习</text><text x="31" y="177.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">选中项尚未经过自己的前向</text><line x1="185" y1="210" x2="185" y2="226" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 218.7964231811786 L 185 226 L 188.47972427288985 218.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="15" y="231" width="340" height="190" rx="6" fill="#f1f5fa"/><text x="31" y="261.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">第2轮 · decode</text><text x="31" y="294.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">实际送入：学习</text><text x="31" y="328.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">前向后缓存：4 个位置</text><text x="31" y="361.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="start">本轮选择：！</text><text x="31" y="392.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">选中项尚未经过自己的前向</text><line x1="185" y1="425" x2="185" y2="441" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 433.79642318117857 L 185 441 L 188.47972427288985 433.79642318117857" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="15" y="446" width="340" height="190" rx="6" fill="#f1f5fa"/><text x="31" y="476.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">第3轮 · decode</text><text x="31" y="509.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">实际送入：！</text><text x="31" y="543.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">前向后缓存：5 个位置</text><text x="31" y="576.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="start">本轮选择：EOS</text><text x="31" y="607.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">选中项尚未经过自己的前向</text><text x="20" y="694.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="650" text-anchor="start">选到EOS即停止：本例缓存长度仍为5。</text></svg>