<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 690" role="img" aria-label="两句话里的“爱”怎样取得同一行数"><title>两句话里的“爱”怎样取得同一行数</title><desc>独立六项词表查表例：爱为编号2，向量为负零点三、零点八、零点一、零点五。增加的是特征轴，不是Token位置。</desc><rect width="370" height="690" fill="white"/><text x="20" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">输入仍是两个句子、三个位置</text><text x="20" y="73.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">“我／爱／学习”  →  [1, 2, 3]</text><text x="20" y="105.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">“你／爱／PAD”   →  [4, 2, 0]</text><line x1="185" y1="124" x2="185" y2="171" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 163.7964231811786 L 185 171 L 188.47972427288985 163.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><text x="202" y="151.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="400" text-anchor="start">编号2选第2行</text><rect x="20" y="187" width="330" height="110" rx="6" fill="#eaf0fb"/><text x="40" y="218.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="start">参数表 E 的第2行：爱</text><text x="40" y="253.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#202b3b" font-weight="600" text-anchor="start">[−0.3, 0.8, 0.1, 0.5]</text><text x="40" y="279.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">4个浮点特征，不是4个二进制位</text><line x1="185" y1="306" x2="185" y2="345" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 337.79642318117857 L 185 345 L 188.47972427288985 337.79642318117857" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="20" y="363" width="330" height="90" rx="6" fill="#f1f5fa"/><text x="37" y="394.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">第一句位置1：E[2]</text><text x="37" y="425.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="600" text-anchor="start">[−0.3, 0.8, 0.1, 0.5]</text><rect x="20" y="469" width="330" height="90" rx="6" fill="#f1f5fa"/><text x="37" y="500.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">第二句位置1：E[2]</text><text x="37" y="531.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="600" text-anchor="start">[−0.3, 0.8, 0.1, 0.5]</text><text x="20" y="606.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">输入形状 [2,3] → 输出 [2,3,4]</text><text x="20" y="638.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">两张表 × 每张三行 × 每行四个数</text></svg>