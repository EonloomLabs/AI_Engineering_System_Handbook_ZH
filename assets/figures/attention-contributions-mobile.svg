<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 970" role="img" aria-label="同一输入如何分工为Q、K和V，再汇成新的表示"><title>同一输入如何分工为Q、K和V，再汇成新的表示</title><desc>使用贯通模型更新前的真实记录，第一句位置2的爱。三张参数表不同，打分权重也不同于模型参数。</desc><rect width="370" height="970" fill="white"/><text x="18" y="30.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">更新前，“爱”的归一化表示 n</text><text x="18" y="62.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="600" text-anchor="start">[-0.426, 1.703, 0.000, 0.958]</text><rect x="18" y="100" width="334" height="110" rx="6" fill="#f1f5fa"/><text x="34" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="650" text-anchor="start">Q = nWq</text><text x="34" y="158.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">[-0.106, 0.160, -0.660, -0.394]</text><text x="34" y="188.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">当前位置用于匹配的表示</text><rect x="18" y="234" width="334" height="110" rx="6" fill="#f1f5fa"/><text x="34" y="262.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="650" text-anchor="start">K = nWk</text><text x="34" y="292.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">[0.830, 0.575, 0.330, 0.138]</text><text x="34" y="322.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">本位置供其他位置匹配的表示</text><rect x="18" y="368" width="334" height="110" rx="6" fill="#f1f5fa"/><text x="34" y="396.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="650" text-anchor="start">V = nWv</text><text x="34" y="426.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">[0.543, 0.798, -0.415, 0.298]</text><text x="34" y="456.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">本位置可传递的内容</text><text x="18" y="532.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">Q₂ 与可见的 K₀、K₁、K₂ 比较</text><text x="18" y="563.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">除以 √4，遮蔽未来，做Softmax。</text><text x="22" y="619.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">BOS</text><rect x="76" y="600" width="254" height="28" rx="6" fill="#f1f5fa"/><rect x="76" y="600" width="95.65460916815361" height="28" rx="4" fill="#dfeafb"/><text x="337" y="620.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="600" text-anchor="end">0.3766</text><text x="22" y="668.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">我</text><rect x="76" y="649" width="254" height="28" rx="6" fill="#f1f5fa"/><rect x="76" y="649" width="75.65689046908628" height="28" rx="4" fill="#dfeafb"/><text x="337" y="669.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="600" text-anchor="end">0.2979</text><text x="22" y="717.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">爱</text><rect x="76" y="698" width="254" height="28" rx="6" fill="#f1f5fa"/><rect x="76" y="698" width="82.68850036276012" height="28" rx="4" fill="#dfeafb"/><text x="337" y="718.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="600" text-anchor="end">0.3255</text><text x="18" y="786.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="start">输出 = Σ 读取份额 × 对应位置的 V</text><text x="18" y="825.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">[-0.445, 0.339, -0.184, -0.394]</text><text x="18" y="870.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">这是混合后的内部表示，不是文字。</text><text x="18" y="892.5" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">未来位置3、4的读取份额为0。</text></svg>