<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 405" role="img" aria-label="训练输入与下一Token目标错开一位"><title>训练输入与下一Token目标错开一位</title><desc>同一完整句子BOS我爱学习感叹号EOS。输入为前五项，标签为后五项；每个位置都预测下一项，不能把当前位置原样复制当作学习成功。</desc><rect width="1040" height="405" fill="white"/><text x="235" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="middle">BOS</text><text x="361" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="middle">我</text><text x="487" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="middle">爱</text><text x="613" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="middle">学习</text><text x="739" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="middle">！</text><text x="865" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="middle">EOS</text><text x="25" y="35.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#59677b" font-weight="400" text-anchor="start">完整句子</text><text x="25" y="123.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">模型输入 X</text><text x="25" y="231.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">预测标签 Y</text><rect x="175" y="83" width="124" height="56" rx="6" fill="#eaf0fb"/><text x="237" y="119.0" font-family="system-ui,-apple-system,Pin