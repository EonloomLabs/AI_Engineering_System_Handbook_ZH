e2" stroke-width="2"/><path d="M 849.5202757271102 174.7964231811786 L 853 182 L 856.4797242728898 174.7964231811786" stroke="#ccd5e2" stroke-width="2" fill="none"/><text x="853" y="277.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="500" text-anchor="middle">位置 4</text><text x="25" y="333.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="600" text-anchor="start">每一列是一道预测题。输入位置 t 预测原序列的 t+1，不是把输入原样当标签。</text><text x="25" y="369.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">本批两句话各有5个有效目标：平均损失的分母为10。因果掩码仍禁止读取未来输入。</text></svg>