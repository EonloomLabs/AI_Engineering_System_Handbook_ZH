<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-label="压缩只替换读过的前缀，不能吞掉后来到达的事件"><title>压缩只替换读过的前缀，不能吞掉后来到达的事件</title><desc>教学事件e1至e5。摘要只覆盖e1至e3；安装时验证版本，并把e4和e5原样留在摘要后。</desc><rect width="1040" height="450" fill="white"/><text x="24" y="38.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">捕获时</text><rect x="195" y="10" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="245.0" y="38.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e1</text><rect x="303" y="10" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="353.0" y="38.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e2</text><rect x="411" y="10" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="461.0" y="38.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e3</text><text x="24" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">生成期间</text><rect x="195" y="100" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="245.0" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e1</text><rect x="303" y="100" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="353.0" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e2</text><rect x="411" y="100" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="461.0" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e3</text><rect x="519" y="100" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="569.0" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e4 新到</text><rect x="627" y="100" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="677.0" y="128.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e5 新到</text><line x1="190" y1="169" x2="515" y2="169" stroke="#2558b5" stroke-width="2"/><text x="352" y="194.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#2558b5" font-weight="500" text-anchor="middle">摘要实际覆盖的前缀</text><line x1="520" y1="169" x2="732" y2="169" stroke="#167469" stroke-width="2"/><text x="626" y="194.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#167469" font-weight="500" text-anchor="middle">必须保留的实时尾部</text><text x="24" y="267.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">校验后安装</text><rect x="195" y="238" width="316" height="55" rx="6" fill="#eaf0fb"/><text x="353" y="272.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="middle">摘要(e1—e3)</text><rect x="519" y="243" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="569.0" y="271.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e4</text><rect x="627" y="243" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="677.0" y="271.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e5</text><polyline points="353,52 353,81" fill="none" stroke="#2558b5" stroke-width="2"/><line x1="353" y1="200" x2="353" y2="229" stroke="#2558b5" stroke-width="2"/><path d="M 349.5202757271102 221.7964231811786 L 353 229 L 356.4797242728898 221.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="195" y="335" width="810" height="76" rx="6" fill="#f1f5fa"/><text x="217" y="365.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="600" text-anchor="start">安装是一个带前提的状态替换：不是“摘要返回了，就覆盖整个历史”。</text><text x="217" y="392.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">核验历史代际、覆盖长度及实现要求的身份；变化不兼容时丢弃候选。</text></svg>