<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-label="刚选出的Token为什么还不在KV缓存里"><title>刚选出的Token为什么还不在KV缓存里</title><desc>前向之后缓存只覆盖已经计算过的位置；接下来选出的Token，要等下一轮前向才写入缓存。</desc><rect width="1040" height="470" fill="white"/><text x="25" y="31.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">本轮实际输入</text><text x="245" y="31.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">前向结束后的缓存</text><text x="505" y="31.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">据此选出下一个Token</text><text x="805" y="31.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="650" text-anchor="start">选择后如何继续</text><text x="25" y="92.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2558b5" font-weight="650" text-anchor="start">BOS / 我 / 爱</text><rect x="245" y="68" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="262" y="94.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">0</text><rect x="286" y="68" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="303" y="94.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">1</text><rect x="327" y="68" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="344" y="94.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">2</text><text x="245" y="134.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">长度 3；已有位置已算过</text><line x1="456" y1="88" x2="495" y2="88" stroke="#2558b5" stroke-width="2"/><path d="M 487.79642318117857 91.47972427288984 L 495 88 L 487.79642318117857 84.52027572711016" stroke="#2558b5" stroke-width="2" fill="none"/><text x="525" y="95.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#202b3b" font-weight="650" text-anchor="start">学习</text><text x="805" y="92.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="600" text-anchor="start">送入下一轮</text><text x="805" y="123.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">不在本轮新增缓存中</text><line x1="25" y1="155" x2="1006" y2="155" stroke="#ccd5e2" stroke-width="1"/><text x="25" y="204.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2558b5" font-weight="650" text-anchor="start">学习</text><rect x="245" y="180" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="262" y="206.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">0</text><rect x="286" y="180" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="303" y="206.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">1</text><rect x="327" y="180" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="344" y="206.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">2</text><rect x="368" y="180" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="385" y="206.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">3</text><text x="245" y="246.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">长度 4；已有位置已算过</text><line x1="456" y1="200" x2="495" y2="200" stroke="#2558b5" stroke-width="2"/><path d="M 487.79642318117857 203.47972427288985 L 495 200 L 487.79642318117857 196.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><text x="525" y="207.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#202b3b" font-weight="650" text-anchor="start">！</text><text x="805" y="204.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="600" text-anchor="start">送入下一轮</text><text x="805" y="235.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">不在本轮新增缓存中</text><line x1="25" y1="267" x2="1006" y2="267" stroke="#ccd5e2" stroke-width="1"/><text x="25" y="316.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2558b5" font-weight="650" text-anchor="start">！</text><rect x="245" y="292" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="262" y="318.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">0</text><rect x="286" y="292" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="303" y="318.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">1</text><rect x="327" y="292" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="344" y="318.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">2</text><rect x="368" y="292" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="385" y="318.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">3</text><rect x="409" y="292" width="34" height="40" rx="6" fill="#e9f5f2"/><text x="426" y="318.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="600" text-anchor="middle">4</text><text x="245" y="358.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">长度 5；已有位置已算过</text><line x1="456" y1="312" x2="495" y2="312" stroke="#2558b5" stroke-width="2"/><path d="M 487.79642318117857 315.4797242728898 L 495 312 L 487.79642318117857 308.5202757271102" stroke="#2558b5" stroke-width="2" fill="none"/><text x="525" y="319.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#202b3b" font-weight="650" text-anchor="start">EOS</text><text x="805" y="316.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="600" text-anchor="start">停止，不再处理EOS</text><text x="805" y="347.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">不在本轮新增缓存中</text><text x="25" y="439.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#59677b" font-weight="400" text-anchor="start">同一权重、同一输入的缓存与完整重算对照，才能检验复用是否正确。</text></svg>