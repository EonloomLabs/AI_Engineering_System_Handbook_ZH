<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-label="残差路径如何汇合梯度"><title>残差路径如何汇合梯度</title><desc>独立标量例：x等于2，w等于0.5，y等于x加wx等于3，损失是y平方的一半。x的梯度由两条路径相加得到4.5。</desc><rect width="1040" height="410" fill="white"/><text x="25" y="32.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">独立标量例：x=2，w=0.5；y=x+wx；L=½y²。不是贯通模型某层的实测梯度。</text><rect x="32" y="173" width="120" height="60" rx="6" fill="#f1f5fa"/><text x="92" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#202b3b" font-weight="650" text-anchor="middle">x = 2</text><rect x="320" y="82" width="175" height="62" rx="6" fill="#f1f5fa"/><text x="407" y="121.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#202b3b" font-weight="650" text-anchor="middle">wx = 1</text><rect x="590" y="173" width="135" height="60" rx="6" fill="#f1f5fa"/><text x="657" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#202b3b" font-weight="650" text-anchor="middle">y = 3</text><rect x="843" y="173" width="165" height="60" rx="6" fill="#f1f5fa"/><text x="925" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#202b3b" font-weight="650" text-anchor="middle">L = 4.5</text><polyline points="152,192 224,192 224,113 309,113" fill="none" stroke="#2558b5" stroke-width="2"/><line x1="224" y1="113" x2="309" y2="113" stroke="#2558b5" stroke-width="2"/><path d="M 301.79642318117857 116.47972427288984 L 309 113 L 301.79642318117857 109.52027572711016" stroke="#2558b5" stroke-width="2" fill="none"/><polyline points="495,113 555,113 555,190 579,190" fill="none" stroke="#2558b5" stroke-width="2"/><line x1="555" y1="190" x2="579" y2="190" stroke="#2558b5" stroke-width="2"/><path d="M 571.7964231811786 193.47972427288985 L 579 190 L 571.7964231811786 186.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><polyline points="152,216 240,216 240,276 550,276 550,218 580,218" fill="none" stroke="#2558b5" stroke-width="2"/><line x1="550" y1="218" x2="580" y2="218" stroke="#2558b5" stroke-width="2"/><path d="M 572.7964231811786 221.47972427288985 L 580 218 L 572.7964231811786 214.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="736" y1="202" x2="832" y2="202" stroke="#2558b5" stroke-width="2"/><path d="M 824.7964231811786 205.47972427288985 L 832 202 L 824.7964231811786 198.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><text x="788" y="180.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="600" text-anchor="middle">½y²</text><text x="220" y="73.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#a54139" font-weight="650" text-anchor="start">经乘法回传：3 × 0.5 = 1.5</text><text x="256" y="310.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#a54139" font-weight="650" text-anchor="start">直接通路回传：3 × 1 = 3</text><text x="750" y="252.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a54139" font-weight="650" text-anchor="start">dL/dy = 3</text><text x="30" y="370.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#167469" font-weight="650" text-anchor="start">对同一个 x 的贡献在分叉处相加：dL/dx = 4.5。对参数 w 则是 dL/dw = 3×2 = 6。</text></svg>