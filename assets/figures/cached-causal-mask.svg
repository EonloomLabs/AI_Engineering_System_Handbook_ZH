<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-label="缓存解码中的两个Query分别能看哪些Key"><title>缓存解码中的两个Query分别能看哪些Key</title><desc>已有3个缓存位置，新输入2个Token。Query绝对位置为3和4，不能使用从零起算的左上三角。</desc><rect width="1040" height="440" fill="white"/><text x="24" y="36.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">缓存位置 0、1、2；本轮Query是位置 3、4；Key覆盖位置 0—4。</text><text x="24" y="91.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">正确：Key位置 ≤ Query绝对位置</text><text x="548" y="91.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a54139" font-weight="650" text-anchor="start">错误：新Query重新从0数起</text><text x="24" y="119.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">Key的绝对位置</text><text x="64.0" y="155.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="500" text-anchor="middle">0</text><text x="144.0" y="155.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="500" text-anchor="middle">1</text><text x="224.0" y="155.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="500" text-anchor="middle">2</text><text x="304.0" y="155.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="500" text-anchor="middle">3</text><text x="384.0" y="155.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="500" text-anchor="middle">4</text><rect x="24" y="170" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="61.5" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#167469" font-weight="500" text-anchor="middle">可见</text><rect x="104" y="170" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="141.5" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#167469" font-weight="500" text-anchor="middle">可见</text><rect x="184" y="170" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="221.5" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#167469" font-weight="500" text-anchor="middle">可见</text><rect x="264" y="170" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="301.5" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#167469" font-weight="500" text-anchor="middle">可见</text><rect x="344" y="170" width="75" height="72" rx="4" fill="#f4f5f7"/><text x="381.5" y="211.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#59677b" font-weight="500" text-anchor="middle">禁止</text><text x="427" y="210.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#202b3b" font-weight="600" text-anchor="start">Q=3</text><rect x="24" y="247" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="61.5" y="288.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#167469" font-weight="500" text-anchor="middle">可见</text><rect x="104" y="247" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="141.5" y="288.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#167469" font-weight="500" text-anchor="middle">可见</text><rect x="184" y="247" width="75" height="72" rx="4" fill="#e8f3ef"/><text x="221.5" y="288.0" font-family="system-ui,-apple-system,PingFang SC,Microso