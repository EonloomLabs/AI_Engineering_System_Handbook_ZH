<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" role="img" aria-label="同一个调用如何穿过模型、宿主和真实文件"><title>同一个调用如何穿过模型、宿主和真实文件</title><desc>工具提议不修改文件。宿主读取或修改工作区，将对应调用的结果带入下一次模型请求。最终还要验收。</desc><rect width="1040" height="880" fill="white"/><text x="115" y="30.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="650" text-anchor="middle">模型：给出下一步提议</text><line x1="115" y1="49" x2="115" y2="791" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="4 5"/><text x="400" y="30.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="650" text-anchor="middle">宿主：检查、路由、回填</text><line x1="400" y1="49" x2="400" y2="791" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="4 5"/><text x="755" y="30.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="650" text-anchor="middle">工作区：真实文件与测试</text><line x1="755" y1="49" x2="755" y2="791" stroke="#ccd5e2" stroke-width="1" stroke-dasharray="4 5"/><line x1="115" y1="90" x2="400" y2="90" stroke="#2558b5" stroke-width="2"/><path d="M 392.79642318117857 93.47972427288984 L 400 90 L 392.79642318117857 86.52027572711016" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="79.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">call_1：读取 rules.json</text><line x1="400" y1="140" x2="755" y2="140" stroke="#167469" stroke-width="2"/><path d="M 747.7964231811786 143.47972427288985 L 755 140 L 747.7964231811786 136.52027572711015" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="129.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">校验路径 → 读文件</text><line x1="755" y1="190" x2="400" y2="190" stroke="#167469" stroke-width="2"/><path d="M 407.20357681882143 186.52027572711015 L 400 190 L 407.20357681882143 193.47972427288985" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="179.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">内容 + SHA-256 指纹</text><line x1="400" y1="240" x2="115" y2="240" stroke="#2558b5" stroke-width="2"/><path d="M 122.20357681882142 236.52027572711015 L 115 240 L 122.20357681882142 243.47972427288985" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="229.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">回填 call_1 结果 → 模型调用2</text><line x1="115" y1="290" x2="400" y2="290" stroke="#2558b5" stroke-width="2"/><path d="M 392.79642318117857 293.4797242728898 L 400 290 L 392.79642318117857 286.5202757271102" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="279.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">call_2：排除 vendor，附预期指纹</text><line x1="400" y1="340" x2="755" y2="340" stroke="#167469" stroke-width="2"/><path d="M 747.7964231811786 343.4797242728898 L 755 340 L 747.7964231811786 336.5202757271102" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="329.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">核对当前指纹 → 写入配置</text><line x1="755" y1="390" x2="400" y2="390" stroke="#167469" stroke-width="2"/><path d="M 407.20357681882143 386.5202757271102 L 400 390 L 407.20357681882143 393.4797242728898" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="379.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">返回写入结果，与 call_2 配对</text><line x1="400" y1="440" x2="115" y2="440" stroke="#2558b5" stroke-width="2"/><path d="M 122.20357681882142 436.5202757271102 L 115 440 L 122.20357681882142 443.4797242728898" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="429.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">回填 call_2 结果 → 模型调用3</text><line x1="115" y1="490" x2="400" y2="490" stroke="#2558b5" stroke-width="2"/><path d="M 392.79642318117857 493.4797242728898 L 400 490 L 392.79642318117857 486.5202757271102" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="479.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">call_3：请求 verify_index</text><line x1="400" y1="540" x2="755" y2="540" stroke="#167469" stroke-width="2"/><path d="M 747.7964231811786 543.4797242728898 L 755 540 L 747.7964231811786 536.5202757271102" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="529.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">运行 vendor / vendor2 / src 检查</text><line x1="755" y1="590" x2="400" y2="590" stroke="#167469" stroke-width="2"/><path d="M 407.20357681882143 586.5202757271102 L 400 590 L 407.20357681882143 593.4797242728898" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="579.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">返回检查结果，与 call_3 配对</text><line x1="400" y1="640" x2="115" y2="640" stroke="#2558b5" stroke-width="2"/><path d="M 122.20357681882142 636.5202757271102 L 115 640 L 122.20357681882142 643.4797242728898" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="629.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">回填 call_3 结果 → 模型调用4</text><line x1="115" y1="690" x2="400" y2="690" stroke="#2558b5" stroke-width="2"/><path d="M 392.79642318117857 693.4797242728898 L 400 690 L 392.79642318117857 686.5202757271102" stroke="#2558b5" stroke-width="2" fill="none"/><text x="257.5" y="679.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#2558b5" font-weight="500" text-anchor="middle">模型生成最终答复</text><line x1="400" y1="750" x2="755" y2="750" stroke="#167469" stroke-width="2"/><path d="M 747.7964231811786 753.4797242728898 L 755 750 L 747.7964231811786 746.5202757271102" stroke="#167469" stroke-width="2" fill="none"/><text x="577.5" y="739.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#167469" font-weight="500" text-anchor="middle">宿主独立核对当前文件与任务结果</text><rect x="796" y="317" width="212" height="28" rx="4" fill="#e9f5f2"/><text x="902.0" y="336.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#167469" font-weight="600" text-anchor="middle">副作用：真实配置被修改</text><text x="34" y="846.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">同一个 call_id 连接提议与返回值。最后一段答复不能代替宿主对当前文件的验收。</text></svg>