<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 660" role="img" aria-label="并行工作量和整项任务等待时间不是同一个数"><title>并行工作量和整项任务等待时间不是同一个数</title><desc>教学时间例：模型先40毫秒，随后读取20毫秒和搜索60毫秒并行，最后模型30毫秒。时间总和150毫秒，关键路径130毫秒。</desc><rect width="370" height="660" fill="white"/><rect x="20" y="20" width="330" height="75" rx="6" fill="#f1f5fa"/><text x="36" y="49.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="650" text-anchor="start">模型步骤A：40 ms</text><text x="36" y="77.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">两条工具分支在此之后启动</text><line x1="185" y1="105" x2="185" y2="140" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 132.7964231811786 L 185 140 L 188.47972427288985 132.7964231811786" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="20" y="158" width="152" height="133" rx="6" fill="#f1f5fa"/><rect x="190" y="158" width="160" height="133" rx="6" fill="#e9f5f2"/><text x="35" y="192.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="400" text-anchor="start">读取：20 ms</text><text x="35" y="226.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">先结束，</text><text x="35" y="254.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">等待搜索</text><text x="205" y="192.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">搜索：60 ms</text><text x="205" y="226.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">决定本段</text><text x="205" y="254.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="400" text-anchor="start">结束时刻</text><line x1="185" y1="303" x2="185" y2="342" stroke="#2558b5" stroke-width="2"/><path d="M 181.52027572711015 334.79642318117857 L 185 342 L 188.47972427288985 334.79642318117857" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="20" y="357" width="330" height="75" rx="6" fill="#f1f5fa"/><text x="36" y="386.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#2558b5" font-weight="650" text-anchor="start">模型步骤B：30 ms</text><text x="36" y="415.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">必须等两个工具结果齐备</text><text x="20" y="491.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="650" text-anchor="start">墙钟时间 = 40 + max(20,60) + 30</text><text x="20" y="526.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#167469" font-weight="650" text-anchor="start">= 130 ms</text><text x="20" y="574.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">工作量之和是150 ms，不能当等待时间。</text><text x="20" y="595.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#59677b" font-weight="400" text-anchor="start">仅把读取从20降到10，不会缩短本例。</text></svg>