<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-label="同一输入如何分工为Q、K和V，再汇成新的表示"><title>同一输入如何分工为Q、K和V，再汇成新的表示</title><desc>使用贯通模型更新前的真实记录，第一句位置2的爱。三张参数表不同，打分权重也不同于模型参数。</desc><rect width="1040" height="650" fill="white"/><rect x="22" y="26" width="980" height="67" rx="6" fill="#f7f8fa"/><text x="42" y="53.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">更新前 · 第一条训练句子 · 位置2“爱”</text><text x="42" y="79.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#202b3b" font-weight="600" text-anchor="start">n = [-0.426, 1.703, 0.000, 0.958]</text><line x1="177" y1="99" x2="177" y2="132" stroke="#2558b5" stroke-width="2"/><path d="M 173.52027572711015 124.79642318117858 L 177 132 L 180.47972427288985 124.79642318117858" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="22" y="143" width="314" height="120" rx="6" fill="#f1f5fa"/><text x="40" y="174.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#2558b5" font-weight="650" text-anchor="start">Q = nWq</text><text x="40" y="207.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">[-0.106, 0.160, -0.660, -0.394]</text><text x="40" y="241.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">当前位置想匹配什么</text><line x1="510" y1="99" x2="510" y2="132" stroke="#2558b5" stroke-width="2"/><path d="M 506.5202757271102 124.79642318117858 L 510 132 L 513.4797242728898 124.79642318117858" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="355" y="143" width="314" height="120" rx="6" fill="#f1f5fa"/><text x="373" y="174.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#2558b5" font-weight="650" text-anchor="start">K = nWk</text><text x="373" y="207.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">[0.830, 0.575, 0.330, 0.138]</text><text x="373" y="241.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">本位置如何被匹配</text><line x1="843" y1="99" x2="843" y2="132" stroke="#2558b5" stroke-width="2"/><path d="M 839.5202757271102 124.79642318117858 L 843 132 L 846.4797242728898 124.79642318117858" stroke="#2558b5" stroke-width="2" fill="none"/><rect x="688" y="143" width="314" height="120" rx="6" fill="#f1f5fa"/><text x="706" y="174.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#2558b5" font-weight="650" text-anchor="start">V = nWv</text><text x="706" y="207.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">[0.543, 0.798, -0.415, 0.298]</text><text x="706" y="241.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">本位置传递什么内容</text><text x="24" y="310.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">计算读取份额：Q₂ · Kⱼ / √4 → 因果遮蔽 → Softmax</text><text x="25" y="364.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">位置0 · BOS</text><rect x="168" y="342" width="320" height="32" rx="6" fill="#f1f5fa"/><rect x="168" y="342" width="120.50974383389432" height="32" rx="4" fill="#dfeafb"/><text x="500" y="364.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="600" text-anchor="start">0.376593</text><text x="25" y="421.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">位置1 · 我</text><rect x="168" y="399" width="320" height="32" rx="6" fill="#f1f5fa"/><rect x="168" y="399" width="95.3157675201087" height="32" rx="4" fill="#dfeafb"/><text x="500" y="421.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="600" text-anchor="start">0.297862</text><text x="25" y="478.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="400" text-anchor="start">位置2 · 爱</text><rect x="168" y="456" width="320" height="32" rx="6" fill="#f1f5fa"/><rect x="168" y="456" width="104.174488645997" height="32" rx="4" fill="#dfeafb"/><text x="500" y="478.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="600" text-anchor="start">0.325545</text><rect x="639" y="333" width="363" height="171" rx="6" fill="#e9f5f2"/><text x="660" y="363.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">按相同份额逐特征混合V</text><text x="660" y="400.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" fill="#167469" font-weight="650" text-anchor="start">Σⱼ A₂ⱼ Vⱼ</text><text x="660" y="437.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#202b3b" font-weight="600" text-anchor="start">[-0.445, 0.339, -0.184, -0.394]</text><text x="660" y="475.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">这里还不是词表概率或输出Token。</text><line x1="576" y1="418" x2="625" y2="418" stroke="#167469" stroke-width="2"/><path d="M 617.7964231811786 421.4797242728898 L 625 418 L 617.7964231811786 414.5202757271102" stroke="#167469" stroke-width="2" fill="none"/><text x="24" y="550.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="600" text-anchor="start">Wq / Wk / Wv：可训练参数，本图为初始化值。   Q / K / V：本轮临时计算结果。</text><text x="24" y="586.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">A：由当前输入动态算出的读取份额；位置3、4被遮蔽，份额为0。显示值做了舍入。</text></svg>