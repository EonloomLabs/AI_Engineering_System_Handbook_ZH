<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 650" role="img" aria-label="压缩只替换读过的前缀，不能吞掉后来到达的事件"><title>压缩只替换读过的前缀，不能吞掉后来到达的事件</title><desc>教学事件e1至e5。摘要只覆盖e1至e3；安装时验证版本，并把e4和e5原样留在摘要后。</desc><rect width="370" height="650" fill="white"/><text x="20" y="34.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">① 捕获摘要输入</text><rect x="20" y="52" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="70.0" y="80.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e1</text><rect x="128" y="52" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="178.0" y="80.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e2</text><rect x="236" y="52" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="286.0" y="80.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e3</text><text x="20" y="130.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">② 摘要在计算，前台继续</text><rect x="20" y="148" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="70.0" y="176.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e1</text><rect x="128" y="148" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="178.0" y="176.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e2</text><rect x="236" y="148" width="100" height="44" rx="6" fill="#eaf0fb"/><text x="286.0" y="176.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#2558b5" font-weight="650" text-anchor="middle">e3</text><rect x="20" y="200" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="70.0" y="228.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e4 新到</text><rect x="128" y="200" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="178.0" y="228.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e5 新到</text><text x="20" y="291.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">③ 安装前核对版本与身份</text><text x="20" y="323.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">旧前缀仍有效：只替换覆盖的部分。</text><text x="20" y="345.5" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#59677b" font-weight="400" text-anchor="start">发生回滚或相关条件改变：拒绝旧候选。</text><text x="20" y="402.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">④ 正确的新窗口</text><rect x="20" y="422" width="330" height="54" rx="6" fill="#eaf0fb"/><text x="185" y="455.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#2558b5" font-weight="650" text-anchor="middle">摘要(e1—e3)</text><rect x="20" y="490" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="70.0" y="518.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e4</text><rect x="128" y="490" width="100" height="44" rx="6" fill="#e9f5f2"/><text x="178.0" y="518.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#167469" font-weight="650" text-anchor="middle">e5</text><text x="20" y="582.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">被摘要替换的前缀，与实时尾部，</text><text x="20" y="606.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">是两段不同的数据。</text></svg>