<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-label="两句话里的“爱”怎样取得同一行数"><title>两句话里的“爱”怎样取得同一行数</title><desc>独立六项词表查表例：爱为编号2，向量为负零点三、零点八、零点一、零点五。增加的是特征轴，不是Token位置。</desc><rect width="1040" height="480" fill="white"/><text x="25" y="32.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#202b3b" font-weight="650" text-anchor="start">先定位句子与位置</text><text x="25" y="83.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="400" text-anchor="start">“我／爱／学习”</text><text x="25" y="113.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#2558b5" font-weight="650" text-anchor="start">[1, 2, 3]</text><text x="25" y="188.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="400" text-anchor="start">“你／爱／PAD”</text><text x="25" y="219.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#2558b5" font-weight="650" text-anchor="start">[4, 2, 0]</text><rect x="340" y="63" width="347" height="183" rx="6" fill="#eaf0fb"/><text x="364" y="94.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">同一个编号，选同一行</text><text x="364" y="143.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#202b3b" font-weight="600" text-anchor="start">E[2] = [−0.3, 0.8, 0.1, 0.5]</text><text x="364" y="183.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">行号2对应“爱”</text><text x="364" y="215.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">查表本身不看前后文</text><line x1="171" y1="110" x2="329" y2="126" stroke="#2558b5" stroke-width="2"/><path d="M 321.482492866739 128.73625410029288 L 329 126 L 322.18366116108115 121.8122171936636" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="171" y1="217" x2="329" y2="175" stroke="#2558b5" stroke-width="2"/><path d="M 322.9321370965825 180.21354387967816 L 329 175 L 321.14424671766034 173.48767054944716" stroke="#2558b5" stroke-width="2" fill="none"/><line x1="698" y1="153" x2="765" y2="153" stroke="#2558b5" stroke-width="2"/><path d="M 757.7964231811786 156.47972427288985 L 765 153 L 757.7964231811786 149.52027572711015" stroke="#2558b5" stroke-width="2" fill="none"/><text x="790" y="100.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">第一句位置1</text><text x="790" y="134.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">同一组4个数</text><text x="790" y="194.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#202b3b" font-weight="400" text-anchor="start">第二句位置1</text><text x="790" y="228.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#2558b5" font-weight="650" text-anchor="start">同一组4个数</text><line x1="25" y1="287" x2="1010" y2="287" stroke="#ccd5e2" stroke-width="1"/><text x="25" y="328.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#202b3b" font-weight="650" text-anchor="start">原来：每个位置是一个编号</text><text x="25" y="367.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#59677b" font-weight="400" text-anchor="start">形状 [2,3]：句子轴 × 位置轴</text><line x1="422" y1="340" x2="516" y2="340" stroke="#167469" stroke-width="2"/><path d="M 508.79642318117857 343.4797242728898 L 516 340 L 508.79642318117857 336.5202757271102" stroke="#167469" stroke-width="2" fill="none"/><text x="550" y="328.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#167469" font-weight="650" text-anchor="start">后来：每个位置是一排特征</text><text x="550" y="367.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#59677b" font-weight="400" text-anchor="start">形状 [2,3,4]：再增加特征轴</text><text x="25" y="430.0" font-family="system-ui,-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#59677b" font-weight="400" text-anchor="start">PAD是占位。向量全零也不能自动替代注意力掩码；后续还要按有效位置规则计算。</text></svg>